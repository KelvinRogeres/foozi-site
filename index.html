ação ou promessa; e</li>\n<li>tamanho adequado à tela.</li>\n</ol>\n<p>Não será criada uma plataforma genérica de guardrails.</p>"}, {"id": "4-7-fallback-do-llm", "level": 3, "title": "4.7. Fallback do LLM", "words": 38, "screens": ["estoque"], "html": "<p>Em timeout, falha ou resposta inválida, o fallback mostra média, mínimo, máximo, contagens, posições e diferenças objetivas aplicáveis, além das limitações factuais. Não cria hipótese sobre marca, volume, embalagem ou condição comercial e não oculta os números disponíveis.</p>"}, {"id": "4-8-rastreabilidade", "level": 3, "title": "4.8. Rastreabilidade", "words": 50, "screens": ["configuracoes"], "html": "<p>Operadores autorizados conseguem reproduzir o resultado por organização, localidades selecionadas, produto, período, versão de cálculo, observações próprias, conjunto de mercado usado, conversões, exclusões, oportunidade estimada, prompt, validação e correlation ID.</p>\n<p>A organização não recebe rastreabilidade bruta do mercado. Logs e metadados do LLM não contêm dados identificáveis de terceiros desnecessários.</p>"}, {"id": "5-experiencia-e-estados-da-interface", "level": 2, "title": "5. Experiência e estados da interface", "words": 206, "screens": [], "html": "<ol>\n<li>O comprador acessa <strong>IA &gt; Comparativo de Preços</strong>, mantém ou altera a seleção padrão de todas as cidades/UF disponíveis e escolhe produto e período.</li>\n<li>O BFF autentica, autoriza e chama o microsserviço.</li>\n<li>O serviço calcula conjuntamente, para as localidades selecionadas, histórico próprio e Referência de mercado Foozi.</li>\n<li>O serviço solicita e valida o insight.</li>\n<li>A UI mostra todas as perspectivas disponíveis, cobertura, limitações e insight ou fallback.</li>\n</ol>\n<p><strong>Meu histórico:</strong> nomes e métricas dos fornecedores próprios, condições observáveis e posição somente com dois ou mais fornecedores.</p>\n<p><strong>Referência de mercado Foozi:</strong> média, mínimo, máximo, quantidade de observações, localidades, período e unidade, sempre rotulados como agregados sem identificação da origem. Nunca inclui identidade ou registro externo de origem.</p>\n<p><strong>Oportunidade de economia:</strong> quando aplicável, percentual estimado pela diferença entre a média geral própria e a média da Referência de mercado Foozi, com explicação de que se refere ao preço unitário observado.</p>\n<p><strong>Estados:</strong></p>\n<ul>\n<li><strong>Carregando:</strong> mantém filtros e evita envio duplicado.</li>\n<li><strong>Resultado completo:</strong> as duas perspectivas estão disponíveis.</li>\n<li><strong>Resultado parcial:</strong> uma perspectiva fica visível e a outra informa dados insuficientes com motivo.</li>\n<li><strong>Dados insuficientes:</strong> nenhuma perspectiva calculável; explica separadamente o que falta em cada uma.</li>\n<li><strong>Erro técnico:</strong> permite nova tentativa e exibe correlation ID sem detalhes internos.</li>\n</ul>"}, {"id": "6-arquitetura-e-contratos-do-mvp", "level": 2, "title": "6. Arquitetura e contratos do MVP", "words": 227, "screens": [], "html": "<p>O Comparativo de Preços será um módulo do único microsserviço de <strong>Inteligência de Compras</strong>, executado como aplicação e processo independente dentro do monorepo. O microsserviço possui PostgreSQL e migrations próprios; o monólito continua dono dos dados operacionais.</p>\n<pre><code class=\"language-text\">Web -&gt; Monólito/BFF GraphQL -&gt; Microsserviço -&gt; PostgreSQL analítico\n                                      |\n                                      +-&gt; LLM ou fallback\n</code></pre>\n<p>O BFF é a única entrada pública e preserva a API GraphQL. Ele autentica, deriva as localidades das filiais autorizadas, valida a seleção e aplica todas por padrão; o microsserviço ingere projeções, filtra localidades, normaliza, agrega, calcula e gera insight; seu PostgreSQL guarda somente projeções reconstruíveis.</p>\n<p>A arquitetura hexagonal é enxuta:</p>\n<ul>\n<li><strong>Domínio:</strong> elegibilidade, normalização, agregações, cálculos e ranking.</li>\n<li><strong>Aplicação:</strong> casos de uso de ingestão e consulta do comparativo.</li>\n<li><strong>Portas:</strong> somente contratos com uso real para persistência, LLM, relógio e transporte de entrada.</li>\n<li><strong>Adaptadores:</strong> PostgreSQL, BFF, backfill/ingestão, LLM local ou remoto e, no marco seguinte, fila.</li>\n</ul>\n<p>Não devem existir camadas vazias, portas especulativas ou uma arquitetura genérica para outras análises.</p>\n<p>O modelo mínimo representa observação e condições da cotação, organização e fornecedor de origem para controle interno, vínculo da filial destinatária, snapshot da cidade/UF da cotação, produto comparável, unidade-base, status, data e versão.</p>\n<p>Devem existir acessos separados para histórico próprio e agregador de mercado. O agregador retorna somente estatísticas sem identificação da origem para as localidades selecionadas; nenhum contrato devolve observações externas ao BFF para agregação posterior.</p>"}, {"id": "6-1-ingestao-e-sincronizacao", "level": 3, "title": "6.1. Ingestão e sincronização", "words": 90, "screens": [], "html": "<p>Todo caminho de entrada chama um único caso de uso <code>IngestPriceObservation</code>. Seu contrato versionado simples contém:</p>\n<pre><code class=\"language-text\">eventId / schemaVersion / sourceVersion / occurredAt / sourceRecordId\norganizationId / quotationBranchId\nquotationRequestId / quotationItemId\nproductId / comparableProductKey / productName\nsupplierId / supplierName\nquotationCity / quotationState / quotationLocationKey\nprice / currency\nrequestedQuantity / unit / packaging / brand\ncommercialTerms disponíveis\nobservedAt / respondedAt / status\n</code></pre>\n<p><code>schemaVersion</code> versiona o formato do contrato; <code>sourceVersion</code> ordena alterações do registro de origem. A idempotência é simples: <code>eventId</code> já processado não produz novo efeito e, para o mesmo <code>sourceRecordId</code>, somente a maior <code>sourceVersion</code> permanece ativa. Correção, cancelamento ou invalidação substitui ou remove o efeito anterior.</p>"}, {"id": "6-2-marcos-de-entrega", "level": 3, "title": "6.2. Marcos de entrega", "words": 49, "screens": [], "html": "<p><strong>MVP local:</strong> backfill ou ingestão interna chama <code>IngestPriceObservation</code>; banco próprio, cálculo, BFF/UI e LLM local ou fallback executam a jornada completa sem credenciais externas.</p>\n<p><strong>Marco seguinte:</strong> adaptador SQS/LocalStack, DLQ e ingestão contínua chamam o mesmo caso de uso. SQS e DLQ não bloqueiam a primeira entrega demonstrável.</p>"}, {"id": "6-3-contrato-logico-da-consulta", "level": 3, "title": "6.3. Contrato lógico da consulta", "words": 226, "screens": [], "html": "<p>Entrada: <code>organizationId</code>, <code>locations[]</code>, <code>productId</code>, <code>periodPreset</code>, <code>requestedAt</code> e <code>correlationId</code>. Cada item de <code>locations[]</code> é uma chave estável de cidade/UF autorizada e ao menos um item é obrigatório.</p>\n<p>Saída mínima:</p>\n<pre><code class=\"language-text\">product / selectedLocations[] / period / comparisonUnit\nownHistory\n  status / reason?\n  overallAveragePrice?\n  suppliers[]\n    supplierId / supplierName\n    averagePrice / minPrice / maxPrice\n    observationCount / distinctDates / latestObservation\n    diffFromLowestPercent? / rank?\n    observations[]\n      observationId ou evidenceRef interno\n      originalPrice / normalizedPrice / observedAt\n      brand / requestedQuantity / unit / packaging\n      commercialTerms disponíveis\nfooziMarketReference\n  status / reason?\n  observedPriceAverage? / minPrice? / maxPrice?\n  observationCount? / distinctDates? / latestObservation?\n  exclusions / limitations[]\ncomparisonToMarket[]\n  supplierId / diffFromMarketAveragePercent\nsavingsOpportunity\n  status: ESTIMATED | NOT_IDENTIFIED | UNAVAILABLE\n  percent? / estimatedOn: UNIT_PRICE / reason?\ninsight\n  supplierInsights[] / marketInsight? / overallSummary / limitations[]\ninsightSource: LLM | TEMPLATE\ncalculationVersion / promptVersion / correlationId / analyzedAt\n</code></pre>\n<p><code>rank</code> e <code>diffFromLowestPercent</code> só existem com dois ou mais fornecedores próprios. A referência de mercado não contém nomes, IDs ou referências de origem externas. <code>supplierInsights</code> contém exatamente uma entrada para cada item de <code>ownHistory.suppliers</code>. Todos os resultados e insights registram <code>selectedLocations[]</code>.</p>\n<p>A jornada do MVP local usa PostgreSQL próprio em container e pode usar Ollama; deve funcionar sem credenciais externas por meio do fallback. No marco seguinte, LocalStack representa SQS/DLQ localmente. Em ambiente remoto, os adaptadores previstos são PostgreSQL gerenciado, AWS SQS e Vercel AI Gateway.</p>\n<p>O mesmo artefato do microsserviço é promovido para ambientes remotos por configuração e troca de adaptadores, sem reescrever domínio ou casos de uso. Os contratos de cálculo e privacidade permanecem iguais. Provisionamento detalhado e tracing avançado ficam fora desta feature.</p>"}, {"id": "7-seguranca-e-privacidade", "level": 2, "title": "7. Segurança e privacidade", "words": 183, "screens": [], "html": "<ol>\n<li>O BFF deriva a organização da sessão e autoriza produto e localidades a partir das filiais acessíveis.</li>\n<li>Chamadas internas são autenticadas.</li>\n<li>Histórico próprio é filtrado pela organização autorizada.</li>\n<li>Acesso entre organizações ocorre somente dentro do agregador de mercado controlado.</li>\n<li>O BFF rejeita cidade/UF fora das localidades derivadas das filiais autorizadas da organização.</li>\n<li>O agregador filtra produto, período, BRL, unidade e snapshot da cidade/UF da filial destinatária antes do cálculo.</li>\n<li>Saída de mercado e payload do LLM contêm somente estatísticas agregadas sem identificação da origem.</li>\n<li>Nenhuma organização consulta observações externas, nomes ou IDs de fornecedor e organização de origem, cotações ou itens de terceiros.</li>\n<li>Erros não confirmam a existência de dados de outra organização.</li>\n<li>Logs evitam dados pessoais e externos identificáveis desnecessários.</li>\n</ol>\n<p>“Romper a barreira” significa apenas permitir que o microsserviço produza a Referência de mercado Foozi agregada e desidentificada na saída; nunca liberar acesso cruzado aos dados de origem. Com uma única observação, o preço aparece nas três métricas, mas sua origem permanece omitida conforme o trade-off aprovado do MVP.</p>"}, {"id": "8-testes-minimos-do-mvp", "level": 2, "title": "8. Testes mínimos do MVP", "words": 145, "screens": [], "html": "<ol>\n<li><strong>Cálculo/agrupamento determinístico:</strong> localidades conjuntas, normalização, médias gerais, métricas, diferenças, oportunidade estimada, empates e ranking somente com dois fornecedores próprios.</li>\n<li><strong>Integração principal:</strong> fluxo do <code>IngestPriceObservation</code> à consulta e ao BFF, cobrindo histórico próprio, Referência de mercado Foozi e a fronteira que impede retornar observações externas.</li>\n<li><strong>Filtro de localidades:</strong> deriva cidades/UF autorizadas sem duplicatas, seleciona todas por padrão, rejeita seleção vazia ou não autorizada e usa o snapshot da filial destinatária.</li>\n<li><strong>UI/E2E:</strong> um fluxo com multisseleção, histórico identificado, mercado sem identificação da origem, uma observação de mercado permitida, oportunidade estimada, insight e cenário de um fornecedor próprio sem ranking.</li>\n<li><strong>LLM:</strong> schema exige exatamente um insight por fornecedor próprio; falha ou resposta inválida aciona fallback com números e diferenças objetivas, sem interpretação probabilística.</li>\n</ol>\n<p>Os testes também verificam motivo específico para ausência de filiais/localidades, histórico, mercado, unidade ou chave comparável.</p>"}, {"id": "9-comportamento-atual-e-lacunas", "level": 2, "title": "9. Comportamento atual e lacunas", "words": 67, "screens": [], "html": "<p>A implementação existente deve ser ajustada para garantir cálculo em código, série completa do período, multisseleção autorizada de cidades/UF, cálculo conjunto das localidades, perspectivas independentes, mercado não condicionado ao histórico próprio, ranking apenas com dois fornecedores, snapshot da filial destinatária, oportunidade estimada de economia, cada observação própria no LLM e agregado externo sem identificação da origem. RAG, embeddings, busca vetorial e cache não integram este caminho.</p>"}, {"id": "10-fora-do-mvp", "level": 2, "title": "10. Fora do MVP", "words": 65, "screens": [], "html": "<ul>\n<li>Compras efetivadas como fonte; ranking multicritério; detecção de outliers; sazonalidade e previsão.</li>\n<li>Cesta multiproduto, negociação ou compra automática.</li>\n<li>Normalização universal de produtos e embalagens.</li>\n<li>RAG, embeddings, banco vetorial, Redis e cache.</li>\n<li>Transactional Outbox, event sourcing, replay completo e plataforma genérica de eventos.</li>\n<li>Plataforma genérica de guardrails, agentes, múltiplas chamadas ou vários microsserviços de IA.</li>\n<li>Tracing avançado e testes de carga ou caos específicos desta entrega.</li>\n</ul>"}, {"id": "11-criterios-de-aceitacao", "level": 2, "title": "11. Critérios de aceitação", "words": 315, "screens": [], "html": "<ol>\n<li><strong>Localidades:</strong> opções são cidades/UF únicas derivadas das filiais autorizadas; todas começam selecionadas e a consulta exige ao menos uma.</li>\n<li><strong>Cálculo conjunto:</strong> as duas perspectivas usam, em uma única média cada, somente cotações destinadas às localidades selecionadas.</li>\n<li>Histórico e mercado são independentes e tudo que estiver disponível é exibido.</li>\n<li>Qualquer observação de mercado elegível gera a Referência de mercado Foozi, sem depender do histórico próprio.</li>\n<li>Fornecedores próprios aparecem por nome; a saída de mercado omite a origem externa.</li>\n<li>A cotação respondida e o snapshot da filial destinatária determinam a localidade histórica, sem depender de endereço ou cobertura atual do fornecedor.</li>\n<li>Uma observação própria por fornecedor ou de mercado produz resultado com contagem e limitação; métricas coincidentes não ocultam o resultado.</li>\n<li>Ranking próprio aparece somente com dois ou mais fornecedores; cada fornecedor é comparado ao mercado quando ambas as perspectivas existem.</li>\n<li>Um fornecedor próprio é comparado ao mercado sem ser chamado de ranking; sem histórico, somente a referência de mercado aparece.</li>\n<li>Cada resultado indisponível explica exatamente o dado faltante ou impedimento.</li>\n<li>Somente preços positivos em BRL, no período e em unidade comparável entram.</li>\n<li>Métricas, ranking e oportunidade estimada coincidem com memória de cálculo determinística.</li>\n<li>Quando a média da Referência de mercado Foozi é menor que a média geral própria, a oportunidade percentual usa a fórmula aprovada; sem média própria ou sem oportunidade, a UI explica o resultado.</li>\n<li>O LLM recebe cada observação própria elegível e produz exatamente um insight por fornecedor, além de insight do mercado e panorama geral.</li>\n<li>O texto usa hipótese e pode explicar oportunidade de economia fundamentada, sem causalidade ou garantia.</li>\n<li>O fallback mantém fatos objetivos sem interpretação probabilística.</li>\n<li>UI, GraphQL e payload do LLM omitem organização e fornecedor externos, cotação, item e qualquer referência externa de origem.</li>\n<li>Nenhum fluxo aprova cotação ou compra automaticamente.</li>\n</ol>"}, {"id": "12-metricas-do-piloto", "level": 2, "title": "12. Métricas do piloto", "words": 107, "screens": [], "html": "<ul>\n<li>100% dos números controlados conferem com a memória de cálculo.</li>\n<li>100% das consultas testadas respeitam organização, localidades autorizadas, produto e período.</li>\n<li>Zero nomes, IDs, cotações, itens ou referências externas de origem nas saídas testadas.</li>\n<li>100% dos números e condições mencionados pelo LLM existem no payload.</li>\n<li>Falha do LLM não reduz a disponibilidade numérica.</li>\n<li>Medir cobertura de histórico e mercado, incidência de base com uma observação, oportunidades estimadas, tempo versus análise manual, compreensão, utilidade e uso em negociação.</li>\n</ul>\n<p>Em evolução futura, medir a economia realizada após a compra. O MVP mede a oportunidade sobre o preço unitário observado, sem usar um percentual fixo como critério automático de aceite.</p>"}, {"id": "13-dependencias-e-decisoes-de-implementacao", "level": 2, "title": "13. Dependências e decisões de implementação", "words": 77, "screens": [], "html": "<ul>\n<li>Campos/eventos atuais de cotações respondidas e chave existente de produto comparável.</li>\n<li>Fatores de unidade/embalagem, vínculo da filial destinatária e snapshot de cidade/UF da cotação.</li>\n<li>Campos disponíveis de marca, quantidade e condições comerciais.</li>\n<li><code>observedAt</code>, contrato GraphQL e contrato interno.</li>\n<li>Provedor/modelo, timeout, tokens, prompt e schema simples do LLM.</li>\n<li>Responsabilidade operacional pelo banco analítico e ingestão.</li>\n</ul>\n<p>A autorização comercial do uso agregado e desidentificado na saída já foi validada. Nenhuma dependência autoriza inferir informação ausente.</p>"}, {"id": "14-riscos-e-mitigacao", "level": 2, "title": "14. Riscos e mitigação", "words": 170, "screens": [], "html": "<table>\n<thead>\n<tr>\n<th>Risco</th>\n<th>Mitigação pragmática</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Base pequena induz interpretação excessiva</td>\n<td>Mostrar contagem, recência e limitação sem ocultar dado disponível.</td>\n</tr>\n<tr>\n<td>Produto/unidade não comparável</td>\n<td>Excluir com motivo e informar o dado ausente.</td>\n</tr>\n<tr>\n<td>Cotação sem snapshot confiável de cidade/UF</td>\n<td>Excluir com motivo; não reconstruir o histórico pelo endereço atual.</td>\n</tr>\n<tr>\n<td>Seleção vazia ou cidade/UF não autorizada</td>\n<td>Exigir ao menos uma localidade e validar contra filiais autorizadas.</td>\n</tr>\n<tr>\n<td>Inferência sobre a origem de uma referência com base pequena</td>\n<td>Omitir toda identificação da origem, expor contagem e avisar que uma observação faz média, mínimo e máximo coincidirem; não impor amostra mínima.</td>\n</tr>\n<tr>\n<td>Mínimo de mercado confundido com oferta</td>\n<td>Rotular como referência histórica agregada.</td>\n</tr>\n<tr>\n<td>Oportunidade estimada confundida com economia realizada</td>\n<td>Explicar que se refere ao preço unitário e depende de decisão, quantidade e condições finais.</td>\n</tr>\n<tr>\n<td>Condições incompletas</td>\n<td>Analisar apenas campos registrados e declarar limites.</td>\n</tr>\n<tr>\n<td>LLM inventa fato ou causalidade</td>\n<td>Payload fechado, validações específicas e fallback.</td>\n</tr>\n<tr>\n<td>Ranking interpretado como recomendação</td>\n<td>Restringir ao preço histórico e manter decisão humana.</td>\n</tr>\n<tr>\n<td>Dado desatualizado</td>\n<td>Exibir data de corte/recência e permitir backfill manual.</td>\n</tr>\n</tbody>\n</table>"}, {"id": "15-definicao-de-pronto", "level": 2, "title": "15. Definição de Pronto", "words": 106, "screens": [], "html": "<p>O MVP está pronto quando o processo independente, banco e migrations próprios estão definidos; backfill/ingestão interna chama <code>IngestPriceObservation</code>; localidades autorizadas e snapshots históricos funcionam; cálculos conjuntos, comparações e oportunidade estimada são determinísticos; o agregador omite a origem externa; a jornada local funciona sem credenciais; a matriz de disponibilidade aparece corretamente; ranking exige dois fornecedores próprios; contagens e limitações aparecem com uma observação; dados insuficientes têm motivo claro; o LLM produz um insight por fornecedor; fallback objetivo funciona; os cinco grupos de testes passam; a API pública continua GraphQL; SQS/DLQ permanecem no marco seguinte; não há compra automática; e produto e engenharia aprovam o piloto.</p>"}, {"id": "16-glossario", "level": 2, "title": "16. Glossário", "words": 194, "screens": [], "html": "<ul>\n<li><strong>Agregador de mercado:</strong> consulta interna que filtra dados externos elegíveis nas localidades selecionadas e retorna estatísticas sem identificação da origem.</li>\n<li><strong>Condições observáveis:</strong> marca, quantidade, unidade, embalagem, data e termos comerciais registrados.</li>\n<li><strong>Dados insuficientes:</strong> ausência do necessário para um resultado específico, com explicação do que falta.</li>\n<li><strong>Fornecedor próprio:</strong> fornecedor identificado em cotação da organização ativa.</li>\n<li><strong>Localidade:</strong> chave estável de cidade/UF derivada de uma filial autorizada.</li>\n<li><strong>Oportunidade estimada de economia:</strong> diferença percentual positiva entre a média geral própria e uma média menor da Referência de mercado Foozi, aplicada ao preço unitário observado.</li>\n<li><strong>Referência de mercado Foozi:</strong> preços comparáveis disponíveis na base Foozi para as localidades e o período selecionados, agregados e com origem externa omitida.</li>\n<li><strong>Meu histórico:</strong> cotações da organização ativa agrupadas por fornecedor conhecido.</li>\n<li><strong>Observação:</strong> item de preço elegível de uma cotação respondida.</li>\n<li><strong>Preço normalizado:</strong> preço em BRL convertido explicitamente à unidade-base.</li>\n<li><strong>Produto comparável:</strong> produto ligado por chave de equivalência explícita.</li>\n<li><strong>Ranking próprio:</strong> ordenação de dois ou mais fornecedores próprios pelo preço médio normalizado.</li>\n<li><strong>Snapshot da localidade:</strong> cidade/UF da filial destinatária preservada junto à cotação para manter o contexto histórico.</li>\n<li><strong>Rastreabilidade:</strong> reprodução operacional do resultado sem expor dados externos à organização consumidora.</li>\n</ul>"}, {"id": "17-fontes-de-contexto", "level": 2, "title": "17. Fontes de contexto", "words": 34, "screens": [], "html": "<ul>\n<li>Implementação atual em <code>apps/backend/src/modules/ai-engine/analyses/price-comparison</code>.</li>\n<li>Tela atual em <code>apps/web/src/app/(dashboard)/ia/comparativo-precos</code>.</li>\n</ul>\n<p>Esta SPEC não transforma comportamento parcial do código em compromisso final.</p>"}]}, {"id": "readme", "path": "03-design-system/README.md", "title": "Design System — leia primeiro", "group": "03 · Design System", "words": 523, "sections": [{"id": "_intro", "level": 1, "title": "Design System — leia primeiro", "words": 14, "screens": [], "html": "<p>Este é o material de onboarding do design system da <strong>Foozi</strong>. Comece por aqui.</p>\n<hr />"}, {"id": "nome-e-descricao", "level": 2, "title": "Nome e descrição", "words": 127, "screens": [], "html": "<p><strong>Nome:</strong> Foozi Design System</p>\n<p><strong>Descrição:</strong></p>\n<blockquote>\n<p>A Foozi é um SaaS B2B de gestão de compras para foodservice. Conduz o ciclo completo — requisição, cotação, mapa comparativo e ordem de compra — para redes de restaurantes com múltiplas filiais, substituindo cotações por WhatsApp e planilhas avulsas por um processo digital e auditável.</p>\n<p>A interface serve dois públicos opostos: o comprador interno, que passa o dia em telas densas de dados e precisa de precisão para decidir; e o fornecedor externo, que acessa por link temporário sem cadastro, uma vez, sem treinamento — e para quem qualquer atrito vira abandono.</p>\n<p>Visual sóbrio e funcional. Índigo como cor de ação, verde para confirmação, âmbar para atenção e vermelho para bloqueio. Densidade alta em tabelas e matrizes comparativas, com respiro nas telas de decisão.</p>\n</blockquote>\n<hr />"}, {"id": "ordem-de-leitura", "level": 2, "title": "Ordem de leitura", "words": 71, "screens": [], "html": "<table>\n<thead>\n<tr>\n<th>#</th>\n<th>Arquivo</th>\n<th>O que contém</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>1</td>\n<td><code>design-tokens.json</code></td>\n<td><strong>Fonte de verdade.</strong> Cores, tipografia, raio, espaçamento, sombra e layout no formato W3C Design Tokens</td>\n</tr>\n<tr>\n<td>2</td>\n<td><code>design-tokens.css</code></td>\n<td>Os mesmos tokens como CSS custom properties</td>\n</tr>\n<tr>\n<td>3</td>\n<td><code>componentes.md</code></td>\n<td>Inventário de componentes com variantes e estados</td>\n</tr>\n<tr>\n<td>4</td>\n<td><code>telas.md</code></td>\n<td>Inventário de telas e fluxos</td>\n</tr>\n<tr>\n<td>5</td>\n<td><code>marca/logo-foozi-principal.svg</code></td>\n<td>Logo oficial — marca + assinatura</td>\n</tr>\n<tr>\n<td>6</td>\n<td><code>referencia/</code></td>\n<td>Protótipo navegável e documento do design system</td>\n</tr>\n</tbody>\n</table>\n<hr />"}, {"id": "decisoes-de-marca", "level": 2, "title": "Decisões de marca", "words": 106, "screens": [], "html": "<p><strong>Primária: <code>#4F4FEA</code></strong> — é a cor do logo, e tem contraste de 5,77:1 sobre branco.</p>\n<blockquote>\n<p><strong>Atenção:</strong> os arquivos em <code>referencia/</code> ainda usam <code>#6C5CE7</code> (4,86:1) como primária de interface. Essa divergência é conhecida e está em migração. <strong>Prevaleça o <code>#4F4FEA</code> do <code>design-tokens.json</code></strong> e trate o <code>#6C5CE7</code> apenas como valor legado.</p>\n</blockquote>\n<p><strong>Tipografia:</strong> Sora para títulos e números de destaque, Inter para corpo e dados de tabela. Ambas do Google Fonts.</p>\n<p><strong>Verde <code>#17864A</code></strong> é reservado para ações positivas irreversíveis — enviar cotação, aprovar ordem de compra. Não usar como cor decorativa.</p>\n<p><strong>Preto <code>#101010</code></strong> é ação neutra de alto peso (Download, Continuar), não é a primária.</p>\n<hr />"}, {"id": "principios-que-devem-guiar-qualquer-tela-nova", "level": 2, "title": "Princípios que devem guiar qualquer tela nova", "words": 134, "screens": [], "html": "<ol>\n<li>\n<p><strong>Densidade é requisito, não defeito.</strong> O comprador compara dezenas de itens por dia. Espaço em branco em excesso obriga scroll e piora a decisão.</p>\n</li>\n<li>\n<p><strong>O fornecedor externo não tem treinamento.</strong> Toda tela do portal precisa funcionar na primeira visita, sem tutorial, sem cadastro, no celular.</p>\n</li>\n<li>\n<p><strong>Ação irreversível precisa parecer irreversível.</strong> Enviar cotação dispara mensagem para dezenas de fornecedores. Salvar rascunho e enviar nunca podem parecer o mesmo botão.</p>\n</li>\n<li>\n<p><strong>Cor nunca é o único canal.</strong> Todo estado tem seta, ícone ou rótulo além da cor — WCAG 1.4.1.</p>\n</li>\n<li>\n<p><strong>Um conceito, um nome.</strong> Requisição, Cotação, Proposta, Mapa de Cotação e Ordem de Compra são objetos distintos e não podem ser usados como sinônimos.</p>\n</li>\n<li>\n<p><strong>Contraste mínimo 4,5:1</strong> para texto. <code>#98A2B3</code> só em placeholder e hint, nunca em conteúdo.</p>\n</li>\n</ol>\n<hr />"}, {"id": "o-que-este-pacote-nao-resolve", "level": 2, "title": "O que este pacote não resolve", "words": 71, "screens": [], "html": "<ul>\n<li>A <strong>interatividade</strong> dos protótipos em <code>referencia/</code> é JavaScript puro e não deve ser importada — datepicker, componente de distribuição de gastos e skeleton foram escritos à mão e serão recriados.</li>\n<li>Os arquivos <code>.dc.html</code> usam formato de canvas de outra ferramenta. Servem como referência visual, não como componente.</li>\n<li>Os protótipos usam estilo inline em boa parte do markup. <strong>Os tokens em <code>design-tokens.json</code> são mais confiáveis que a varredura do HTML.</strong></li>\n</ul>"}]}, {"id": "componentes", "path": "03-design-system/componentes.md", "title": "Componentes", "group": "03 · Design System", "words": 721, "sections": [{"id": "_intro", "level": 1, "title": "Componentes", "words": 15, "screens": [], "html": "<p>Componentes existentes no produto, com variantes e estados. Referência visual em <code>referencia/foozi-prototipo.html</code>.</p>\n<hr />"}, {"id": "botao", "level": 2, "title": "Botão", "words": 111, "screens": [], "html": "<p>Altura 40px · raio 8px · fonte Inter 14px/500 · padding 10×16</p>\n<table>\n<thead>\n<tr>\n<th>Variante</th>\n<th>Fundo</th>\n<th>Texto</th>\n<th>Uso</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td><strong>Primária</strong></td>\n<td><code>#4F4FEA</code></td>\n<td>branco</td>\n<td>CTA principal da tela</td>\n</tr>\n<tr>\n<td><strong>Confirmar</strong></td>\n<td><code>#17864A</code></td>\n<td>branco</td>\n<td>Ação positiva irreversível: Enviar para cotação, Aprovar OC</td>\n</tr>\n<tr>\n<td><strong>Neutra forte</strong></td>\n<td><code>#101010</code></td>\n<td>branco</td>\n<td>Download, Continuar, Criar lista</td>\n</tr>\n<tr>\n<td><strong>Destrutiva</strong></td>\n<td><code>#F04438</code></td>\n<td>branco</td>\n<td>Excluir, recusar</td>\n</tr>\n<tr>\n<td><strong>Outline</strong></td>\n<td>branco + borda <code>#E4E7EC</code></td>\n<td><code>#101828</code></td>\n<td>Ação secundária</td>\n</tr>\n<tr>\n<td><strong>Outline índigo</strong></td>\n<td>branco + borda <code>#C7C0F5</code></td>\n<td><code>#4F4FEA</code></td>\n<td>Insights da IA</td>\n</tr>\n<tr>\n<td><strong>Cinza</strong></td>\n<td><code>#F2F2F5</code></td>\n<td><code>#344054</code></td>\n<td>Ação terciária dentro de card</td>\n</tr>\n</tbody>\n</table>\n<p><strong>Estados:</strong> repouso · hover (<code>filter: brightness(.94)</code>) · pressionado (<code>scale(.985)</code>) · <strong>desabilitado</strong> (<code>#F2F4F7</code> / <code>#667085</code>, <code>aria-disabled</code>, cursor bloqueado) · foco (anel 2px <code>#4F4FEA</code>, offset 2px)</p>\n<p><strong>Tamanhos:</strong> padrão · <code>sm</code> (7×12, 13px) · ícone (38×38 quadrado)</p>\n<blockquote>\n<p>Botão só-ícone exige sempre <code>aria-label</code> <strong>e</strong> <code>title</code>.</p>\n</blockquote>\n<hr />"}, {"id": "campo-de-formulario", "level": 2, "title": "Campo de formulário", "words": 46, "screens": [], "html": "<p>Input, select e textarea compartilham: raio 9px · borda <code>#E4E7EC</code> · padding 10×13 · fonte 14px · sombra sutil</p>\n<p><strong>Estados:</strong> repouso · foco (borda <code>#4F4FEA</code> + halo <code>0 0 0 3px #EEEBFE</code>) · preenchido · erro (borda <code>#F04438</code> + mensagem abaixo) · desabilitado · somente leitura</p>\n<p><strong>Regra:</strong> rótulo persistente acima do campo. Placeholder nunca substitui rótulo.</p>\n<hr />"}, {"id": "tag-badge-de-status", "level": 2, "title": "Tag / Badge de status", "words": 51, "screens": [], "html": "<p>Raio 7px · padding 4×10 · fonte 12,5px/500</p>\n<table>\n<thead>\n<tr>\n<th>Estado</th>\n<th>Fundo</th>\n<th>Texto</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Rascunho</td>\n<td><code>#F2F4F7</code></td>\n<td><code>#475467</code></td>\n</tr>\n<tr>\n<td>Aguardando respostas</td>\n<td><code>#DBEAFE</code></td>\n<td><code>#175CD3</code></td>\n</tr>\n<tr>\n<td>Prazo encerrado</td>\n<td><code>#FEF0C7</code></td>\n<td><code>#B54708</code></td>\n</tr>\n<tr>\n<td>Em análise</td>\n<td><code>#EEEBFE</code></td>\n<td><code>#5546C9</code></td>\n</tr>\n<tr>\n<td>Pedido emitido</td>\n<td><code>#D1FADF</code></td>\n<td><code>#027A48</code></td>\n</tr>\n<tr>\n<td>Cancelada</td>\n<td><code>#FEE4E2</code></td>\n<td><code>#B42318</code></td>\n</tr>\n</tbody>\n</table>\n<blockquote>\n<p>Estes seis estados formam o ciclo de vida completo da requisição. Não criar rótulos fora desta lista.</p>\n</blockquote>\n<hr />"}, {"id": "chip-semantico", "level": 2, "title": "Chip semântico", "words": 40, "screens": [], "html": "<p>Usado nas colunas Marcas e Fornecedores. Três variantes com significado declarado:</p>\n<table>\n<thead>\n<tr>\n<th>Variante</th>\n<th>Aparência</th>\n<th>Significa</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td><strong>Vazio</strong></td>\n<td>tracejado índigo</td>\n<td>nada definido — convida a preencher</td>\n</tr>\n<tr>\n<td><strong>Definido</strong></td>\n<td>branco + borda neutra</td>\n<td>há seleção, mostra a contagem</td>\n</tr>\n<tr>\n<td><strong>Irrestrito</strong></td>\n<td>índigo claro sólido</td>\n<td>qualquer marca / qualquer fornecedor aceito</td>\n</tr>\n</tbody>\n</table>\n<hr />"}, {"id": "pill-de-categoria", "level": 2, "title": "Pill de categoria", "words": 20, "screens": [], "html": "<p>Raio 99px · padding 9×17 · fonte 13px/500. Estado ativo em <code>#101010</code> com texto branco. Usado em filtros horizontais roláveis.</p>\n<hr />"}, {"id": "card", "level": 2, "title": "Card", "words": 42, "screens": [], "html": "<p>Fundo branco · borda <code>#EAECF0</code> · raio 12px · sombra <code>0 1px 3px rgba(16,24,40,.06)</code> · padding 20–26px</p>\n<p><strong>Variantes:</strong> padrão · KPI (com ícone no canto e número em Sora 27px) · card de fornecedor (cabeçalho + corpo + rodapé com ações) · estado vazio (borda tracejada)</p>\n<hr />"}, {"id": "tabela", "level": 2, "title": "Tabela", "words": 43, "screens": [], "html": "<p>Cabeçalho fundo branco, fonte 13,5px/400 em <code>#667085</code>, borda inferior <code>#EAECF0</code>. Células padding 14px, fonte 14px. Divisor <code>#F2F4F7</code>. Hover de linha <code>#FCFCFD</code>. Sem bordas externas.</p>\n<p><strong>Requisitos:</strong> <code>&lt;caption&gt;</code> acessível oculto · scroll horizontal em contêiner próprio · coluna de ações à direita com largura fixa</p>\n<hr />"}, {"id": "matriz-comparativa", "level": 2, "title": "Matriz comparativa", "words": 51, "screens": [], "html": "<p>Componente exclusivo do Mapa de Cotação. Cabeçalho <code>#5B4BE0</code> com texto branco, uma linha, resumo do fornecedor embutido. Célula vencedora com borda <code>#12B76A</code> 2px, fundo <code>#ECFDF3</code> e selo flutuante \"★ MELHOR PREÇO\". Célula perdedora mostra comparativo percentual contra o melhor preço.</p>\n<blockquote>\n<p>É a tela onde a compra é decidida. Legibilidade prevalece sobre estética.</p>\n</blockquote>\n<hr />"}, {"id": "modal", "level": 2, "title": "Modal", "words": 53, "screens": [], "html": "<p>Fundo branco · raio 12px · sombra <code>0 20px 50px rgba(0,0,0,.30)</code> · padding 26px · overlay <code>rgba(16,10,40,.6)</code></p>\n<p><strong>Larguras:</strong> 440px (confirmação) · 510px (formulário curto) · 700px (formulário longo)</p>\n<p><strong>Estrutura:</strong> título + descrição + botão fechar → corpo → rodapé com ações alinhadas à direita</p>\n<p><strong>Regra:</strong> ação destrutiva exige justificativa textual antes de habilitar a confirmação.</p>\n<hr />"}, {"id": "dropdown", "level": 2, "title": "Dropdown", "words": 31, "screens": [], "html": "<p>Fundo branco · borda <code>#EAECF0</code> · raio 10px · sombra <code>0 10px 30px rgba(16,24,40,.16)</code> · padding 6px. Itens com raio 7px e hover <code>#F7F7F9</code>. Fecha ao clicar fora, <code>Esc</code> ou selecionar.</p>\n<hr />"}, {"id": "navegacao-lateral", "level": 2, "title": "Navegação lateral", "words": 33, "screens": [], "html": "<p>Largura 255px expandida, 72px recolhida. Item ativo: fundo <code>#4F4FEA</code>, texto branco, raio 7px. Grupos com submenu expansível — chevron <strong>só</strong> em itens que realmente expandem.</p>\n<p><strong>Recolhida:</strong> apenas ícones, com tooltip no hover. Submenus fecham.</p>\n<hr />"}, {"id": "barra-superior", "level": 2, "title": "Barra superior", "words": 26, "screens": [], "html": "<p>Altura 72px · fundo branco · borda inferior <code>#EAECF0</code> · sombra sutil. Contém o seletor de contexto (organização / filial) agrupado em contêiner <code>#F9FAFB</code>, divisor vertical e sino de notificações.</p>\n<hr />"}, {"id": "stepper-de-fluxo", "level": 2, "title": "Stepper de fluxo", "words": 32, "screens": [], "html": "<p>Faixa <code>#F2F2F5</code> com quatro etapas: Requisição → Cotação → Mapa de cotação → Ordem de Compra. Etapa ativa em <code>#4F4FEA</code> semibold.</p>\n<p><strong>Wizard:</strong> etapas numeradas com ✓ ao concluir, marca de obrigatória/opcional e barra de progresso.</p>\n<hr />"}, {"id": "controles", "level": 2, "title": "Controles", "words": 32, "screens": [], "html": "<p><strong>Checkbox</strong> 19px, raio 4px, borda <code>#D0D5DD</code>, marcado em <code>#4F4FEA</code> com ✓ branco\n<strong>Toggle</strong> 44×24, raio 99px, <code>#D0D5DD</code> → <code>#101010</code> ao ativar, <code>role=\"switch\"</code>\n<strong>Progresso</strong> altura 8–9px, raio 99px, trilho <code>#EAECF0</code>, preenchimento <code>#4F4FEA</code></p>\n<hr />"}, {"id": "skeleton", "level": 2, "title": "Skeleton", "words": 30, "screens": [], "html": "<p>Shimmer de 1,25s sobre <code>#EAECF0</code>. Templates por tipo: KPI, tabela, cards, gráfico, hero. Container com <code>aria-busy</code>, <code>aria-live=\"polite\"</code> e <code>role=\"status\"</code>. Desligado em <code>prefers-reduced-motion: reduce</code>.</p>\n<hr />"}, {"id": "datepicker", "level": 2, "title": "Datepicker", "words": 44, "screens": [], "html": "<p>Popover ancorado ao campo, com correção automática de viewport. <strong>Modo único</strong> (um mês) e <strong>modo intervalo</strong> (dois meses lado a lado com destaque de range e inversão automática). Navegação por setas e selects de mês/ano. Atalhos: Hoje, Limpar, Últimos 30 dias, Este mês.</p>\n<hr />"}, {"id": "toast", "level": 2, "title": "Toast", "words": 21, "screens": [], "html": "<p>Fundo <code>#101010</code>, texto branco, raio 10px, ancorado ao rodapé centralizado, 2,6s. Feedback de ação — nunca substitui confirmação de ação destrutiva.</p>"}]}], "concepts": [{"id": "fluxo-compra", "label": "Fluxo de compra", "screens": ["cotacao", "estoque", "listacompra", "mapa", "nova", "ordem", "requisicoes"], "refs": [{"doc": "documentacao-funcional", "docTitle": "Documentação Funcional", "group": "00 · Produto", "sec": "4-11-suporte-manuais-suporte-manuais-manuais-em-word-varios-", "secTitle": "4.11 Suporte / Manuais — /suporte/manuais. Manuais em Word (vários com vídeo)", "n": 43, "snippet": "Primeiros Passos e Configurações Iniciais, Fornecedores, Produtos, Requisições, Vinculação de Fornecedor em Massa, Lista de Compras, Requisição por Planilha e Estoque. 5.Jornadas completas Jornada A — Comprar via cotação (prin", "screens": ["suporte"]}, {"doc": "permissoes", "docTitle": "Permissões", "group": "02 · Regras", "sec": "permissoes-por-cargo-na-organizacao", "secTitle": "Permissões por cargo na organização", "n": 18, "snippet": "que é admin de filial (via COMPANY-PERMISSIONS ) fiscais Compras e cotações Recurso Pode Não pode Lista", "screens": []}, {"doc": "documentacao-funcional", "docTitle": "Documentação Funcional", "group": "00 · Produto", "sec": "_intro", "secTitle": "Documentação Funcional", "n": 17, "snippet": "(“Simplificamos a gestão de compras do seu restaurante”). O núcleo funcional é o ciclo de cotação: o restaurante cria uma requisição de compra, envia a fornecedores, compara as respostas em um “mapa de cotação” e gera uma ordem de", "screens": ["api", "configuracoes", "conta", "cotacao", "estoque", "fornecedores", "historico", "listacompra", "nova", "ordem", "produtos", "reqauto", "requisicoes", "suporte"]}, {"doc": "inventario-telas", "docTitle": "Inventário de telas", "group": "01 · Módulos", "sec": "fluxo-principal-de-compra", "secTitle": "Fluxo principal de compra", "n": 11, "snippet": "o gira em torno de um ciclo de quatro etapas, sinalizado por um stepper persistente: ``` Requisição → Cotação → Mapa de Cotação → Ordem de Compra ``` | Tela | Papel | Densidade | |---|---|---| | **Requisições** | Hero escu", "screens": []}, {"doc": "documentacao-funcional", "docTitle": "Documentação Funcional", "group": "00 · Produto", "sec": "4-2-3-completar-requisicao-requisicoes-completar-id", "secTitle": "4.2.3 Completar Requisição (/requisicoes/completar/{id})", "n": 8, "snippet": "Stepper de quatro estágios: Requisição, Cotação, Mapa de cotação e Ordem de Compra. Mapa de cotação: título com código, entrega prevista, data, filial, percentual respondido, Visualizar Prévia, Ações do Pedido (opção Enviar para a", "screens": ["cotacao"]}, {"doc": "documentacao-funcional", "docTitle": "Documentação Funcional", "group": "00 · Produto", "sec": "4-2-1-minhas-requisicoes-requisicoes-minhas", "secTitle": "4.2.1 Minhas Requisições (/requisicoes/minhas)", "n": 6, "snippet": "Objetivo: acompanhar e gerenciar cotações. Área “Requisições em aberto” (cartões com código, data, status Em andamento, filial, percentual de respostas, cronômetro, Atualizar data limite e abrir). Área “Requisições” (lista mantida", "screens": ["requisicoes"]}, {"doc": "permissoes", "docTitle": "Permissões", "group": "02 · Regras", "sec": "mapeamento-recurso-dominio-de-produto", "secTitle": "Mapeamento recurso → domínio de produto", "n": 5, "snippet": "Notas fiscais Order Pedidos Quotation Cotações QuotationRequest Requisições de cotação QuotationRequestAutomation Automações de requisição QuotationRequestSha", "screens": ["produtos"]}, {"doc": "spec-tecnica", "docTitle": "Spec técnica", "group": "02 · Regras", "sec": "4-2-fonte-e-elegibilidade", "secTitle": "4.2. Fonte e elegibilidade", "n": 5, "snippet": "O MVP utiliza itens de cotações respondidas. Compras efetivadas ficam fora para não misturar preço cotado com preço pago. Uma observação é elegível quando: 1. corresponde ao produto ou à chave comparável selecionada; 2. pertence", "screens": []}, {"doc": "readme", "docTitle": "Design System — leia primeiro", "group": "03 · Design System", "sec": "principios-que-devem-guiar-qualquer-tela-nova", "secTitle": "Princípios que devem guiar qualquer tela nova", "n": 5, "snippet": "sem cadastro, no celular. 3. **Ação irreversível precisa parecer irreversível.** Enviar cotação dispara mensagem para dezenas de fornecedores. Salvar rascunho e enviar nunca podem parecer o mesmo botão. 4. **Cor nunca é o único", "screens": []}, {"doc": "documentacao-funcional", "docTitle": "Documentação Funcional", "group": "00 · Produto", "sec": "4-3-requisicoes-automaticas", "secTitle": "4.3 Requisições Automáticas", "n": 4, "snippet": "Lista (/requisicoes-automaticas/lista): requisições em aberto e agendadas, ordenação e filtro por filial, atalhos Nova cotação automática e Minhas cotações agendadas; estado vazio “Você chegou ao fim da lista de agendamentos.” Cri", "screens": ["reqauto"]}, {"doc": "inventario-telas", "docTitle": "Inventário de telas", "group": "01 · Módulos", "sec": "gestao-e-cadastros", "secTitle": "Gestão e cadastros", "n": 4, "snippet": "d** | KPIs do período, economia, distribuição de gastos e detalhamento | | **Histórico de requisições** | Tabela de pedidos concluídos | | **Fornecedores** | Cadastro com CNPJ, prazo de entrega e pedido mínimo | | **Produtos** | C", "screens": []}, {"doc": "spec-tecnica", "docTitle": "Spec técnica", "group": "02 · Regras", "sec": "11-criterios-de-aceitacao", "secTitle": "11. Critérios de aceitação", "n": 4, "snippet": "uma. 2. **Cálculo conjunto:** as duas perspectivas usam, em uma única média cada, somente cotações destinadas às localidades selecionadas. 3. Histórico e mercado são independentes e tudo que estiver disponível é exibido. 4. Qualqu", "screens": []}, {"doc": "spec-tecnica", "docTitle": "Spec técnica", "group": "02 · Regras", "sec": "16-glossario", "secTitle": "16. Glossário", "n": 4, "snippet": "cífico, com explicação do que falta. - **Fornecedor próprio:** fornecedor identificado em cotação da organização ativa. - **Localidade:** chave estável de cidade/UF derivada de uma filial autorizada. - **Oportunidade estimada de e", "screens": []}, {"doc": "readme", "docTitle": "Design System — leia primeiro", "group": "03 · Design System", "sec": "nome-e-descricao", "secTitle": "Nome e descrição", "n": 4, "snippet": "> A Foozi é um SaaS B2B de gestão de compras para foodservice. Conduz o ciclo completo — requisição, cotação, mapa comparativo e ordem de compra — para redes de restaurantes com múltiplas filiais, substituindo cotações por WhatsA", "screens": []}, {"doc": "componentes", "docTitle": "Componentes", "group": "03 · Design System", "sec": "stepper-de-fluxo", "secTitle": "Stepper de fluxo", "n": 4, "snippet": "Faixa `#F2F2F5` com quatro etapas: Requisição → Cotação → Mapa de cotação → Ordem de Compra. Etapa ativa em `#4F4FEA` semibold. **Wizard:** etapas numeradas com ✓ ao concluir, marca de obrigatória/opcional e barra de progresso.", "screens": []}, {"doc": "documentacao-funcional", "docTitle": "Documentação Funcional", "group": "00 · Produto", "sec": "16-1-comportamento-confirmado-por-inspecao-producao", "secTitle": "16.1 Comportamento confirmado por inspeção (produção)", "n": 3, "snippet": "egistro de quem fez a contagem nem de quando (apenas a senha de acesso). Geração de lista/requisição a partir da contagem: após a contagem, o sistema calcula automaticamente a necessidade de compra por item (quanto falta para o id", "screens": ["estoque"]}, {"doc": "validacao-documentacao", "docTitle": "Validação da Funcional", "group": "00 · Produto", "sec": "parte-3-pendencias-e-destinatarios", "secTitle": "Parte 3 · Pendências e destinatários", "n": 3, "snippet": "aberto. 3.2 IBS e CBS P R O D U T O / F I S CAL Exibidos como “Período de Teste” no mapa de cotação. Cálculo, base e vigência não confirmados. Corresponde ao B2. 3.3 Jornada de resposta do fornecedor", "screens": []}, {"doc": "permissoes", "docTitle": "Permissões", "group": "02 · Regras", "sec": "matriz-comparativa-resumida", "secTitle": "Matriz comparativa resumida", "n": 3, "snippet": "lista de compra 🔒✅ 🔒✅ ❌ Automações de requisição 🔒✅ 🔒✅ ❌ Excluir filial ⚠️ filial ❌", "screens": []}, {"doc": "spec-tecnica", "docTitle": "Spec técnica", "group": "02 · Regras", "sec": "2-contexto-e-objetivo", "secTitle": "2. Contexto e objetivo", "n": 3, "snippet": "cotou, identificados pelo nome. 2. **Referência de mercado Foozi:** preços comparáveis de cotações destinadas a filiais de outras organizações nas mesmas cidades/UF selecionadas, agregados e sem identificação da origem na saída.", "screens": []}, {"doc": "produto", "docTitle": "Visão do produto", "group": "00 · Produto", "sec": "como-funciona", "secTitle": "Como funciona", "n": 2, "snippet": "as; o comprador pode alterar a combinação, mantendo ao menos uma. A consulta usa somente cotações destinadas às filiais localizadas nas cidades/UF selecionadas e apresenta duas perspectivas: - **Meu histórico:** fornecedores com", "screens": []}, {"doc": "produto", "docTitle": "Visão do produto", "group": "00 · Produto", "sec": "confianca-e-privacidade", "secTitle": "Confiança e privacidade", "n": 2, "snippet": "A cidade/UF da filial destinatária fica registrada na cotação e não é reescrita por mudanças posteriores de endereço. As opções selecionáveis continuam limitadas às localidades das filiais atualmente autorizadas. O comprador iden", "screens": []}, {"doc": "documentacao-funcional", "docTitle": "Documentação Funcional", "group": "00 · Produto", "sec": "16-2-dores-relatadas-e-feedback-dos-stakeholders", "secTitle": "16.2 Dores relatadas e feedback dos stakeholders", "n": 2, "snippet": "de) antes de confirmar. Distinção importante de perfil: cliente plataforma cria a própria requisição; cliente “bipou” apenas gera a lista e o comprador dedicado assume a requisição. Terminologia de divergência: substituir “divergê", "screens": []}, {"doc": "inventario-telas", "docTitle": "Inventário de telas", "group": "01 · Módulos", "sec": "modais-principais", "secTitle": "Modais principais", "n": 2, "snippet": "**Confirmação de ação irreversível:** Iniciar cotação · Aprovar OC · Recusar OC · Excluir requisição **Formulário:** Novo fornecedor · Novo produto · Nova lista · Nova regra automática · Selecionar marcas · Selecionar fornecedore", "screens": []}, {"doc": "decisoes", "docTitle": "Decisões", "group": "02 · Regras", "sec": "resolvidas", "secTitle": "Resolvidas", "n": 2, "snippet": "as **vamos identificar o usuário**. Requisito futuro, não bloqueia agora. **D-04 · Gerar requisição pela contagem** — O botão **apenas cria a lista**. A requisição é gerada depois, pelo comprador ou pelo cliente, a partir da list", "screens": []}, {"doc": "spec-tecnica", "docTitle": "Spec técnica", "group": "02 · Regras", "sec": "historico-de-revisao", "secTitle": "Histórico de revisão", "n": 2, "snippet": "0.2 | V1 simplificada para entrega rápida: cálculo e explicação determinísticos, somente cotações respondidas, microsserviço único, ingestão e operação essenciais. | | 0.3 | LLM incluído na experiência visível para gerar insight", "screens": []}, {"doc": "spec-tecnica", "docTitle": "Spec técnica", "group": "02 · Regras", "sec": "3-principios-do-mvp", "secTitle": "3. Princípios do MVP", "n": 2, "snippet": "desidentificada na saída: não expõe nomes ou IDs de organizações e fornecedores externos, cotações ou itens de terceiros. 7. A cidade/UF da filial destinatária, registrada na cotação, comprova que o fornecedor atendeu aquela local", "screens": []}, {"doc": "spec-tecnica", "docTitle": "Spec técnica", "group": "02 · Regras", "sec": "4-4-cobertura-e-disponibilidade", "secTitle": "4.4. Cobertura e disponibilidade", "n": 2, "snippet": "preço observado. A saída continua sem identificar a organização, o fornecedor externo, a cotação ou o item de origem. Essa limitação deve ser informada; ela não impede a exibição da referência e não cria amostra mínima. | Histór", "screens": ["fornecedores"]}, {"doc": "spec-tecnica", "docTitle": "Spec técnica", "group": "02 · Regras", "sec": "6-arquitetura-e-contratos-do-mvp", "secTitle": "6. Arquitetura e contratos do MVP", "n": 2, "snippet": "tura genérica para outras análises. O modelo mínimo representa observação e condições da cotação, organização e fornecedor de origem para controle interno, vínculo da filial destinatária, snapshot da cidade/UF da cotação, produt <script>const KB=window.__KB__, D=KB.docs, C=KB.concepts, S=KB.screens;
const byDoc=Object.fromEntries(D.map(d=>[d.id,d]));
const byCon=Object.fromEntries(C.map(c=>[c.id,c]));
const byScr=Object.fromEntries(S.map(s=>[s.id,s]));
const esc=s=>String(s).replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));
const norm=s=>s.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'');
let MODE='docs', CUR=null;
const main=document.getElementById('main'), navEl=document.getElementById('nav');

/* ---------- navegacao lateral ---------- */
function buildNav(){
  let h='';
  if(MODE==='docs'){
    let g=null;
    D.forEach(d=>{ if(d.group!==g){g=d.group;h+=`<div class="grp">${esc(g)}</div>`}
      h+=`<button class="it" data-k="doc" data-id="${d.id}">${esc(d.title)}<small>${d.sections.length} seções · ${d.words.toLocaleString('pt-BR')} palavras</small></button>`});
  } else if(MODE==='con'){
    h+='<div class="grp">Conceitos</div>';
    [...C].sort((a,b)=>b.total-a.total).forEach(c=>
      h+=`<button class="it" data-k="con" data-id="${c.id}">${esc(c.label)}<small>${c.refs.length} seções · ${c.docs.length} documentos</small></button>`);
  } else {
    h+='<div class="grp">Telas do sistema</div>';
    S.forEach(s=>h+=`<button class="it" data-k="scr" data-id="${s.id}">${esc(s.label)}<small>${s.sections.length?s.sections.length+' seções':'sem documentação'}</small></button>`);
  }
  navEl.innerHTML=h;
}
function mark(id){document.querySelectorAll('.it').forEach(b=>b.classList.toggle('on',b.dataset.id===id))}

/* ---------- blocos reutilizaveis ---------- */
function conChips(ids,lbl){
  if(!ids||!ids.length) return '';
  return `<div class="chips">${lbl?`<span class="chip" style="background:none;padding-left:0;cursor:default">${lbl}</span>`:''}`+
    ids.map(i=>byCon[i]?`<button class="chip b" data-go="con:${i}">${esc(byCon[i].label)}</button>`:'').join('')+`</div>`;
}
function scrBtns(ids){
  if(!ids||!ids.length) return '';
  return `<div class="chips">`+ids.map(i=>byScr[i]?`<button class="chip" data-go="scr:${i}">${esc(byScr[i].label)}</button>`:'').join('')+`</div>`;
}
function refList(refs,n=8){
  if(!refs.length) return '<p class="empty">Nenhuma ocorrência.</p>';
  return refs.slice(0,n).map(r=>`<button class="ref" data-go="doc:${r.doc}#${r.sec}">
    <b>${esc(r.secTitle)}</b><small>${esc(r.docTitle)} · ${esc(r.group)} · ${r.n} menç${r.n>1?'ões':'ão'}</small>
    ${r.snippet?`<q>…${esc(r.snippet)}…</q>`:''}</button>`).join('');
}

  const gaps=S.filter(s=>!s.sections.length);
  main.innerHTML=`<div class="wrap">

function viewDoc(id,anchor){

    ${scrs.length?`<div class="chips">${scrs.map(x=>byScr[x]?`<button class="chip" data-go="scr:${x}">${esc(byScr[x].label)}</button>`:'').join('')}</div>`:''}
    <div style="height:30px"></div>${body}
    <div class="rel"><h4>Mencionado em</h4><p class="d">Outros documentos que tocam os mesmos conceitos.</p>
      ${refList(C.filter(c=>c.docs.includes(id)).flatMap(c=>c.refs).filter(r=>r.doc!==id)
        .reduce((a,r)=>{const k=r.doc+r.sec;if(!a.m[k]){a.m[k]=1;a.l.push(r)}return a},{m:{},l:[]}).l
        .sort((a,b)=>b.n-a.n),8)}</div></div>`;
  if(anchor){const el=document.getElementById('s-'+anchor); if(el) setTimeout(()=>el.scrollIntoView({block:'start'}),30)}
}
function viewCon(id){
  const c=byCon[id]; if(!c) return;
  const def=c.refs[0];
  main.innerHTML=`<div class="wrap">
    <p class="eyebrow">Conceito</p><h2 class="hero">${esc(c.label)}</h2>
    <p class="lede">Aparece ${c.total} vezes, em ${c.refs.length} seções de ${c.docs.length} documentos.</p>
    ${def?`<div class="ans"><h4>Onde está definido</h4>
      <button class="ref" data-go="doc:${def.doc}#${def.sec}"><b>${esc(def.secTitle)}</b><small>${esc(def.docTitle)} · ${esc(def.group)}</small>${def.snippet?`<q>…${esc(def.snippet)}…</q>`:''}</button></div>`:''}
    <div class="rel"><h4>Onde mais aparece</h4><p class="d">Mexer aqui provavelmente obriga a revisar estas seções.</p>${refList(c.refs.slice(1),10)}</div>
    ${c.screens.length?`<div class="rel"><h4>Telas afetadas</h4><p class="d">Onde este conceito vira interface.</p>
      ${c.screens.map(s=>byScr[s]?`<button class="ref" data-go="scr:${s}"><b>${esc(byScr[s].label)}</b><small>${esc(byScr[s].desc)}</small></button>`:'').join('')}</div>`:''}
    </div>`;
}
function viewScr(id){
  const s=byScr[id]; if(!s) return;
  main.innerHTML=`<div class="wrap">
    <p class="eyebrow">Tela</p><h2 class="hero">${esc(s.label)}</h2><p class="lede">${esc(s.desc)}</p>
    <div class="row"><a class="btn" href="prototipo.html#${s.id}">Abrir no protótipo</a>
      <button class="btn sec2" data-tab="scr">Todas as telas</button></div>
    ${!s.sections.length?`<div class="warn" style="margin-top:30px"><b>Sem documentação.</b> Esta tela existe no protótipo mas nenhum documento a descreve.</div>`:''}
    ${s.concepts.length?`<div class="rel" style="margin-top:34px"><h4>Conceitos em jogo</h4><p class="d">Regras que valem nesta tela.</p>${conChips(s.concepts)}</div>`:''}
    ${s.sections.length?`<div class="rel"><h4>Documentação desta tela</h4><p class="d">${s.sections.length} seções descrevem esta tela.</p>
      ${s.sections.slice(0,12).map(x=>`<button class="ref" data-go="doc:${x.doc}#${x.sec}"><b>${esc(x.secTitle)}</b><small>${esc(x.docTitle)} · ${x.words} palavras</small></button>`).join('')}</div>`:''}
    </div>`;
}

/* ---------- resposta a pergunta ---------- */
function answer(q){
  const n=norm(q), toks=n.split(/\s+/).filter(t=>t.length>2);
  const score=o=>{const t=norm(o);return toks.reduce((a,k)=>a+(t.includes(k)?1:0),0)};
  const cons=C.map(c=>({c,v:score(c.label)*3+ (c.refs.some(r=>norm(r.secTitle).includes(n))?2:0)})).filter(x=>x.v>0).sort((a,b)=>b.v-a.v);
  const secs=[];
  D.forEach(d=>d.sections.forEach(s=>{const v=score(s.title)*2+toks.reduce((a,k)=>a+(norm(s.html).includes(k)?1:0),0);
    if(v>0) secs.push({d,s,v})}));
  secs.sort((a,b)=>b.v-a.v);
  const scrs=S.map(s=>({s,v:score(s.label)*2+score(s.desc)})).filter(x=>x.v>0).sort((a,b)=>b.v-a.v);
  const top=cons[0]&&cons[0].c;
  main.innerHTML=`<div class="wrap">
    <p class="eyebrow">Resposta</p><h2 class="hero">${esc(q)}</h2>
    ${!secs.length&&!cons.length?`<p class="lede">Nada encontrado. Tente um termo do produto, como “contagem”, “filial” ou “CMV”.</p>`:
    `<div class="ans">
      ${top?`<p class="lbl">Conceito mais próximo</p>
        <button class="ref" data-go="con:${top.id}"><b>${esc(top.label)}</b><small>${top.total} menções em ${top.docs.length} documentos</small></button>`:''}
      <p class="lbl">Onde está escrito</p>${refList(secs.map(x=>({doc:x.d.id,docTitle:x.d.title,group:x.d.group,sec:x.s.id,secTitle:x.s.title,n:x.v,snippet:''})),6)}
      ${top&&top.screens.length?`<p class="lbl">O que muda na interface</p>${top.screens.map(i=>byScr[i]?`<button class="ref" data-go="scr:${i}"><b>${esc(byScr[i].label)}</b><small>${esc(byScr[i].desc)}</small></button>`:'').join('')}`:
        scrs.length?`<p class="lbl">Telas relacionadas</p>${scrs.slice(0,4).map(x=>`<button class="ref" data-go="scr:${x.s.id}"><b>${esc(x.s.label)}</b><small>${esc(x.s.desc)}</small></button>`).join('')}`:''}
    </div>
    <p class="empty">Busca determinística sobre o grafo: cada item acima é um trecho real, com documento e seção de origem. Nada é gerado por IA.</p>`}
    </div>`;
}

/* ---------- roteamento ---------- */
function go(t){
  const [k,rest]=t.split(':'); const [id,anchor]=rest.split('#');
  if(k==='doc'){MODE='docs';setTab();buildNav();viewDoc(id,anchor)}
  if(k==='con'){MODE='con';setTab();buildNav();viewCon(id)}
  if(k==='scr'){MODE='scr';setTab();buildNav();viewScr(id)}
  mark(id); main.scrollTop=0;
}
function setTab(){document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('on',b.dataset.tab===MODE))}
document.addEventListener('click',e=>{
  const g=e.target.closest('[data-go]'); if(g) return go(g.dataset.go);
  const q=e.target.closest('[data-q]'); if(q){document.getElementById('q').value=q.dataset.q;return answer(q.dataset.q)}
  const t=e.target.closest('[data-tab]'); if(t){MODE=t.dataset.tab;setTab();buildNav();
    if(MODE==='docs')viewDoc(D[0].id);if(MODE==='con')viewCon(C[0].id);if(MODE==='scr')viewScr(S[0].id);
    mark(MODE==='docs'?D[0].id:MODE==='con'?C[0].id:S[0].id);return}
  const i=e.target.closest('.it'); if(i) return go(i.dataset.k+':'+i.dataset.id);
  const h=e.target.closest('[data-home]'); if(h){MODE='docs';setTab();buildNav();viewHome()}
});
const qel=document.getElementById('q');
qel.addEventListener('keydown',e=>{if(e.key==='Enter'&&qel.value.trim())answer(qel.value.trim())});
qel.addEventListener('input',()=>{
  const v=norm(qel.value.trim());
  document.querySelectorAll('.it').forEach(b=>{b.hidden=!!v&&!norm(b.textContent).includes(v)});
  document.querySelectorAll('.grp').forEach(g=>{let n=g.nextElementSibling,any=false;
    while(n&&n.classList.contains('it')){if(!n.hidden)any=true;n=n.nextElementSibling}g.hidden=!!v&&!any});
});
buildNav(); setTab(); viewHome();
</script>
</body></html>
