ber;\n  minimumStock: number;\n  idealStock: number;\n  suggestedQty: number;\n  priority: 'critical' | 'high' | 'medium' | 'low';\n  status: 'pending' | 'selected' | 'removed';\n  supplierName?: string;\n  notes?: string;\n  selected: boolean;\n}\n\nexport interface PurchaseList {\n  id: string;\n  name: string;\n  originCountId: string;\n  companyName: string;\n  createdBy: string;\n  createdAt: Date;\n  status: 'created' | 'sent' | 'reviewing' | 'used' | 'cancelled';\n  items: PurchaseNeedItem[];\n}\n\nexport interface User {\n  id: string;\n  name: string;\n  email: string;\n  role: UserRole;\n  avatar?: string;\n}\n</code></pre>\n<hr />"}, {"id": "4-context-e-estado-global", "level": 2, "title": "4. Context e estado global", "words": 68, "screens": [], "html": "<p>Estado exposto pelo context:</p>\n<pre><code class=\"language-ts\">interface AppContextType {\n  currentUser: User | null;\n  setCurrentUser: (user: User | null) =&gt; void;\n  products: Product[];\n  setProducts: (products: Product[]) =&gt; void;\n  categories: Category[];\n  setCategories: (categories: Category[]) =&gt; void;\n  inventoryCounts: InventoryCount[];\n  setInventoryCounts: (counts: InventoryCount[]) =&gt; void;\n  inventoryCountItems: InventoryCountItem[];\n  setInventoryCountItems: (items: InventoryCountItem[] | ((prev: InventoryCountItem[]) =&gt; InventoryCountItem[])) =&gt; void;\n  purchaseLists: PurchaseList[];\n  setPurchaseLists: (lists: PurchaseList[]) =&gt; void;\n  stockerItemOrders: Record&lt;string, string[]&gt;;\n  setStockerItemOrder: (countId: string, itemIds: string[]) =&gt; void;\n  createInventoryCount: (name: string, responsibleName: string) =&gt; string;\n  finishInventoryCount: (countId: string) =&gt; string;\n}\n</code></pre>"}, {"id": "createinventorycount", "level": 3, "title": "createInventoryCount", "words": 30, "screens": ["contagem"], "html": "<p>Filtra produtos com inCountList=true e active=true. Cria InventoryCount com status='open'. Cria um InventoryCountItem por produto com countedQuantity=null e status='pending'. Retorna o id da nova contagem.</p>"}, {"id": "finishinventorycount", "level": 3, "title": "finishInventoryCount", "words": 32, "screens": ["contagem"], "html": "<p>Muda o status da contagem para 'finished'. Recalcula countedItems, pendingItems, divergentItems. Gera PurchaseList com produtos abaixo do minimumStock. suggestedQty = idealStock - countedQuantity. priority: qty=0 → critical; diff &gt; 50% do min → high; else → medium.</p>\n<hr />"}, {"id": "categorias", "level": 3, "title": "Categorias", "words": 5, "screens": [], "html": "<p>Mercearia, Hortifrúti, Bebidas, Limpeza, Embalagens</p>"}, {"id": "produtos-14-exemplos", "level": 3, "title": "Produtos (14 exemplos)", "words": 168, "screens": ["produtos"], "html": "<p>name | code | unit | currentStock | min | ideal | costPrice | inCountList\nAçúcar refinado kg | 1042 | Unidade | 12 | 5 | 15 | 4.50 | true\nAzeite bomba 5L Lisboa | 1080 | Unidade | 14 | 3 | 10 | 85.00 | true\nBiscoito maisena 170g | 1133 | Unidade | 6 | 10 | 20 | 3.20 | true\nBacalhau | 1101 | Quilograma | 10 | 2 | 8 | 120.00 | true\nCebola roxa kg | 1201 | Quilograma | 7 | 5 | 12 | 8.00 | true\nTomate italiano kg | 1208 | Quilograma | 9 | 5 | 10 | 6.50 | true\nBatata palha McCain 1kg | 1220 | Pacote | 3 | 5 | 15 | 15.00 | true\nCoca-Cola lata 350ml | 3001 | Unidade | 48 | 24 | 72 | 2.80 | true\nÁgua mineral 500ml | 3002 | Unidade | 2 | 12 | 36 | 1.20 | true\nDetergente neutro 500ml | 4001 | Unidade | 4 | 3 | 6 | 3.50 | true\nSaco plástico 50L | 5001 | Pacote | 8 | 5 | 10 | 12.00 | true\nFarinha de trigo 5kg | 1050 | Saco | 0 | 3 | 8 | 18.00 | true\nSal refinado 1kg | 1055 | Unidade | 15 | 4 | 8 | 2.50 | false (inactive)\nÓleo de soja 900ml | 1060 | Unidade | 0 | 0 | 0 | 7.80 | false (sem config)</p>\n<hr />"}, {"id": "6-rotas-app-tsx", "level": 2, "title": "6. Rotas (App.tsx)", "words": 97, "screens": ["contagem", "estoque", "listacompra"], "html": "<pre><code class=\"language-tsx\">&lt;Route path=&quot;/count/:id&quot; element={&lt;StockerCountPage /&gt;} /&gt;\n&lt;Route path=&quot;/stock&quot; element={&lt;Layout&gt;&lt;StockDashboardPage /&gt;&lt;/Layout&gt;} /&gt;\n&lt;Route path=&quot;/stock/config&quot; element={&lt;Layout&gt;&lt;StockConfigPage /&gt;&lt;/Layout&gt;} /&gt;\n&lt;Route path=&quot;/stock/history&quot; element={&lt;Layout&gt;&lt;CountHistoryPage /&gt;&lt;/Layout&gt;} /&gt;\n&lt;Route path=&quot;/stock/purchase-list&quot; element={&lt;Layout&gt;&lt;PurchaseNeedListPage /&gt;&lt;/Layout&gt;} /&gt;\n&lt;Route path=&quot;/stock/quick-exit&quot; element={&lt;Layout&gt;&lt;QuickStockExitPage /&gt;&lt;/Layout&gt;} /&gt;\n&lt;Route path=&quot;/stock/movements&quot; element={&lt;Layout&gt;&lt;StockMovementsPage /&gt;&lt;/Layout&gt;} /&gt;\n&lt;Route path=&quot;/stock/transfer&quot; element={&lt;Layout&gt;&lt;StockTransferPage /&gt;&lt;/Layout&gt;} /&gt;\n&lt;Route path=&quot;/stock/suggest-ideal&quot; element={&lt;Layout&gt;&lt;StockSuggestIdealPage /&gt;&lt;/Layout&gt;} /&gt;\n&lt;Route path=&quot;/inventory-counts&quot; element={&lt;Layout&gt;&lt;InventoryCountsListPage /&gt;&lt;/Layout&gt;} /&gt;\n&lt;Route path=&quot;/inventory-count/:id&quot; element={&lt;Layout&gt;&lt;InventoryCountPage /&gt;&lt;/Layout&gt;} /&gt;\n&lt;Route path=&quot;/movements&quot; element={&lt;Layout&gt;&lt;CMVPage /&gt;&lt;/Layout&gt;} /&gt;\n</code></pre>\n<hr />"}, {"id": "7-layout-menu-estoque", "level": 2, "title": "7. Layout — Menu Estoque", "words": 77, "screens": ["contagem", "estoque", "listacompra"], "html": "<pre><code class=\"language-ts\">{\n  icon: Layers, label: 'Estoque',\n  children: [\n    { label: 'Dashboard', path: '/stock' },\n    { label: 'Contagens', path: '/inventory-counts' },\n    { label: 'Lista de compra', path: '/stock/purchase-list' },\n    { label: 'Configuração', path: '/stock/config' },\n    { label: 'Histórico', path: '/stock/history' },\n    { label: 'Movimentações', path: '/stock/movements' },\n    { label: 'Transferência', path: '/stock/transfer' },\n    { label: 'Estoque Ideal', path: '/stock/suggest-ideal' },\n    { label: 'CMV', path: '/movements' },\n  ],\n}\n</code></pre>\n<p>O Layout mostra pill animado no menu quando existe contagem in_progress/open, com link para /inventory-count/:id e progresso X/Y itens.</p>\n<hr />"}, {"id": "8-padrao-de-layout-das-paginas", "level": 2, "title": "8. Padrão de layout das páginas", "words": 60, "screens": [], "html": "<pre><code class=\"language-tsx\">&lt;div className=&quot;flex flex-col h-full min-h-0&quot;&gt;\n  &lt;div className=&quot;flex-shrink-0 border-b border-[#e5e7eb] bg-white px-[20px] sm:px-[28px] py-[16px]&quot;&gt;\n    {/* Header fixo */}\n  &lt;/div&gt;\n  &lt;div className=&quot;flex-1 overflow-auto p-[16px] sm:p-[24px]&quot;&gt;\n    {/* Conteúdo rolável */}\n  &lt;/div&gt;\n&lt;/div&gt;\n</code></pre>\n<p>O Layout deve ter: <main className=\"flex-1 flex flex-col overflow-hidden\"></p>\n<hr />"}, {"id": "9-design-tokens-cores", "level": 2, "title": "9. Design tokens (cores)", "words": 44, "screens": [], "html": "<p>Primary: #6366f1 | Primary hover: #4f46e5 | Primary light bg: #eef2ff\nText primary: #111827 | Text secondary: #374151 | Text muted: #6b7280 | Placeholder: #9ca3af\nBackground: #f9fafb | Card: #ffffff | Border: #e5e7eb | Border light: #f3f4f6\nCrítico: #dc2626 / #fef2f2 | Atenção: #b45309 / #fffbeb\nOK: #15803d / #f0fdf4 | Excesso: #1d4ed8 / #eff6ff | Info: #2563eb / #eff6ff</p>\n<hr />"}, {"id": "stockdashboardpage-stock", "level": 3, "title": "StockDashboardPage (/stock)", "words": 62, "screens": ["estoque"], "html": "<p>Hub central. Seções:\n1. Card de contagem ativa (se existir) com barra de progresso, botão \"Continuar\" e \"Compartilhar link\"\n2. 4 KPIs: produtos configurados, sem configuração, valor em estoque (currentStock x costPrice), total ativos\n3. Alertas: Crítico (atual &lt; min), Atenção (atual &gt;= min e &lt; min x 1.5), Excesso (atual &gt; ideal)\n4. Contagens recentes (últimas 4)\n5. Atalhos rápidos para as sub-páginas</p>"}, {"id": "inventorycountslistpage-inventory-counts", "level": 3, "title": "InventoryCountsListPage (/inventory-counts)", "words": 72, "screens": ["contagem"], "html": "<ul>\n<li>Cards por contagem com status badge (dot animado), progresso X/Y, botão abrir</li>\n<li>Botão \"Nova Contagem\" → modal com Nome + Responsável → chama createInventoryCount() → navega</li>\n<li>Botão \"Compartilhar\" → modal com URL /count/:id + botão copiar</li>\n</ul>\n<p>Status badges:\n- in_progress: bg #dbeafe, text #1e40af, dot #2563eb\n- open/finished/approved: bg #f0fdf4, text #15803d, dot #16a34a\n- reviewing/paused: bg #fffbeb, text #b45309, dot #f59e0b\n- cancelled: bg #fef2f2, text #dc2626, dot #ef4444\n- draft: bg #f3f4f6, text #6b7280, dot #9ca3af</p>"}, {"id": "inventorycountpage-inventory-count-id", "level": 3, "title": "InventoryCountPage (/inventory-count/:id)", "words": 107, "screens": ["contagem", "estoque", "listacompra"], "html": "<p>Duas views: admin e stocker (toggle).</p>\n<p>Modo Admin:\n- Header: nome, status, toggle de modo, barra de progresso\n- Filtros: busca, categorias (multi-select), ordenação (name-asc/desc, pending, entrada, saida, counted)\n- Tabs: Todos | Favoritos | Por localização\n- Cards (DraggableProductCard): nome, código, estoque sistema, campo numérico para digitar, diferença, stock level badge, favorito, seção de localização\n- Modal finalizar: resumo de itens → finishInventoryCount() → redireciona para /stock/purchase-list</p>\n<p>Modo Stocker:\n- Interface simplificada, cards maiores para mobile\n- Drag-and-drop para reordenar (StockerDraggableCard + @dnd-kit)\n- Ordem salva em stockerItemOrders[countId]\n- Tabs: Todos | Pendentes | Contados\n- Botão \"Enviar contagem\" quando tudo preenchido</p>\n<p>StockerCountPage (/count/:id): rota pública, renderiza InventoryCountPage com defaultViewMode=\"stocker\" standalone={true}</p>"}, {"id": "purchaseneedlistpage-stock-purchase-list", "level": 3, "title": "PurchaseNeedListPage (/stock/purchase-list)", "words": 63, "screens": ["estoque", "listacompra"], "html": "<ul>\n<li>Sidebar com lista de purchaseLists disponíveis</li>\n<li>Por item: borda esquerda colorida por prioridade, checkbox, nome, barra de estoque, qtd sugerida editável</li>\n<li>Barra de estoque: barra atual (verde/vermelho) + linha vertical no ponto mínimo sobre fundo cinza</li>\n<li>Modal \"Enviar para Requisição\" com campo de notas</li>\n</ul>\n<p>Prioridades — borda/badge:\n- critical: #ef4444 / #fef2f2 / #dc2626\n- high: #f59e0b / #fffbeb / #b45309\n- medium: #6366f1 / #eff6ff / #1d4ed8\n- low: #9ca3af / #f3f4f6 / #6b7280</p>"}, {"id": "stockconfigpage-stock-config", "level": 3, "title": "StockConfigPage (/stock/config)", "words": 61, "screens": ["estoque"], "html": "<ul>\n<li>AutoDispatchCard no topo: toggle liga/desliga, telefone WhatsApp, dias da semana (pills), horário, botão salvar</li>\n<li>3 KPIs: na contagem, sem configuração, total</li>\n<li>Tabela: Produto | Categoria | Atual | Mínimo | Ideal | Custo | Status | Na contagem</li>\n<li>Edição inline: clicar nos campos abre inputs com borda #6366f1, botões check/x</li>\n<li>Toggle \"Na contagem\": se sem config → abre edição automática</li>\n<li>Status: Crítico/Atenção/OK/Excesso/Não configurado</li>\n</ul>"}, {"id": "counthistorypage-stock-history", "level": 3, "title": "CountHistoryPage (/stock/history)", "words": 28, "screens": ["estoque"], "html": "<ul>\n<li>Filtro por status (Finalizadas/Aprovadas/Todas)</li>\n<li>Cards com métricas (contados, divergentes, críticos)</li>\n<li>Link \"Ver lista de compra\" se tem purchaseListId</li>\n<li>Botão Aprovar em contagens finished → muda para approved</li>\n</ul>"}, {"id": "stockmovementspage-stock-movements", "level": 3, "title": "StockMovementsPage (/stock/movements)", "words": 39, "screens": ["estoque"], "html": "<ul>\n<li>Filtros: busca, tipo (Todas/Entradas/Saídas), motivo</li>\n<li>Agrupado por data (separador com data + count de movs)</li>\n<li>Por linha: horário | produto + origem | tipo badge | qty (+/-) | antes→depois | motivo tag | responsável</li>\n<li>Entrada: bg #f0fdf4 text #15803d | Saída: bg #fef2f2 text #dc2626</li>\n</ul>"}, {"id": "stocktransferpage-stock-transfer", "level": 3, "title": "StockTransferPage (/stock/transfer)", "words": 90, "screens": ["estoque"], "html": "<p>Toggle de modo: Produto único | Transferir em lote</p>\n<p>Produto único:\n- Origem + destino (filial destino exclui origem), produto, quantidade, observação\n- Preview com produto, qty, valor de custo, rota\n- Validação: qty &gt; 0 e &lt;= currentStock</p>\n<p>Lote:\n- Origem + destino compartilhados\n- Lista dinâmica de linhas (produto + qty) com botão adicionar/remover\n- Validação individual por linha (borda vermelha se exceder estoque)\n- Resumo consolidado: lista de válidos, total, valor agregado\n- Botão \"Confirmar Lote (N produtos)\"</p>\n<p>Regra: gera Saída na origem + Entrada no destino com valor = qty x costPrice\nFiliais mock: Principal, Filial Norte, Filial Sul, Filial Leste</p>"}, {"id": "stocksuggestidealpage-stock-suggest-ideal", "level": 3, "title": "StockSuggestIdealPage (/stock/suggest-ideal)", "words": 44, "screens": ["estoque"], "html": "<ul>\n<li>Seletor de mês/ano + botão Calcular</li>\n<li>Filtro por categoria</li>\n<li>Contador de aceitos e botão \"Aceitar todos\"</li>\n<li>Tabela: Produto | Consumo médio | Ideal atual | Ideal sugerido (delta badge) | Aceitar</li>\n<li>Aceitar: atualiza idealStock no context + opacity-60 na linha</li>\n<li>Cálculo: sugerido = Math.ceil(avgConsumption x 1.5)</li>\n</ul>"}, {"id": "cmvpage-movements", "level": 3, "title": "CMVPage (/movements)", "words": 36, "screens": ["estoque"], "html": "<ul>\n<li>Seletor mês/ano</li>\n<li>4 KPIs: Estoque Inicial, Total em Compras, Estoque Final, CMV = Inicial + Compras - Final</li>\n<li>Calculadora: campo Faturamento, resultado % CMV (&lt; 28% verde, 28-35% âmbar, &gt; 35% vermelho)</li>\n<li>Tabela de movimentações do período</li>\n<li>Tabela histórico mensal</li>\n</ul>\n<hr />"}, {"id": "badge-com-dot-animado", "level": 3, "title": "Badge com dot animado", "words": 38, "screens": [], "html": "<pre><code class=\"language-tsx\">&lt;span className={`inline-flex items-center gap-[5px] text-[10px] font-bold px-[7px] py-[2px] rounded-full ${cfg.bg} ${cfg.text}`}&gt;\n  &lt;span className=&quot;size-[5px] rounded-full animate-pulse&quot; style={{ background: cfg.dot }} /&gt;\n  {cfg.label}\n&lt;/span&gt;\n</code></pre>"}, {"id": "toggle-liga-desliga", "level": 3, "title": "Toggle liga/desliga", "words": 41, "screens": [], "html": "<pre><code class=\"language-tsx\">&lt;button onClick={() =&gt; setEnabled(v =&gt; !v)}\n  className={`relative w-[38px] h-[22px] rounded-full transition-colors ${enabled ? 'bg-[#6366f1]' : 'bg-[#d1d5db]'}`}&gt;\n  &lt;span className={`absolute top-[3px] size-[16px] bg-white rounded-full shadow transition-all ${enabled ? 'left-[19px]' : 'left-[3px]'}`} /&gt;\n&lt;/button&gt;\n</code></pre>"}, {"id": "botao-com-estado-de-sucesso", "level": 3, "title": "Botão com estado de sucesso", "words": 41, "screens": [], "html": "<pre><code class=\"language-tsx\">&lt;button disabled={!isValid || done}\n  className={`h-[42px] rounded-[9px] text-[13px] font-bold transition-all ${\n    done ? 'bg-[#16a34a] text-white' : isValid ? 'bg-[#6366f1] hover:bg-[#4f46e5] text-white' : 'bg-[#f3f4f6] text-[#9ca3af] cursor-not-allowed'\n  }`}&gt;\n  {done ? &lt;&gt;&lt;Check /&gt; Confirmado&lt;/&gt; : 'Confirmar'}\n&lt;/button&gt;\n</code></pre>"}, {"id": "barra-de-estoque-atual-vs-ideal-linha-no-minimo", "level": 3, "title": "Barra de estoque (atual vs ideal, linha no mínimo)", "words": 58, "screens": [], "html": "<pre><code class=\"language-tsx\">&lt;div className=&quot;relative h-[5px] bg-[#f3f4f6] rounded-full overflow-hidden&quot;&gt;\n  &lt;div className={`absolute left-0 top-0 h-full rounded-full ${isCritical ? 'bg-[#ef4444]' : 'bg-[#22c55e]'}`}\n    style={{ width: `${Math.min(100, (current / ideal) * 100)}%` }} /&gt;\n  &lt;div className=&quot;absolute top-0 h-full w-[2px] bg-[#f59e0b] rounded-full&quot;\n    style={{ left: `${Math.min(100, (min / ideal) * 100)}%` }} /&gt;\n&lt;/div&gt;\n</code></pre>"}, {"id": "edicao-inline-de-numero", "level": 3, "title": "Edição inline de número", "words": 55, "screens": [], "html": "<pre><code class=\"language-tsx\">{isEditing ? (\n  &lt;input type=&quot;number&quot; value={value} onChange={e =&gt; setValue(Number(e.target.value))}\n    className=&quot;w-full text-[13px] font-bold border-2 border-[#6366f1] rounded-[5px] px-[6px] py-[3px] outline-none text-center&quot; /&gt;\n) : (\n  &lt;button onClick={startEdit} className=&quot;text-[13px] font-bold text-[#374151] hover:text-[#6366f1]&quot;&gt;\n    {value || &lt;span className=&quot;text-[#9ca3af]&quot;&gt;—&lt;/span&gt;}\n  &lt;/button&gt;\n)}\n</code></pre>\n<hr />"}, {"id": "12-fluxo-completo-de-uma-contagem", "level": 2, "title": "12. Fluxo completo de uma contagem", "words": 81, "screens": ["contagem", "estoque", "listacompra"], "html": "<ol>\n<li>Gerente vai em /stock/config → configura mínimo, ideal e custo → habilita produtos (inCountList=true) → (opcional) configura disparo automático</li>\n<li>Gerente vai em /inventory-counts → cria contagem → createInventoryCount() gera os itens</li>\n<li>Gerente compartilha /count/:id para o estoquista (manual ou automático via WhatsApp)</li>\n<li>Estoquista acessa /count/:id (sem login) → digita quantidades → clica \"Enviar contagem\"</li>\n<li>Gerente revisa em /inventory-count/:id → vê divergências → finaliza → finishInventoryCount() gera PurchaseList</li>\n<li>Gerente vai em /stock/purchase-list → revisa itens → envia para Requisição</li>\n</ol>\n<hr />"}, {"id": "13-checklist-de-implementacao", "level": 2, "title": "13. Checklist de implementação", "words": 53, "screens": [], "html": "<ul>\n<li>[ ] Interfaces TypeScript (seção 3)</li>\n<li>[ ] AppContext com mock data (seções 4 e 5)</li>\n<li>[ ] Rotas em App.tsx (seção 6)</li>\n<li>[ ] Layout com menu lateral e pill de contagem ativa</li>\n<li>[ ] StockDashboardPage</li>\n<li>[ ] InventoryCountsListPage</li>\n<li>[ ] InventoryCountPage (modo admin + stocker)</li>\n<li>[ ] StockerCountPage (wrapper público)</li>\n<li>[ ] DraggableProductCard (react-dnd)</li>\n<li>[ ] StockerDraggableCard (@dnd-kit)</li>\n<li>[ ] PurchaseNeedListPage</li>\n<li>[ ] StockConfigPage + AutoDispatchCard</li>\n<li>[ ] CountHistoryPage</li>\n<li>[ ] QuickStockExitPage</li>\n<li>[ ] StockMovementsPage</li>\n<li>[ ] StockTransferPage (unitário + lote)</li>\n<li>[ ] StockSuggestIdealPage</li>\n<li>[ ] CMVPage</li>\n</ul>"}]}, {"id": "prd-estoque", "path": "01-modulos/prd-estoque.md", "title": "PRD — Reconstrução do Estoque", "group": "01 · Módulos", "words": 2512, "sections": [{"id": "_intro", "level": 1, "title": "PRD — Reconstrução do Estoque", "words": 134, "screens": [], "html": "<blockquote>\n<p>Convertido de <code>PRD - Reconstrução do Módulo de Estoque - Foozi.pdf</code>. O PDF original está em <code>_fontes/</code> (fora do git).</p>\n</blockquote>\n<p>Estoque</p>\n<p>Documento de Requisitos de Produto (Product Requirements Document)\nProduto: Foozi — Gestão de compras e estoque para restaurantes\nMódulo: Estoque\nVersão do PRD: 1.0\nData: 22/07/2026\nStatus: Rascunho para validação\nFontes: (a) inspeção da versão em produção do módulo de Estoque; (b) transcrições de\nreuniões de produto de 23/06/2026 e 25/06/2026; © documento oficial “Anotações e\nFeedback — Reconstrução do Módulo de Estoque” (v1.0, 02/07/2026).\nNota de confiabilidade: este PRD separa o que foi confirmado por inspeção do sistema do\nque é proposta/feedback de stakeholders. Pontos ainda não confirmados estão marcados\ncomo “Necessita validação”. Não foram inventados comportamentos que não pudessem ser\nconfirmados nas fontes acima.</p>"}, {"id": "1-contexto-e-objetivo", "level": 2, "title": "1 Contexto e Objetivo", "words": 142, "screens": [], "html": "<p>Contexto: A base de clientes da Foozi é majoritariamente composta por donos de\nrestaurante, com rotina operacional consolidada de abertura e fechamento de caixa. O time\nde Produto está reconstruindo o módulo de Estoque. Durante a análise da nova versão,\nforam registradas observações de uso, bugs e sugestões de melhoria com base na\nexperiência do dia a dia desses clientes.\nObjetivo do produto: Entregar um módulo de Estoque preciso no controle de quantidades e\nvalores, simples para o operador do restaurante e alinhado à linguagem que esse público já\nusa no dia a dia, reduzindo confusão, retrabalho e desconforto durante a contagem.\nProblema central: Termos técnicos, comportamentos de tela e fluxos que fazem sentido\ntecnicamente geram confusão ou desconforto para o público de restaurante, além de\nlacunas que impedem o controle correto de estoque (valor em R$, saídas pontuais,\ntransferências entre filiais).</p>"}, {"id": "2-objetivos-e-metricas-de-sucesso", "level": 2, "title": "2 Objetivos e Métricas de Sucesso", "words": 91, "screens": [], "html": "<p>Objetivos de negócio: reduzir o atrito na contagem de estoque; aumentar a adoção e a\nfrequência de contagens; dar ao dono de restaurante visibilidade do valor (R$) parado em\nestoque; sustentar decisões de compra a partir de dados de consumo.\nMétricas de sucesso (a validar): tempo médio para concluir uma contagem; taxa de\ncontagens concluídas x iniciadas; número de contagens por filial por mês; adoção da\ngeração de lista de compras a partir da contagem; redução de chamados relacionados a\n“divergência”. Metas numéricas específicas — Necessita validação com o time de Produto.</p>"}, {"id": "3-publico-alvo-e-personas", "level": 2, "title": "3 Público-alvo e Personas", "words": 81, "screens": [], "html": "<p>Persona primária — Dono/Gestor do restaurante: configura estoque (mínimo/ideal),\nacompanha valor em estoque, analisa histórico e decide compras. Na rotina de caixa,\n“divergência” significa problema.\nPersona secundária — Operador/Estoquista: executa a contagem física dos insumos,\nnormalmente recebendo o link de contagem. Precisa de uma tela simples, com o item\npermanecendo fixo enquanto digita.\nPerfil de acesso confirmado no ambiente: usuário Administrador (ex.: “Kelvin Monteiro”),\norganização “Foozi”, filial “Principal”. Matriz completa de permissões por perfil no módulo de\nEstoque — Necessita validação.</p>"}, {"id": "4-estado-atual-do-modulo", "level": 2, "title": "4 Estado Atual do Módulo", "words": 207, "screens": [], "html": "<p>inspeção)\nEsta seção descreve apenas o que foi observado diretamente na versão em produção.\nTela Estoque &gt; Lista: colunas Produto, Gramatura, Filial, Nível de Estoque (com tags como\n“Excesso” e “Atenção”), Estoque Mínimo, Estoque Ideal, Estoque Atual, Contagem,\nNecessidade de Compra e Valor. Campos mínimo/ideal/atual editáveis inline. Botão\n“Configurar Estoque de Produto” e cards “Valor em Estoque (mês)” e “Total de produtos”.\nMenu de ações (três pontos) em Estoque: grupo Páginas (Histórico, Movimentações) e\ngrupo Ações (Importar estoque, Sincronizar Estoque (Saipos), Importar estoque do Everest,\nSincronizar Estoque (Everest), Resetar Estoque).\nTela Estoque &gt; Contagem: campo “Tipo de contagem” com opções “Contagem regular” e\n“Contagem em etapas”; filtros de Filial e Categoria; campo “Ordenar por” que, em produção,\noferece apenas “Nome (A–Z)” e “Nome (Z–A)”; colunas Produto (numerado), Unidade de\nMedida e Contagem (editável); ações Baixar PDF, menu de três pontos, Salvar e Voltar.\nRegra confirmada: apenas produtos com Estoque Ideal definido aparecem na contagem.\nObservação sobre prints do documento oficial: alguns prints mostram elementos (ordenação\n“Pendentes/Divergências/Contados primeiro”, tags “Contado”/”Divergência”, coluna\n“Divergências” no Histórico) que representam a versão em análise/protótipo e não\nnecessariamente o que está hoje em produção. Esses pontos são tratados como requisitos\na construir, não como estado atual confirmado.</p>"}, {"id": "5-escopo", "level": 2, "title": "5 Escopo", "words": 129, "screens": [], "html": "<p>Dentro do escopo (validado em call, conforme documento oficial v1.0): nomenclatura\n“Entrada/Saída” (RF-03); coexistência dos status Contado e Entrada/Saída (RF-04);\ncorreção da reordenação durante a digitação (RF-05); regra de produtos sem mínimo/ideal\nfora da contagem (RF-06); geração da lista de compras em 1 clique (RF-07); valor em\nestoque em R$ e setup de custo inicial (RF-08); saída de insumo sem abrir contagem\n(RF-11).\nEvoluções (novas funcionalidades) no escopo: transferência de estoque entre filiais (RF-09);\nestoque ideal sugerido por consumo (RF-10); disparo automático do link de contagem\n(RF-12).</p>\n<p>Fora do escopo deste PRD (por ora): redesenho das integrações Saipos/Everest; módulo de\nCMV; qualquer alteração não relacionada ao módulo de Estoque. Eventuais exclusões\nadicionais — Necessita validação.</p>"}, {"id": "6-requisitos-funcionais", "level": 2, "title": "6 Requisitos Funcionais", "words": 33, "screens": [], "html": "<p>Cada requisito traz: problema observado, comportamento esperado, critérios de aceite, tipo\ne prioridade (conforme o Resumo Executivo do documento oficial v1.0, já validado em call\ncom o responsável pelo time de Produto).</p>"}, {"id": "rf-03-nomenclatura-divergencia-vira-entrada-saida", "level": 2, "title": "RF-03 — Nomenclatura: “Divergência” vira “Entrada” / “Saída”", "words": 1135, "screens": [], "html": "<p>(Tipo: Ajuste de UX | Prioridade: Alta)\nProblema: os clientes são donos de restaurante; na rotina de caixa, “divergência”/”diferença”\njá significa problema. Usar o termo no Estoque cria associação negativa mesmo quando é\napenas uma entrada ou saída normal de mercadoria.\nComportamento esperado: substituir “divergência/diferença” por “Entrada” e “Saída”.\nDivergência negativa (contagem menor que o sistema) exibida como “Saída”; divergência\npositiva (contagem maior que o sistema) exibida como “Entrada”. Vale para textos de tela,\nnomes de coluna (ex.: coluna “Divergências” no Histórico) e tags de status.\nCritérios de aceite: nenhuma tela do módulo exibe “divergência/diferença” para o cliente; a\ncoluna do Histórico e as tags de contagem usam Entrada/Saída; o sinal (positivo/negativo)\nmapeia corretamente para Entrada/Saída.</p>\n<p>RF-04 — Status “Contado” e “Entrada/Saída” não podem ser\nexcludentes (Tipo: Bug | Prioridade: Alta)\nProblema: hoje um produto contado, ao ficar divergente, tem o status trocado de “Contado”\npara “Divergência”, como se fossem estados alternativos. Na prática, divergente ou não, o\nproduto foi contado, e essa informação deveria ser permanente.\nComportamento esperado: após digitar a contagem, deve existir uma ação para confirmar\ncomo contado; a partir daí a tag “Contado” é aplicada e não some mais. A informação de\nEntrada/Saída aparece como tag adicional (não substituta), informando “Entrada” ou “Saída”\ne o valor. O operador vê ao mesmo tempo: (1) que o produto foi contado e (2) se houve\nentrada ou saída e o valor.\nCritérios de aceite: uma vez confirmado, o item permanece “Contado” até o fim da\ncontagem; a tag de Entrada/Saída coexiste com “Contado”; nenhuma ação de digitação\nremove o “Contado”.</p>\n<p>RF-05 — Ordenação não pode reordenar a lista durante a\ndigitação (Tipo: Bug | Prioridade: Alta)\nProblema: ao ordenar por “Divergências/Pendentes primeiro”, o produto que o operador\nestá digitando some da tela e troca de posição em tempo real, obrigando-o a procurar o\nitem de novo (pior em quantidades de 2 dígitos).</p>\n<p>Comportamento esperado: o produto se mantém fixo na posição enquanto o operador\nedita/digita o valor, independentemente da ordenação. A reordenação só ocorre após a\nconfirmação daquele item (ver botão de confirmação do RF-04).\nCritérios de aceite: durante a edição de um item, sua posição não muda; a reordenação\nocorre apenas após confirmar o item.</p>\n<p>RF-06 — Produtos sem Mínimo/Ideal não entram na contagem\n(Tipo: Alinhado | Prioridade: Média)\nProblema: produtos sem “Mínimo” e “Ideal” configurados aparecem na contagem como “Não\nconfigurado”, com opção de “Incluir na contagem”. Sem essas referências, o sistema não\ntem base para apontar entrada/saída, calcular status (saudável/crítico) ou sugerir compra.\nComportamento esperado: produtos sem Mínimo e Ideal não podem ser incluídos na\ncontagem. Remover a opção “Incluir na contagem” para produtos “Não configurado”, ou\nbloquear a inclusão até que Mínimo e Ideal sejam preenchidos no cadastro do insumo.\nCritérios de aceite: não é possível adicionar à contagem um produto sem Mínimo/Ideal; a UI\ncomunica o motivo e direciona ao preenchimento no cadastro.</p>\n<p>RF-07 — Lista de compras gerada em 1 clique (Tipo: Alinhado\n| Prioridade: Alta)\nProblema: o fluxo de geração da lista de compras a partir da contagem não estava presente\nno MVP da nova versão.\nComportamento esperado: após a finalização da contagem, um único botão gera a lista de\ncompras com todos os insumos que tiverem necessidade de reposição, sem exigir seleção\nmanual item a item.\nSugestão adicional (edição da lista): permitir editar a lista gerada — alterar unidade de\nmedida, alterar quantidade e adicionar observação, que será enviada junto na cotação.\n(Escopo/versão a validar.)\nCritérios de aceite: um clique após a contagem gera a lista com todos os itens com\nnecessidade; a lista permite ajustar quantidade/unidade e observação antes do envio.</p>\n<p>RF-08 — Valor em Estoque (R$) e setup de custo inicial (Tipo:\nMelhoria | Prioridade: Alta)\nProblema: o dashboard do módulo não exibe quanto em R$ o restaurante tem parado em\nestoque, e falta uma forma de configurar o custo desde o início.\nComportamento esperado: adicionar um indicador de valor total em estoque no dashboard,\ncalculado a partir do custo unitário de cada insumo x quantidade em estoque. Para clientes\nnovos, permitir informar o valor unitário de cada insumo na configuração inicial do estoque,\npara calcular o R$ em estoque antes mesmo da primeira compra pela Foozi.\nRegra de transição: a partir das primeiras compras feitas pela Foozi, o sistema calcula o R$\nem estoque com base no valor efetivamente gasto nas compras feitas pela própria\nplataforma, substituindo o valor informado manualmente.</p>\n<p>Critérios de aceite: dashboard mostra valor total em estoque em R$; existe fluxo de custo\nunitário no setup inicial; após compras pela plataforma, o cálculo passa a usar o custo real\ndas compras.</p>\n<p>RF-09 — Transferência de estoque entre filiais (Tipo: Nova\nfuncionalidade | Prioridade: Média)\nNecessidade: clientes com mais de uma filial precisam movimentar insumos entre unidades.\nComportamento esperado: a transferência gera automaticamente, na loja de origem, uma\n“Saída” (quantidade transferida + valor R$ correspondente) e, na loja de destino, uma\n“Entrada” (quantidade recebida + valor R$ correspondente).\nCritérios de aceite: uma transferência atualiza estoque e valor nas duas filiais de forma\nconsistente; os relatórios de cada filial refletem Entrada/Saída corretamente.</p>\n<p>RF-10 — Estoque ideal sugerido por consumo (Tipo: Nova\nfuncionalidade | Prioridade: Média)\nNecessidade: hoje o “Ideal” de cada insumo é definido manualmente. Deseja-se calcular o\nconsumo com base nas saídas do período para sugerir automaticamente o estoque ideal.\nComportamento esperado (fluxo proposto): o cliente seleciona um período em um\ncalendário; o sistema calcula toda a saída de cada insumo naquele período; o sistema\nsugere o estoque ideal com base nesse consumo.\nCritérios de aceite: dado um período, o sistema apresenta o consumo por insumo e um\nvalor sugerido de estoque ideal; o cliente pode aceitar ou ajustar a sugestão.</p>\n<p>RF-11 — Saída de insumo sem abrir contagem (Tipo: Nova\nfuncionalidade | Prioridade: Alta)\nNecessidade: criar a opção de dar saída em um insumo sem precisar abrir uma contagem\ncompleta, para casos pontuais (perda, quebra, uso emergencial).\nJustificativa da prioridade: sem esse registro pontual, saídas do dia a dia ficam fora do\ncontrole até a próxima contagem completa, distorcendo o cálculo de entrada/saída, de valor\nem estoque (RF-08) e de estoque ideal por consumo (RF-10).\nCritérios de aceite: é possível registrar a saída de um insumo específico (com quantidade e\nmotivo) fora do fluxo de contagem; a saída impacta estoque, valor e histórico\nimediatamente.</p>\n<p>RF-12 — Disparo automático do link de contagem (Tipo: Nova\nfuncionalidade | Prioridade: Baixa)\nNecessidade: automatizar o envio do link de contagem para o número de telefone do\nestoquista, com dia da semana e horário programados configuráveis, eliminando o envio\nmanual do gestor a cada vez.</p>\n<p>Critérios de aceite: o gestor configura destinatário, dia da semana e horário; o sistema\ndispara o link automaticamente conforme a programação. Canal de envio (ex.:\nWhatsApp/SMS) — Necessita validação.</p>"}, {"id": "7-regras-de-negocio", "level": 2, "title": "7 Regras de Negócio", "words": 115, "screens": [], "html": "<p>RN-01: Apenas produtos com Estoque Ideal (e Mínimo) definidos participam da contagem\n(confirmado por inspeção e alinhado em call — ver RF-06).\nRN-02: Divergência negativa (contagem &lt; sistema) = “Saída”; divergência positiva\n(contagem &gt; sistema) = “Entrada” (RF-03).\nRN-03: “Contado” é permanente após confirmação e coexiste com Entrada/Saída (RF-04).\nRN-04: Valor em estoque = custo unitário x quantidade; custo inicial manual para clientes\nnovos, migrando para custo real das compras feitas pela Foozi (RF-08).\nRN-05: Transferência entre filiais gera Saída na origem e Entrada no destino, com\nquantidade e valor equivalentes (RF-09).\nRN-06: Saída pontual (perda/quebra/uso) impacta estoque, valor e histórico imediatamente,\nsem contagem completa (RF-11).</p>"}, {"id": "8-requisitos-nao-funcionais", "level": 2, "title": "8 Requisitos Não-Funcionais", "words": 65, "screens": [], "html": "<p>Usabilidade (prioridade alta): linguagem adaptada ao público de restaurante; tela de\ncontagem otimizada para digitação rápida (item fixo durante a edição).\nConsistência de dados: movimentações (entrada/saída/transferência) devem manter\nestoque e valor consistentes entre filiais.\nResponsividade: a tela de contagem é usada por estoquista, possivelmente em dispositivos\nmóveis — comportamento responsivo a validar.\nDesempenho, segurança/permissões e auditoria das movimentações: Necessita validação\nde requisitos específicos.</p>"}, {"id": "9-priorizacao-e-roadmap-proposta", "level": 2, "title": "9 Priorização e Roadmap (proposta)", "words": 84, "screens": [], "html": "<p>Prioridade Alta (primeiro): RF-03, RF-04, RF-05, RF-07, RF-08, RF-11.\nPrioridade Média: RF-06, RF-09, RF-10.\nPrioridade Baixa: RF-12.\nSequência sugerida: (a) correções de contagem do uso diário (RF-04, RF-05) e\nnomenclatura (RF-03); (b) regra de elegibilidade (RF-06) e lista de compras (RF-07); © valor\nem estoque (RF-08) e saída pontual (RF-11); (d) evoluções (RF-09, RF-10); (e) automação\nde disparo (RF-12). Sequência a validar com o time.</p>"}, {"id": "10-dependencias-e-riscos", "level": 2, "title": "10 Dependências e Riscos", "words": 78, "screens": [], "html": "<p>RF-10 e RF-08 dependem de dados confiáveis de saída — logo, dependem de RF-11 e da\ncorreção da contagem (RF-04/RF-05).\nRF-03 impacta várias telas e o Histórico; risco de textos residuais de “divergência” em\npontos não mapeados.</p>\n<p>RF-08 depende da disponibilidade do custo real das compras feitas pela plataforma.\nRisco de escopo: itens “Nova funcionalidade” (RF-09, RF-10, RF-12) podem exceder o\nMVP; confirmar corte de escopo com Produto.</p>"}, {"id": "11-questoes-em-aberto-necessita-validacao", "level": 2, "title": "11 Questões em Aberto (Necessita validação)", "words": 51, "screens": [], "html": "<p>Metas numéricas das métricas de sucesso.\nMatriz de permissões por perfil no módulo de Estoque.\nCanal de envio do link de contagem (RF-12): WhatsApp, SMS ou outro.\nComportamento responsivo esperado na tela de contagem.\nRegras de auditoria/rastreabilidade das movimentações.\nEscopo final do MVP entre os itens de “Nova funcionalidade”.</p>"}, {"id": "12-resumo-executivo-backlog-priorizado", "level": 2, "title": "12 Resumo Executivo (backlog priorizado)", "words": 167, "screens": [], "html": "<p>Todos os pontos levantados, com tipo e prioridade validados em call, conforme o documento\noficial v1.0.</p>\n<p>Item                  Descrição             Tipo                  Prioridade</p>\n<p>RF-03                 Divergência vira     Ajuste de UX           Alta\n                       “Entrada”/”Saída” na\n                       linguagem do cliente</p>\n<p>RF-04                 Status “Contado” e    Bug                   Alta\n                       “Divergente” não\n                       podem ser\n                       excludentes</p>\n<p>RF-05                 Ordenação             Bug                   Alta\n                       “Divergências/Pend\n                       entes primeiro”\n                       reordena a lista\n                       durante a digitação</p>\n<p>RF-06                 Produtos sem          Alinhado              Média\n                       Mínimo/Ideal\n                       configurado não\n                       podem entrar na\n                       contagem</p>\n<p>RF-07                 Botão único para      Alinhado              Alta\n                       gerar lista de\n                       compras de todos\n                       os insumos com\n                       necessidade</p>\n<p>RF-08                 Dashboard não         Melhoria              Alta</p>\n<p>mostra valor (R$) do</p>\n<pre><code>    estoque; falta setup\n    inicial de custo\n</code></pre>\n<p>RF-09   Transferência de        Nova funcionalidade   Média</p>\n<pre><code>    estoque entre filiais\n    do mesmo cliente\n</code></pre>\n<p>RF-10   Sugestão de             Nova funcionalidade   Média</p>\n<pre><code>    estoque ideal\n    calculada com base\n    no consumo\n    histórico\n</code></pre>\n<p>RF-11   Dar saída em um         Nova funcionalidade   Alta</p>\n<pre><code>    insumo sem\n    precisar abrir uma\n    contagem\n</code></pre>\n<p>RF-12   Disparo automático      Nova funcionalidade   Baixa</p>\n<pre><code>    do link de estoque\n    agendado por\n    dia/horário\n</code></pre>"}]}, {"id": "permissoes", "path": "02-regras/permissoes.md", "title": "Permissões", "group": "02 · Regras", "words": 1456, "sections": [{"id": "_intro", "level": 1, "title": "Permissões", "words": 63, "screens": [], "html": "<blockquote>\n<p>Convertido de <code>permissoes.pdf</code>. O PDF original está em <code>_fontes/</code> (fora do git).</p>\n</blockquote>\n<p>🕶️\nPermissões por cargo\nEste documento descreve o que cada cargo pode e não pode fazer na plataforma Foozi. As\nregras são implementadas com CASL no pacote @foozi/auth e avaliadas em runtime\npor defineAbilitiesFor() .\nFonte da verdade: arquivos em src/role-permissions/ . Ao alterar permissões no código, atualize\neste documento.</p>"}, {"id": "cargos-disponiveis", "level": 2, "title": "Cargos disponíveis", "words": 30, "screens": [], "html": "<p>Cargo ( user.role ) Rótulo na UI    Escopo\n  ADMIN              Administrador   Organização + operações avançadas\n  MANAGER            Gerente         Operações do dia a dia\n  OPERATOR           Operador        Operações limitadas\nRótulos exibidos na UI definidos em labeledRoles .</p>"}, {"id": "dois-niveis-de-cargo", "level": 2, "title": "Dois níveis de cargo", "words": 85, "screens": [], "html": "<p>As permissões de um usuário são calculadas a partir de dois níveis independentes:</p>\n<ol>\n<li>\n<p>Cargo na organização ( user.role )\nDefine o conjunto base de permissões nos arquivos:\n      ADMIN.ts</p>\n<p>MANAGER.ts</p>\n<p>OPERATOR.ts</p>\n</li>\n<li>\n<p>Cargo por filial ( user.companies[].role )\nCada entrada em user.companies representa uma filial da qual o usuário é membro, com um\ncargo específico daquela filial ( ADMIN , MANAGER ou OPERATOR ). Esse cargo:\n     Adiciona regras exclusivas via COMPANY-PERMISSIONS.ts\n     Restringe recursos com companyId às filiais em que o usuário é membro</p>\n</li>\n</ol>"}, {"id": "exemplos-praticos", "level": 2, "title": "Exemplos práticos", "words": 87, "screens": [], "html": "<p>Um Administrador na organização tem permissões amplas, mas recursos como estoque,\n     listas de compra, tokens de acesso e integrações ficam limitados às filiais em que é\n     membro.\n     Um usuário pode ser Gerente na organização e Administrador em uma filial específica.\n     Nesse caso, as permissões de gestão de filial (excluir filial, criar membros) vêm do cargo na\n     filial, não do cargo na organização.\n     Ter cargo ADMIN na organização não concede automaticamente permissões de\n     administrador de filial. É necessário ter ADMIN como company.role em pelo menos uma filial.</p>"}, {"id": "permissoes-exclusivas-por-filial", "level": 2, "title": "Permissões exclusivas por filial", "words": 22, "screens": [], "html": "<p>Definidas em COMPANY-PERMISSIONS.ts . Aplicam-se com base no cargo em cada\nfilial ( user.companies[].role ), independentemente do cargo na organização.</p>"}, {"id": "administrador-de-filial", "level": 2, "title": "Administrador de filial", "words": 73, "screens": [], "html": "<p>Cargo na filial: ADMIN .\n Recurso                     Pode                                                Não pode\n                             Atualizar, excluir, duplicar e criar membros\n Filial ( Company )                                                              —\n                             em qualquer filial da organização ativa\n                             Criar membros nas filiais em que é admin;\n Membros de                                                                      Gerenciar membros de filiais\n                  cargo elevado na filial)</p>\n<p>Recursos restritos a filiais membro</p>\n<p>Recurso               Pode                                  Não pode\n Listas de compra      Listar; visualizar, criar e atualizar Excluir; acessar listas de outras filiais\n Estoque               —                                     Qualquer ação\n Webhooks              —                                     Qualquer ação\n Tokens de acesso —                                          Qualquer ação\n Integrações           —                                     Qualquer ação</p>"}, {"id": "matriz-comparativa-resumida", "level": 2, "title": "Matriz comparativa resumida", "words": 216, "screens": [], "html": "<p>Legenda:     ✅ permitido · ⚠️ parcial · ❌ negado · 🔒 restrito a filiais membro\n Recurso / Ação                           ADMIN              MANAGER             OPERATOR\n Excluir organização              ✅                          ❌                   ❌\n Gerenciar billing                ✅                          ❌                   ❌\n Gerenciar pagamentos             ✅                          ✅                   ❌\n Convites                         ✅                          ✅                   ❌\n Membros da org (todos os cargos) ✅                          ❌                   ❌\n Membros da org (apenas Operador) ✅                          ✅                   ❌\n Excluir pedido                   ✅                          ✅                   ❌\n Gerenciar fornecedores           ✅                          ✅                   ❌\n Criar/atualizar fornecedor       ✅                          ✅                   ✅\n Excluir fornecedor               ✅                          ✅                   ❌\n Produtos globais (listar)        ✅                          ❌                   ❌\n Webhooks                         ✅                          ❌                   ❌\n Tokens de acesso                 🔒✅                         ❌                   ❌\n Integrações                      🔒✅                         ❌                   ❌\n Estoque completo                 🔒✅                         🔒 ⚠️                ❌\n  inventory_fix    no estoque     🔒✅                         ❌                   ❌\n Excluir lista de compra          🔒✅                         🔒✅                  ❌\n Automações de requisição         🔒✅                         🔒✅                  ❌\n Excluir filial                   ⚠️ filial                  ❌                   ❌</p>\n<p>Recurso / Ação                            ADMIN              MANAGER              OPERATOR\n Duplicar filial                           ⚠️ filial          ❌                    ❌\n Criar membro de filial                    ⚠️ filial          ❌                    ❌\n Gerenciar membros de filial               ⚠️ filial          ⚠️ filial            ❌\n Notas fiscais                             ⚠️ filial          ❌                    ❌\n   ⚠️ filial = depende do cargo na filial (        COMPANY-PERMISSIONS    ), não apenas do cargo na\n   organização.</p>\n<p>Recursos escopados por filial</p>\n<p>Os recursos abaixo exigem que o usuário seja membro da filial ( companyId em user.companies ),\nindependentemente do cargo na organização:\n                                                       Campo de\n Recurso (subject CASL)                                                    Cargos com acesso\n                                                       escopo\n Lista de compra ( ShoppingList )                      companyId           ADMIN, MANAGER, OPERATOR\n Token de acesso ( AccessToken )                       companyId           ADMIN\n Produto de estoque ( StockProduct )                   companyId           ADMIN, MANAGER\n Link temporário de estoque                            companyId           ADMIN\n ( StockTemporaryLink )\n Integração ( Integration )                            companyId           ADMIN\n Compartilhamento de requisição                        companyId           ADMIN, MANAGER, OPERATOR\n ( QuotationRequestShare )\n Automação de requisição\n                                                       companies           ADMIN, MANAGER\n ( QuotationRequestAutomation )\n                                                                           ADMIN de filial (via COMPANY-\n Nota fiscal ( Invoice )                               companyId\n                                                                           PERMISSIONS )</p>\n<p>ADMIN, MANAGER, OPERATOR (filiais</p>\n<p>Visualização de filial ( Company get)                 id\n                                                                           membro)\n                                                                           MANAGER (filiais membro); ADMIN de\n Atualização de filial ( Company update)               id\n                                                                           filial (qualquer filial da org)</p>"}, {"id": "mapeamento-recurso-dominio-de-produto", "level": 2, "title": "Mapeamento recurso → domínio de produto", "words": 82, "screens": ["produtos"], "html": "<p>Subject CASL                     Domínio de produto\n  Organization                    Organização\n  OrganizationMember              Membros da organização\n  Company                         Filial\n  CompanyMember                   Membros da filial\n  Invitation                      Convites\n  Billing                         Assinatura / faturamento</p>\n<p>Subject CASL                  Domínio de produto</p>\n<p>Payment                      Pagamentos\n  Invoice                      Notas fiscais\n  Order                        Pedidos\n  Quotation                    Cotações\n  QuotationRequest             Requisições de cotação\n  QuotationRequestAutomation   Automações de requisição\n  QuotationRequestShare        Compartilhamento de requisição\n  OrganizationProduct          Produtos da organização\n  Product                      Catálogo global de produtos\n  Supplier                     Fornecedores\n  ShoppingList                 Listas de compra\n  StockProduct                 Estoque\n  StockTemporaryLink           Link temporário de inventário\n  Webhook                      Webhooks\n  AccessToken                  Tokens de acesso à API\n  Integration                  Integrações (ex.: ERP)</p>"}]}, {"id": "design-ui", "path": "02-regras/design-ui.md", "title": "Regras de UI", "group": "02 · Regras", "words": 365, "sections": [{"id": "regra-controles-aparecem-quando-tem-trabalho-a-fazer", "level": 2, "title": "Regra: controles aparecem quando têm trabalho a fazer", "words": 287, "screens": [], "html": "<p>Busca, filtro, ordenação e exportação <strong>não são mobília de tela</strong>. Cada um resolve uma dor\nespecífica, e nenhum deles deve aparecer antes que a dor exista. Um filtro de Filial com uma\nfilial só, ou uma busca sobre três registros, custa altura de tela, atenção e confiança — o\nusuário novo lê aquilo como \"aqui vai ficar complicado\".</p>\n<p>O limiar é <strong>por controle</strong>, nunca um interruptor único para a tela inteira.</p>\n<table>\n<thead>\n<tr>\n<th>Controle</th>\n<th>Só aparece quando</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Ordenação</td>\n<td>8+ registros (mais do que se varre de olho numa tela)</td>\n</tr>\n<tr>\n<td>Busca</td>\n<td>8+ registros</td>\n</tr>\n<tr>\n<td>Filtro de dimensão (status, filial, responsável, categoria)</td>\n<td>8+ registros <strong>e</strong> 2+ valores distintos naquela dimensão</td>\n</tr>\n<tr>\n<td>Exportar / Download</td>\n<td>8+ registros — abaixo disso a tela já é o relatório</td>\n</tr>\n<tr>\n<td>Paginação</td>\n<td>quando a lista passa de uma página real</td>\n</tr>\n<tr>\n<td>Seleção em massa</td>\n<td>2+ registros selecionáveis</td>\n</tr>\n</tbody>\n</table>\n<p>Abaixo do limiar a lista aparece sozinha, sem barra e sem espaço reservado. Nada de controle\ndesabilitado, nada de \"0 resultados\", nada de placeholder.</p>\n<p><strong>Três regras que acompanham:</strong></p>\n<ol>\n<li><strong>Controle escondido não filtra.</strong> Se a barra sumiu, o estado dela é ignorado no cálculo da\n   lista. Nunca pode existir filtro invisível alterando o que se vê.</li>\n<li><strong>O controle nasce sozinho, não em bloco.</strong> Ao cruzar o limiar, aparece só o que tem função:\n   com 9 requisições numa filial só, entram ordenação, busca e status — Filial continua fora.</li>\n<li><strong>Vazio por filtro ≠ vazio por ausência.</strong> \"Nenhum resultado para este filtro\" com botão de\n   limpar só existe quando há filtro aplicado. Lista vazia de verdade recebe o estado vazio com\n   a cadeia de dependência e o caminho de saída.</li>\n</ol>\n<p>A mesma lógica vale para qualquer elemento: campo, botão, ícone ou aba <strong>precisa ter função,\ndestino e consequência visível</strong>. Se não tem, ajuste, conecte ao fluxo ou remova.</p>"}, {"id": "estados-vazios", "level": 2, "title": "Estados vazios", "words": 58, "screens": [], "html": "<p>Todo estado vazio segue o mesmo lockup: bloco de 42×42 (raio 10px, glifo de 22px, fundo índigo\nclaro — vermelho só quando a cor é semântica), título 21px Space Grotesk 700, corpo 13.5px, e\nquando houver dependência, a cadeia de passos numerados com o passo atual marcado e um botão de\nsaída. Alinhados à esquerda, <code>padding: 32px</code>.</p>"}, {"id": "grid", "level": 2, "title": "Grid", "words": 20, "screens": [], "html": "<p>Padding interno de card: 20px. Célula de tabela: 16px. Ritmo vertical: 20px entre blocos de\ntela, 14px entre cards irmãos.</p>"}]}, {"id": "estoque-niveis", "path": "02-regras/estoque-niveis.md", "title": "Níveis de estoque", "group": "02 · Regras", "words": 712, "sections": [{"id": "_intro", "level": 1, "title": "Níveis de estoque", "words": 59, "screens": [], "html": "<p><strong>Status das fontes</strong>\n- <code>app.foozi.com.br/*</code> → sistema em produção hoje.\n- <code>fix-words-43591376.figma.site/*</code> → <strong>proposta nova.</strong> Não existe no sistema.\n  Serve como direção, não como especificação fechada. Podemos repensar.</p>\n<p><strong>Princípio de produto declarado pelo usuário:</strong></p>\n<blockquote>\n<p>O controle precisa estar com o usuário. Quem define o limite mínimo de estoque\né o usuário. Os dados podem ser mockados.</p>\n</blockquote>\n<hr />"}, {"id": "o-que-os-prints-mostram", "level": 2, "title": "O que os prints mostram", "words": 74, "screens": [], "html": "<p>Derivado dos 14 produtos da tela de Configuração — a regra bate em todos:</p>\n<table>\n<thead>\n<tr>\n<th>Nível</th>\n<th>Condição observada</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Crítico</td>\n<td>atual &lt; mínimo</td>\n</tr>\n<tr>\n<td>Atenção</td>\n<td>mínimo ≤ atual &lt; mínimo × 1,5</td>\n</tr>\n<tr>\n<td>OK</td>\n<td>mínimo × 1,5 ≤ atual ≤ ideal</td>\n</tr>\n<tr>\n<td>Excesso</td>\n<td>atual &gt; ideal</td>\n</tr>\n<tr>\n<td>Não configurado</td>\n<td>sem mínimo ou sem ideal</td>\n</tr>\n</tbody>\n</table>\n<p>Verificação: Cebola 7 (mín 5) → Atenção, pois 7 &lt; 7,5 · Tomate 9 (mín 5) → OK, pois\n9 ≥ 7,5 · Detergente 4 (mín 3) → Atenção, pois 4 &lt; 4,5 · Saco 8 (mín 5) → OK.</p>"}, {"id": "o-problema-com-esta-regra", "level": 2, "title": "O problema com esta regra", "words": 108, "screens": [], "html": "<p>O usuário definiu <strong>mínimo</strong> e <strong>ideal</strong>. Ele nunca definiu <strong>1,5</strong>.</p>\n<p>O multiplicador de 1,5 é uma decisão do sistema disfarçada de dado do cliente. Ele\ngoverna quando o alerta aparece — ou seja, governa quando o restaurante é avisado\nde que precisa comprar — e não está sob controle de quem opera. Isso contradiz o\nprincípio acima.</p>\n<p>Consequência prática: um insumo de giro rápido e um de giro lento recebem a mesma\nmargem de aviso. Para a Água mineral (mín 12) a faixa de Atenção é de 12 a 18. Para\no Bacalhau (mín 2) é de 2 a 3. O sistema escolheu essas faixas, não o cliente.</p>"}, {"id": "tres-saidas-possiveis", "level": 2, "title": "Três saídas possíveis", "words": 150, "screens": [], "html": "<p><strong>A · Derivar do que o usuário já definiu.</strong>\nAtenção = do mínimo até o ponto médio entre mínimo e ideal.\nNenhum número novo, nenhum campo novo — a faixa passa a respeitar a distância que o\npróprio cliente configurou entre mínimo e ideal.\nÁgua: 12 → 24 · Bacalhau: 2 → 5 · Cebola 7 continua Atenção · Tomate 9 vira Atenção.</p>\n<p><strong>B · Expor o limiar como configuração.</strong>\nUm campo a mais por produto, ou um padrão da organização com exceção por insumo.\nMáximo controle, maior custo de configuração — e a configuração já é o ponto de\natrito conhecido do módulo.</p>\n<p><strong>C · Eliminar o nível Atenção.</strong>\nRestam Crítico, OK e Excesso — os três que mapeiam direto para valores que o usuário\ndefiniu. Perde-se o aviso antecipado.</p>\n<p><strong>Recomendação: A.</strong> Mantém os quatro níveis, remove o número inventado, e o\ncomportamento passa a variar por insumo sem pedir nada a mais do cliente.\nDecisão pendente com o usuário.</p>\n<hr />"}, {"id": "outros-numeros-observados-nos-prints", "level": 2, "title": "Outros números observados nos prints", "words": 321, "screens": [], "html": "<p><strong>CMV</strong> — Ideal abaixo de 28% · Atenção 28% a 35% · Crítico acima de 35%.</p>\n<p>O princípio de \"controle com o usuário\" <strong>não se aplica aqui do mesmo jeito</strong>, e a\nrazão é a origem do dado. Mínimo e ideal são digitados pelo cliente. O CMV não é\ndigitado: o sistema o calcula a partir do que já aconteceu na plataforma — estoque\ninicial, compras vindas das cotações, estoque final. O único campo que o cliente\ninforma é o faturamento do período.</p>\n<p>Consequências:</p>\n<ol>\n<li><strong>O CMV só existe para quem compra pela Foozi.</strong> Cliente novo, ou cliente que\n   cota fora da plataforma, não tem a parcela de compras — e o número não fecha.\n   Conecta direto com a regra de transição do RF-08: custo informado à mão no\n   início, custo real das compras depois.</li>\n<li><strong>As faixas de 28% e 35% continuam sem origem declarada.</strong> Diferente do 1,5×,\n   elas podem ser referência legítima de mercado para foodservice — não uma escolha\n   arbitrária. Vale confirmar a fonte antes de tratar como fixas, mas o risco é\n   menor: são leitura de resultado, não gatilho de ação.</li>\n<li><strong>Nada a decidir sobre configurabilidade por ora.</strong> Sem o cliente definindo nada\n   além do faturamento, não há controle a devolver a ele.</li>\n</ol>\n<p><strong>Lista de compra</strong> — quantidade sugerida = ideal − atual. Confere em todos:\nBatata 15−2=13 · Água 36−2=34 · Farinha 8−0=8 · Biscoito 20−4=16.\nPrioridades vistas: Crítica e Alta.</p>\n<p><strong>Zerado</strong> — a Farinha (0 de 3) aparece como <em>Crítico</em> na Configuração e como\n<em>Zerado</em> no Dashboard. Dois rótulos para o mesmo estado. Se Zerado for nível próprio,\nprecisa existir nas duas telas; se for destaque, o Dashboard deveria dizer Crítico.</p>\n<p><strong>Contagem</strong> — o Histórico registra duração (2h45min, 3h30min). A métrica de tempo\nde contagem já está instrumentada, mesmo sem meta definida.</p>\n<p><strong>RF-03 não aplicado</strong> — \"divergências\" aparece nas Contagens, no Dashboard e no\nHistórico da proposta nova. A renomeação para Entrada/Saída ainda não entrou nestas telas.</p>"}]}, {"id": "decisoes", "path": "02-regras/decisoes.md", "title": "Decisões", "group": "02 · Regras", "words": 477, "sections": [{"id": "_intro", "level": 1, "title": "Decisões", "words": 37, "screens": [], "html": "<blockquote>\n<p>Respostas do usuário. Fonte de verdade sobre o que estava em aberto.\n<strong>Regra mestra definida:</strong> os prints enviados são o sistema em produção.\nO que não está nos prints é invenção ou futuro — não documentar como existente.</p>\n</blockquote>"}, {"id": "resolvidas", "level": 2, "title": "Resolvidas", "words": 321, "screens": [], "html": "<p><strong>D-01 · Transferência entre filiais</strong> — PERMANECE no escopo, prioridade média.\nResolve a contradição PRD × reunião a favor do PRD.</p>\n<p><strong>D-02 · Identificação do estoquista</strong> — Hoje o responsável registrado é o usuário\nque criou o link temporário. Não é exigida identificação do operador hoje,\nmas <strong>vamos identificar o usuário</strong>. Requisito futuro, não bloqueia agora.</p>\n<p><strong>D-04 · Gerar requisição pela contagem</strong> — O botão <strong>apenas cria a lista</strong>.\nA requisição é gerada depois, pelo comprador ou pelo cliente, a partir da lista.\nVale para todos os planos. Simplifica o RF-07: não há bifurcação por plano.</p>\n<p><strong>D-08 · Ordem de entrega</strong> — Prints = produção. Fora dos prints = futuro.</p>\n<p><strong>D-09 · Canal do disparo automático</strong> — <strong>Reportana</strong>, sobre a API oficial do\nWhatsApp. Integração já em uso.</p>\n<p><strong>D-10 · Metas das métricas</strong> — Não existe nada definido. Fica como lacuna\nassumida, não como pendência a cobrar.</p>\n<p><strong>D-11 · Importação por planilha</strong> — NÃO é defeito. O modelo vem vazio por\ndesenho: o usuário preenche com os produtos que quer. A lista completa de\nprodutos com código pode ser baixada na página de Produtos. Remover da lista\nde problemas — era leitura equivocada da transcrição.</p>\n<p><strong>D-12 · Resetar Estoque</strong> — <strong>Não é reversível.</strong> Registra apenas que o usuário\nexecutou o reset. Permitido a <strong>Administrador e Gerente</strong>. Risco alto confirmado:\nação destrutiva, irreversível, sem registro do estado anterior.</p>\n<p><strong>D-15 · Edição em massa</strong> — ENTRA. Critério declarado: tudo que facilita para\no usuário deve entrar.</p>\n<p><strong>D-17 · Dados de venda em tempo real</strong> — <strong>Não.</strong> Encerra a questão.\nO nível de estoque permanece derivado da contagem. Sem alerta de ruptura em\ntempo real — é restrição permanente do produto, não lacuna temporária.</p>\n<p><strong>D-05 · Papéis e permissões</strong> — Parcial: Admin e Gerente podem resetar estoque.\nUsuário tem telas e um .md com funcionalidade e jornada do estoque que precisa,\nainda não enviados. O estoque dos prints está longe do necessário.</p>\n<p><strong>D-03 · Contagem por local</strong> — Em aberto. Usuário tem material mais final\npara enviar antes de decidir.</p>"}, {"id": "aguardando-material-do-usuario", "level": 2, "title": "Aguardando material do usuário", "words": 18, "screens": [], "html": "<ul>\n<li><strong>.md + telas do estoque desejado</strong> (D-03, D-05) — muda a seção Funcionalidades\n  e a matriz de permissões.</li>\n</ul>"}, {"id": "perguntas-que-precisam-ser-reformuladas", "level": 2, "title": "Perguntas que precisam ser reformuladas", "words": 32, "screens": [], "html": "<p>D-06 (níveis de estoque), D-13 (prova de conceito), D-14 (reforma tributária)\ne D-16 (botão Configurar Estoque) não ficaram claras. Reformular com exemplo\nvisual antes de perguntar de novo.</p>"}, {"id": "impacto-na-documentacao", "level": 2, "title": "Impacto na documentação", "words": 69, "screens": [], "html": "<table>\n<thead>\n<tr>\n<th>Seção</th>\n<th>O que muda</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Requisitos</td>\n<td>RF-07 perde a bifurcação por plano; RF-09 confirmado; C-04 (edição em massa) vira requisito; C-06 (planilha) sai</td>\n</tr>\n<tr>\n<td>Funcionalidades</td>\n<td>Importação por planilha deixa de ser \"com defeito\"</td>\n</tr>\n<tr>\n<td>Regras de negócio</td>\n<td>Nova: reset restrito a Admin e Gerente, irreversível</td>\n</tr>\n<tr>\n<td>Restrições</td>\n<td>Posição de estoque nunca será tempo real — definitivo</td>\n</tr>\n<tr>\n<td>Riscos</td>\n<td>Reset irreversível sobe para risco alto confirmado</td>\n</tr>\n<tr>\n<td>Dúvidas</td>\n<td>De 17 para 5 abertas</td>\n</tr>\n</tbody>\n</table>"}]}, {"id": "spec-tecnica", "path": "02-regras/spec-tecnica.md", "title": "Spec técnica", "group": "02 · Regras", "words": 4383, "sections": [{"id": "controle-do-documento", "level": 2, "title": "Controle do documento", "words": 29, "screens": [], "html": "<table>\n<thead>\n<tr>\n<th>Campo</th>\n<th>Valor</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Feature</td>\n<td>IA-1 - Comparativo de Preços</td>\n</tr>\n<tr>\n<td>Versão</td>\n<td>0.6</td>\n</tr>\n<tr>\n<td>Estado</td>\n<td>Aprovada para implementação do MVP</td>\n</tr>\n<tr>\n<td>Público principal</td>\n<td>Compradores e gestores de compras</td>\n</tr>\n<tr>\n<td>Escopo</td>\n<td>MVP funcional e técnico</td>\n</tr>\n</tbody>\n</table>"}, {"id": "historico-de-revisao", "level": 3, "title": "Histórico de revisão", "words": 120, "screens": [], "html": "<table>\n<thead>\n<tr>\n<th>Versão</th>\n<th>Alteração</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>0.1</td>\n<td>Especificação funcional e técnica inicial.</td>\n</tr>\n<tr>\n<td>0.2</td>\n<td>V1 simplificada para entrega rápida: cálculo e explicação determinísticos, somente cotações respondidas, microsserviço único, ingestão e operação essenciais.</td>\n</tr>\n<tr>\n<td>0.3</td>\n<td>LLM incluído na experiência visível para gerar insight sobre um payload determinístico, com guardrails mínimos e fallback por template.</td>\n</tr>\n<tr>\n<td>0.4</td>\n<td>Arquitetura hexagonal, jornada totalmente local e promoção posterior por substituição configurável de adaptadores.</td>\n</tr>\n<tr>\n<td>0.5</td>\n<td>Incluídas as perspectivas simultâneas de histórico próprio e referência externa sem identificação da origem; removida amostra mínima; detalhados filtro geográfico, análise contextual do LLM, privacidade, arquitetura e marcos do MVP.</td>\n</tr>\n<tr>\n<td>0.6</td>\n<td>Substituída a seleção de filial por multisseleção de localidades; mercado baseado na localidade histórica da cotação; incluída oportunidade estimada de economia.</td>\n</tr>\n</tbody>\n</table>"}, {"id": "1-como-interpretar-esta-spec", "level": 2, "title": "1. Como interpretar esta SPEC", "words": 40, "screens": [], "html": "<ul>\n<li><strong>Comportamento atual:</strong> capacidade observada no código; não constitui requisito final.</li>\n<li><strong>Decisão do MVP:</strong> comportamento normativo para esta entrega.</li>\n</ul>\n<p>A autorização comercial para uso agregado e desidentificado na saída dos dados de mercado já foi validada e não é uma pendência.</p>"}, {"id": "2-contexto-e-objetivo", "level": 2, "title": "2. Contexto e objetivo", "words": 164, "screens": [], "html": "<p>O Comparativo de Preços é a análise IA-1 da plataforma de compras da Foozi.</p>\n<p>A Foozi precisa entregar valor rapidamente. O MVP deve ser útil, verificável e seguro, sem antecipar infraestrutura genérica, robustez ou escala ainda não demonstradas.</p>\n<p>O comprador seleciona uma ou mais localidades, um produto e um período e recebe duas perspectivas independentes, exibidas juntas sempre que disponíveis:</p>\n<ol>\n<li><strong>Meu histórico:</strong> preços dos fornecedores com os quais sua organização já cotou, identificados pelo nome.</li>\n<li><strong>Referência de mercado Foozi:</strong> preços comparáveis de cotações destinadas a filiais de outras organizações nas mesmas cidades/UF selecionadas, agregados e sem identificação da origem na saída.</li>\n</ol>\n<p>A Referência de mercado Foozi aparece sempre que houver ao menos uma observação elegível, independentemente da quantidade de fornecedores próprios. A feature identifica oportunidades de economia e apoia redução de custos em cotações e negociações, mas não escolhe fornecedor, aprova cotação ou realiza compra.</p>\n<p>O Comparativo torna oportunidades de economia mensuráveis, sem garantir percentual fixo por consulta ou compra.</p>"}, {"id": "3-principios-do-mvp", "level": 2, "title": "3. Princípios do MVP", "words": 220, "screens": [], "html": "<ol>\n<li>Elegibilidade, normalização, média, mínimo, máximo, diferenças e ranking são determinísticos em código.</li>\n<li>Somente preços positivos em BRL e com unidade comparável entram nos cálculos.</li>\n<li>Não existe amostra mínima para exibir histórico ou Referência de mercado Foozi.</li>\n<li>Uma observação é aceitável, com contagem e limitação visíveis.</li>\n<li>Dois fornecedores próprios são necessários somente para formar ranking entre fornecedores conhecidos.</li>\n<li>A Referência de mercado Foozi é desidentificada na saída: não expõe nomes ou IDs de organizações e fornecedores externos, cotações ou itens de terceiros.</li>\n<li>A cidade/UF da filial destinatária, registrada na cotação, comprova que o fornecedor atendeu aquela localidade naquela observação.</li>\n<li>O LLM interpreta condições observáveis, mas não calcula nem altera métricas ou ranking.</li>\n<li>O LLM usa linguagem de associação ou hipótese e nunca alega causalidade não comprovada.</li>\n<li>Falha do LLM mantém os resultados numéricos por meio de fallback determinístico.</li>\n<li>Cada resultado indisponível informa <strong>dados insuficientes</strong> e explica, em linguagem compreensível, o dado ausente ou a regra impeditiva.</li>\n<li>RAG, embeddings, banco vetorial, cache e plataformas genéricas de guardrails ou eventos não são dependências do MVP.</li>\n<li>O MVP pode indicar oportunidade estimada de economia com base nas médias calculadas, sem tratá-la como economia realizada ou garantida.</li>\n<li>A API pública permanece exclusivamente GraphQL e a decisão final permanece humana.</li>\n</ol>"}, {"id": "4-1-entradas", "level": 3, "title": "4.1. Entradas", "words": 92, "screens": ["dashboard"], "html": "<ul>\n<li>Organização ativa derivada da sessão pelo BFF.</li>\n<li><code>locations[]</code>: uma ou mais chaves estáveis de cidade/UF disponíveis nas filiais autorizadas da organização.</li>\n<li>Produto da organização e chave de produto comparável, quando disponível.</li>\n<li>Período de 30, 60, 90 ou 180 dias, encerrado no instante da consulta.</li>\n</ul>\n<p>O BFF deriva as opções das filiais autorizadas, remove localidades duplicadas e seleciona todas por padrão. O usuário pode alterar a multisseleção, mas ao menos uma localidade é obrigatória. Localidade enviada pelo cliente não é prova de autorização e deve pertencer ao conjunto disponível para a organização.</p>"}, {"id": "4-2-fonte-e-elegibilidade", "level": 3, "title": "4.2. Fonte e elegibilidade", "words": 258, "screens": [], "html": "<p>O MVP utiliza itens de cotações respondidas. Compras efetivadas ficam fora para não misturar preço cotado com preço pago.</p>\n<p>Uma observação é elegível quando:</p>\n<ol>\n<li>corresponde ao produto ou à chave comparável selecionada;</li>\n<li>pertence a cotação respondida, não excluída, cancelada ou invalidada;</li>\n<li>está em <code>periodStart &lt;= observedAt &lt;= periodEnd</code>;</li>\n<li>possui preço decimal, finito, maior que zero e em BRL;</li>\n<li>possui quantidade e unidade suficientes para conversão explícita à unidade-base; e</li>\n<li>utiliza somente condições registradas, sem valores inferidos.</li>\n</ol>\n<p>Em <strong>Meu histórico</strong>, a observação também pertence à organização autorizada, possui fornecedor próprio identificável e foi destinada a uma filial cuja cidade/UF está na seleção.</p>\n<p>Em <strong>Referência de mercado Foozi</strong>, a observação também:</p>\n<ul>\n<li>pertence a outra organização;</li>\n<li>foi destinada a uma filial cuja cidade/UF está na seleção; e</li>\n<li>participa apenas do agregado sem identificação da origem, sem retornar fornecedor, organização, cotação ou item externo.</li>\n</ul>\n<p>A própria cotação respondida comprova que o fornecedor atendeu a cidade/UF da filial destinatária naquele momento. A elegibilidade histórica não depende do endereço do fornecedor nem de sua cobertura atual. O snapshot preserva a cidade/UF original da cotação contra alterações futuras de endereço; ele não adiciona localidades históricas à multisseleção, cujas opções continuam derivadas das filiais atualmente autorizadas.</p>\n<p>O cruzamento entre organizações requer chave explícita de produto comparável. Sem essa chave ou unidade comparável, a Referência de mercado Foozi fica indisponível. O MVP não cria normalização universal de produtos ou embalagens.</p>\n<p>Instantes são processados em UTC e apresentados no fuso da organização. Exclusões são contabilizadas por motivo e perspectiva.</p>"}, {"id": "4-3-comparabilidade-e-normalizacao", "level": 3, "title": "4.3. Comparabilidade e normalização", "words": 127, "screens": ["reqauto"], "html": "<p>Cada observação resulta em preço por unidade-base, como <code>R$/kg</code>, <code>R$/l</code> ou <code>R$/un</code>.</p>\n<ol>\n<li>Unidade e quantidade são convertidas somente com fator explícito e testado.</li>\n<li>Embalagem sem conteúdo suficiente impede a conversão.</li>\n<li>Marcas e embalagens diferentes podem permanecer quando produto e unidade-base forem comparáveis; essas condições ficam disponíveis para interpretação, mas não alteram o cálculo por preço.</li>\n<li>Produtos sem equivalência explícita não são cruzados entre organizações.</li>\n<li>Valores usam decimal e são arredondados apenas na apresentação.</li>\n<li>Dados próprios mantêm rastreabilidade de valor original, conversão e valor normalizado.</li>\n<li>A rastreabilidade bruta do mercado fica restrita a operadores autorizados; a organização recebe somente o agregado.</li>\n</ol>\n<p>O preço usa apenas componentes registrados. Desconto, imposto, frete ou prazo não podem ser presumidos.</p>"}, {"id": "4-4-cobertura-e-disponibilidade", "level": 3, "title": "4.4. Cobertura e disponibilidade", "words": 292, "screens": ["fornecedores"], "html": "<p>Não há corte mínimo de observações, fornecedores ou organizações. Uma única observação de mercado elegível deve ser exibida com contagem <code>1</code> e limitação clara. A UI mostra localidades selecionadas, quantidade de observações, datas distintas, recência, período, unidade, exclusões e aviso de base pequena. No histórico, mostra também a quantidade de fornecedores. No mercado, não expõe contagens de fornecedores ou organizações de origem; a quantidade de observações é sempre exibida. Não há índice subjetivo de confiança.</p>\n<p><strong>Trade-off aprovado do MVP:</strong> com uma observação de mercado, média, mínimo e máximo coincidem e revelam o preço observado. A saída continua sem identificar a organização, o fornecedor externo, a cotação ou o item de origem. Essa limitação deve ser informada; ela não impede a exibição da referência e não cria amostra mínima.</p>\n<table>\n<thead>\n<tr>\n<th>Histórico próprio</th>\n<th>Referência de mercado Foozi</th>\n<th>Resultado</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Dois ou mais fornecedores</td>\n<td>Com dados</td>\n<td>Ranking próprio + comparação de cada fornecedor com o mercado + insights.</td>\n</tr>\n<tr>\n<td>Dois ou mais fornecedores</td>\n<td>Sem dados</td>\n<td>Ranking próprio; mercado com dados insuficientes e motivo.</td>\n</tr>\n<tr>\n<td>Um fornecedor</td>\n<td>Com dados</td>\n<td>Histórico + comparação com o mercado, sem ranking.</td>\n</tr>\n<tr>\n<td>Um fornecedor</td>\n<td>Sem dados</td>\n<td>Histórico sem ranking; mercado com dados insuficientes.</td>\n</tr>\n<tr>\n<td>Sem histórico</td>\n<td>Com dados</td>\n<td>Somente Referência de mercado Foozi e seu insight.</td>\n</tr>\n<tr>\n<td>Sem histórico</td>\n<td>Sem dados</td>\n<td>Dados insuficientes, com explicação separada por perspectiva.</td>\n</tr>\n</tbody>\n</table>\n<p>Exemplos de explicação:</p>\n<ul>\n<li>“Não encontramos cotações respondidas deste produto para sua organização no período.”</li>\n<li>“Há apenas um fornecedor no seu histórico; são necessários dois para formar um ranking entre fornecedores conhecidos.”</li>\n<li>“Não encontramos preços comparáveis em BRL para as localidades selecionadas no período.”</li>\n<li>“Sua organização não possui filiais autorizadas com localidade disponível para esta consulta.”</li>\n<li>“Existem preços, mas faltam unidade ou conteúdo da embalagem para convertê-los à mesma base.”</li>\n<li>“O produto ainda não possui equivalência cadastrada para comparação de mercado.”</li>\n</ul>"}, {"id": "4-5-calculos-deterministicos", "level": 3, "title": "4.5. Cálculos determinísticos", "words": 329, "screens": ["produtos"], "html": "<p>Para cada fornecedor próprio, com preços normalizados <code>p1...pn</code>:</p>\n<ul>\n<li><code>média = soma(p) / n</code>;</li>\n<li><code>mínimo = min(p)</code>;</li>\n<li><code>máximo = max(p)</code>;</li>\n<li><code>quantidade de observações = n</code>; e</li>\n<li>com pelo menos dois fornecedores, <code>diferença para a menor média (%) = ((média - menor média própria) / menor média própria) * 100</code>.</li>\n</ul>\n<p>O ranking próprio existe somente com dois ou mais fornecedores e ordena por média crescente. Empates no valor decimal calculado recebem a mesma posição; um identificador estável pode apenas ordenar a exibição.</p>\n<p>Para todas as observações próprias elegíveis nas localidades selecionadas <code>h1...hn</code>, sem separar por cidade:</p>\n<ul>\n<li><code>média geral do histórico próprio = soma(h) / n</code>.</li>\n</ul>\n<p>Para todas as observações de mercado elegíveis nas localidades selecionadas <code>m1...mn</code>, cada observação com o mesmo peso e sem separar por cidade:</p>\n<ul>\n<li><code>média da Referência de mercado Foozi = soma(m) / n</code>;</li>\n<li><code>mínimo de mercado = min(m)</code>;</li>\n<li><code>máximo de mercado = max(m)</code>; e</li>\n<li><code>quantidade de mercado = n</code>.</li>\n</ul>\n<p>Não há média separada por localidade nem ponderação por organização ou fornecedor. A métrica representa os preços comparáveis disponíveis na base Foozi para as cidades/UF e o período selecionados, não todo o mercado.</p>\n<p>Com as duas perspectivas, cada média por fornecedor recebe <code>diferença para a média da Referência de mercado Foozi (%) = ((média do fornecedor - média_foozi) / média_foozi) * 100</code>. Valor negativo indica preço abaixo da referência; positivo, acima.</p>\n<p>Quando a média da Referência de mercado Foozi for menor que a média geral própria:</p>\n<ul>\n<li><code>oportunidade de economia (%) = ((média geral própria - média_foozi) / média geral própria) * 100</code>.</li>\n</ul>\n<p>A UI apresenta esse valor como <strong>oportunidade estimada de economia sobre o preço unitário observado</strong>, não como economia realizada ou garantia. Sem média própria, não calcula a oportunidade. Quando a média da Referência de mercado Foozi for igual ou maior, informa: “Não identificamos oportunidade de economia pela Referência de mercado Foozi nesta consulta.”</p>\n<p>O mínimo de mercado é estatística agregada, não um fornecedor ou oferta acessível. A economia se concretiza somente se o comprador encontrar condição mais vantajosa e efetivar a compra; o resultado realizado depende da decisão, quantidade e condições finais.</p>"}, {"id": "4-6-insight-por-llm", "level": 3, "title": "4.6. Insight por LLM", "words": 363, "screens": ["listacompra"], "html": "<p>O LLM recebe uma chamada com payload fechado contendo:</p>\n<ul>\n<li>produto, período, localidades selecionadas e unidade;</li>\n<li>métricas e posições determinísticas do histórico próprio;</li>\n<li>cada observação própria elegível, com referência interna de evidência, preço original e normalizado, data, marca, quantidade solicitada, unidade, embalagem e condições comerciais disponíveis;</li>\n<li>métricas agregadas e sem identificação da origem da Referência de mercado Foozi;</li>\n<li>oportunidade estimada de economia ou motivo determinístico para sua ausência; e</li>\n<li>cobertura, exclusões e limitações permitidas.</li>\n</ul>\n<p>As observações próprias podem ser enviadas em detalhe ao LLM porque pertencem à organização solicitante. A proibição de observações brutas aplica-se aos dados externos do mercado: o payload não contém nome ou ID de fornecedor externo, organização de origem, cotação, item ou referência reversível de terceiro.</p>\n<p>Estrutura conceitual da entrada própria:</p>\n<pre><code class=\"language-text\">ownSuppliers[]\n  supplierId / supplierName / rank?\n  averagePrice / minPrice / maxPrice / observationCount\n  observations[]\n    observationId ou evidenceRef interno\n    originalPrice / normalizedPrice / observedAt\n    brand / requestedQuantity / unit / packaging\n    commercialTerms disponíveis\n</code></pre>\n<p>Schema conceitual simples da resposta:</p>\n<pre><code class=\"language-text\">supplierInsights[]\n  supplierId\n  text\nmarketInsight?\noverallSummary\nlimitations[]\n</code></pre>\n<p>Deve existir exatamente um <code>supplierInsight</code> para cada fornecedor próprio exibido, inclusive quando houver um único fornecedor e nenhum ranking. <code>marketInsight</code> interpreta somente o agregado de mercado. <code>overallSummary</code> produz o panorama geral e pode explicar oportunidade de economia já calculada. <code>limitations</code> explicita base pequena, condição ausente ou análise inviável.</p>\n<p>O LLM deve ir além de repetir números: deve destacar quando menor preço coincide com marca diferente, maior volume, embalagem, data, prazo, frete, desconto ou outra condição registrada. Deve dizer “coincide com”, “pode estar associado a” ou “vale verificar”, nunca afirmar que a condição causou o preço.</p>\n<p>O LLM não recalcula valores, inventa condições, recomenda compra, garante economia ou chama fornecedor de “melhor”. Pode destacar <strong>oportunidade de economia</strong>, <strong>potencial de redução de custo</strong> e preço <strong>abaixo do histórico</strong> ou <strong>abaixo da referência</strong>, sempre com números determinísticos. Com ranking, pode dizer <strong>primeiro no ranking por preço médio histórico</strong>. Com um fornecedor próprio, diz <strong>histórico do fornecedor</strong>, nunca ranking.</p>\n<p>Validações mínimas e específicas:</p>\n<ol>\n<li>resposta conforme o schema;</li>\n<li><code>supplierId</code> restrito a fornecedores próprios do payload;</li>\n<li>números e condições mencionados presentes no payload;</li>\n<li>ausência de identidade externa, causalidade, recomend
