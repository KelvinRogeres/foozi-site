<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Foozi — Documentação de produto</title>
<style>
:root{color-scheme:light;
--t:#1d1d1f;--t2:#6e6e73;--t3:#86868b;--ln:rgba(0,0,0,.09);--bg:#fff;--s1:#fbfbfd;--s2:#f5f5f7;
--br:#4F4FEA;--br2:#3a3ad6;--brs:#eeeefe;
--f:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",Helvetica,Arial,sans-serif;
--m:ui-monospace,"SF Mono",SFMono-Regular,Menlo,monospace}
*{box-sizing:border-box;-webkit-font-smoothing:antialiased}
html,body{margin:0;height:100%}
body{font:17px/1.52 var(--f);color:var(--t);background:var(--bg);letter-spacing:-.011em}
.app{display:flex;height:100vh;overflow:hidden}
/* ---------- sidebar ---------- */
aside{width:278px;flex:none;background:var(--s1);border-right:1px solid var(--ln);display:flex;flex-direction:column}
.bd{padding:26px 26px 18px}
.bd h1{font-size:19px;font-weight:600;letter-spacing:-.021em;margin:0 0 3px}
.bd p{font-size:12.5px;color:var(--t3);margin:0;letter-spacing:0}
.tabs{display:flex;gap:2px;padding:0 18px 14px}
.tab{flex:1;padding:6px 0;border:0;background:none;font:600 12.5px var(--f);color:var(--t2);border-radius:8px;cursor:pointer;letter-spacing:-.005em}
.tab:hover{background:rgba(0,0,0,.045);color:var(--t)}
.tab.on{background:var(--t);color:#fff}
.sbox{padding:0 18px 14px}
.sbox input{width:100%;padding:8px 12px;border:1px solid var(--ln);border-radius:10px;font:15px var(--f);background:#fff;color:var(--t)}
.sbox input::placeholder{color:var(--t3)}
.sbox input:focus{outline:none;border-color:var(--br);box-shadow:0 0 0 3.5px var(--brs)}
nav{flex:1;overflow-y:auto;padding:0 12px 40px}
.grp{font:600 11px var(--f);letter-spacing:.06em;text-transform:uppercase;color:var(--t3);padding:18px 12px 6px}
.it{display:block;width:100%;text-align:left;border:0;background:none;padding:7px 12px;border-radius:9px;font:15px var(--f);color:var(--t);cursor:pointer;letter-spacing:-.01em}
.it:hover{background:rgba(0,0,0,.05)}
.it.on{background:var(--br);color:#fff;font-weight:500}
.it small{display:block;font-size:12px;color:var(--t3);margin-top:1px}
.it.on small{color:rgba(255,255,255,.75)}
.it[hidden],.grp[hidden]{display:none}
/* ---------- main ---------- */
main{flex:1;overflow-y:auto;scroll-behavior:smooth}
.wrap{max-width:760px;margin:0 auto;padding:72px 40px 140px}
.eyebrow{font:600 13px var(--f);color:var(--br);letter-spacing:.02em;margin:0 0 10px}
h2.hero{font-size:44px;line-height:1.08;font-weight:600;letter-spacing:-.025em;margin:0 0 16px}
.lede{font-size:20px;line-height:1.45;color:var(--t2);letter-spacing:-.014em;margin:0 0 42px}
.meta{display:flex;gap:18px;flex-wrap:wrap;font-size:13px;color:var(--t3);margin:-28px 0 44px}
/* conteudo markdown */
.md{font-size:17px}
.md h1{font-size:30px;font-weight:600;letter-spacing:-.021em;margin:0 0 14px}
.md h2{font-size:25px;font-weight:600;letter-spacing:-.019em;margin:46px 0 14px}
.md h3{font-size:19px;font-weight:600;letter-spacing:-.014em;margin:30px 0 10px}
.md h4{font-size:16px;font-weight:600;margin:22px 0 8px;color:var(--t2)}
.md p{margin:0 0 17px}
.md ul,.md ol{margin:0 0 17px;padding-left:24px}
.md li{margin:7px 0}
.md a{color:var(--br);text-decoration:none}.md a:hover{text-decoration:underline}
.md code{font:14px var(--m);background:var(--s2);padding:2px 6px;border-radius:6px}
.md pre{background:#1d1d1f;color:#f5f5f7;padding:18px 20px;border-radius:14px;overflow-x:auto;font-size:13.5px;line-height:1.55}
.md pre code{background:none;padding:0;color:inherit;font-size:inherit}
.md table{border-collapse:collapse;width:100%;margin:0 0 22px;font-size:15px}
.md th{text-align:left;font:600 12px var(--f);letter-spacing:.05em;text-transform:uppercase;color:var(--t3);padding:10px 12px;border-bottom:1px solid var(--ln)}
.md td{padding:11px 12px;border-bottom:1px solid var(--ln);vertical-align:top}
.md blockquote{margin:0 0 20px;padding:14px 20px;background:var(--s2);border-radius:12px;color:var(--t2);font-size:16px}
.md blockquote p:last-child{margin:0}
.md hr{border:0;border-top:1px solid var(--ln);margin:38px 0}
.sec{scroll-margin-top:24px;padding:34px 0 0;border-top:1px solid var(--ln);margin-top:34px}
.sec:first-of-type{border-top:0;margin-top:0;padding-top:0}
.sec>.sh{font-size:12px;color:var(--t3);margin:0 0 10px;font-weight:500;letter-spacing:.02em}
/* cartoes */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(228px,1fr));gap:14px;margin:0 0 44px}
.card{display:block;text-align:left;text-decoration:none;width:100%;padding:20px;border:0;border-radius:18px;background:var(--s2);cursor:pointer;font:inherit;color:inherit;transition:transform .18s cubic-bezier(.4,0,.2,1),box-shadow .18s}
.card:hover{transform:translateY(-2px);box-shadow:0 8px 26px rgba(0,0,0,.09)}
.card b{display:block;font-size:16px;font-weight:600;letter-spacing:-.014em;margin-bottom:5px}
.card span{font-size:13.5px;color:var(--t2);line-height:1.42;letter-spacing:-.005em}
.card .n{display:block;margin-top:11px;font-size:12px;color:var(--t3)}
/* chips */
.chips{display:flex;gap:7px;flex-wrap:wrap;margin:0 0 10px}
.chip{border:0;background:var(--s2);color:var(--t);padding:5px 12px;border-radius:980px;font:500 13px var(--f);cursor:pointer;letter-spacing:-.005em}
.chip:hover{background:#e8e8ed}
.chip.b{background:var(--brs);color:var(--br2)}
.chip.b:hover{background:#e3e3fd}
/* bloco relacionado */
.rel{margin:56px 0 0;padding:26px;background:var(--s1);border-radius:20px}
.rel h4{margin:0 0 4px;font-size:16px;font-weight:600;letter-spacing:-.014em}
.rel p.d{margin:0 0 16px;font-size:13.5px;color:var(--t3)}
.rel+.rel{margin-top:16px}
.ref{display:block;width:100%;text-align:left;border:0;background:none;padding:11px 0;border-top:1px solid var(--ln);cursor:pointer;font:inherit}
.ref:first-of-type{border-top:0}
.ref b{display:block;font-size:15px;font-weight:500;letter-spacing:-.01em}
.ref small{display:block;font-size:12.5px;color:var(--t3);margin-top:2px}
.ref q{display:block;font-size:13.5px;color:var(--t2);margin-top:6px;line-height:1.45;quotes:none}
.ref:hover b{color:var(--br)}
/* botao */
.btn{display:inline-flex;align-items:center;gap:7px;background:var(--br);color:#fff;border:0;padding:10px 20px;border-radius:980px;font:500 15px var(--f);cursor:pointer;text-decoration:none;letter-spacing:-.01em}
.btn:hover{background:var(--br2)}
.btn.sec2{background:var(--s2);color:var(--t)}
.btn.sec2:hover{background:#e8e8ed}
.row{display:flex;gap:10px;flex-wrap:wrap;margin:26px 0 0}
/* resposta */
.ans{border-radius:20px;background:var(--s1);padding:28px;margin:0 0 36px}
.ans h4{margin:0 0 14px;font-size:17px;font-weight:600;letter-spacing:-.016em}
.ans .lbl{font:600 11px var(--f);letter-spacing:.06em;text-transform:uppercase;color:var(--t3);margin:20px 0 7px}
.ans .lbl:first-of-type{margin-top:0}
.warn{background:#fff8e6;border-radius:14px;padding:14px 18px;font-size:14.5px;color:#8a6d00;margin:0 0 24px}
.empty{color:var(--t3);font-size:15px}
@media(max-width:900px){.app{flex-direction:column}aside{width:100%;max-height:44vh;border-right:0;border-bottom:1px solid var(--ln)}.wrap{padding:40px 22px 100px}h2.hero{font-size:34px}.lede{font-size:18px}}
</style></head><body>

<script>window.__KB__={"docs": [{"id": "produto", "path": "00-produto/produto.md", "title": "Visão do produto", "group": "00 · Produto", "words": 932, "sections": [{"id": "_intro", "level": 1, "title": "Visão do produto", "words": 14, "screens": ["produtos"], "html": "<p>Histórico e Referência de mercado Foozi em uma visão clara para apoiar melhores compras.</p>"}, {"id": "em-uma-frase", "level": 2, "title": "Em uma frase", "words": 33, "screens": [], "html": "<p>O Comparativo de Preços mostra como os preços dos fornecedores da organização se posicionam diante da Referência de mercado Foozi e destaca oportunidades de redução de custo, mantendo a decisão com o comprador.</p>"}, {"id": "o-problema-que-resolvemos", "level": 2, "title": "O problema que resolvemos", "words": 49, "screens": [], "html": "<p>Comparar preços exige buscar cotações, conferir unidades, embalagens e condições. A feature reúne esse trabalho e posiciona os valores nas localidades da organização.</p>\n<p>O Comparativo foi criado para identificar oportunidades de economia, sem garantir percentual fixo por consulta. A economia acontece quando uma condição mais vantajosa resulta em compra.</p>"}, {"id": "como-funciona", "level": 2, "title": "Como funciona", "words": 235, "screens": [], "html": "<p>O comprador seleciona um produto, um período de 30, 60, 90 ou 180 dias e uma ou mais localidades no formato cidade/UF.</p>\n<p>As opções vêm das filiais que ele pode acessar. Filiais em Vitória/ES, Rio de Janeiro/RJ e São Paulo/SP geram essas três opções, sem duplicatas. Todas começam selecionadas; o comprador pode alterar a combinação, mantendo ao menos uma.</p>\n<p>A consulta usa somente cotações destinadas às filiais localizadas nas cidades/UF selecionadas e apresenta duas perspectivas:</p>\n<ul>\n<li><strong>Meu histórico:</strong> fornecedores com os quais a organização já cotou, identificados pelo nome.</li>\n<li><strong>Referência de mercado Foozi:</strong> preços comparáveis observados em cotações de outras organizações para filiais nas mesmas localidades, agregados e sem identificar sua origem.</li>\n</ul>\n<p>A Referência de mercado Foozi representa os preços comparáveis disponíveis na base da Foozi para as localidades e o período, não todo o mercado. Várias localidades são reunidas em uma única análise, sem médias separadas por cidade.</p>\n<p>As duas perspectivas aparecem juntas quando disponíveis. A referência de mercado aparece com ao menos uma observação válida, ainda que o comprador tenha vários, um ou nenhum fornecedor próprio. Não há amostra mínima.</p>\n<p>Participam apenas preços maiores que zero, em reais, dentro do período e que possam ser colocados na mesma unidade, como reais por quilo, litro ou unidade. Quando isso não for possível, a tela explica o que falta, como preço válido, unidade, conteúdo da embalagem ou correspondência segura entre produtos.</p>"}, {"id": "o-que-o-comprador-vera", "level": 2, "title": "O que o comprador verá", "words": 143, "screens": [], "html": "<table>\n<thead>\n<tr>\n<th>Situação</th>\n<th>Apresentação</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Dois ou mais fornecedores no histórico</td>\n<td>Ranking por preço médio histórico e comparação de cada fornecedor com a Referência de mercado Foozi.</td>\n</tr>\n<tr>\n<td>Um fornecedor no histórico</td>\n<td>Histórico e comparação com o mercado, sem chamar o resultado de ranking.</td>\n</tr>\n<tr>\n<td>Nenhum histórico, mas referência disponível</td>\n<td>Somente a Referência de mercado Foozi.</td>\n</tr>\n<tr>\n<td>Uma perspectiva indisponível</td>\n<td>A outra continua visível; a indisponível mostra <strong>dados insuficientes</strong> e explica exatamente o que falta.</td>\n</tr>\n</tbody>\n</table>\n<p>Cada perspectiva lista localidades, média, menor e maior preço, quantidade de observações e recência. Diferenças e ranking aparecem quando aplicáveis. A IA não calcula nem modifica esses números.</p>\n<p>Uma observação continua válida, com limitação destacada. No mercado, média, mínimo e máximo então coincidem; o preço fica visível, mas sua origem permanece omitida.</p>\n<p>O ranking considera somente o preço médio comparável. Ele não afirma que um fornecedor é a melhor escolha em todos os aspectos.</p>"}, {"id": "oportunidade-de-economia", "level": 2, "title": "Oportunidade de economia", "words": 93, "screens": [], "html": "<p>A média geral própria reúne todos os preços elegíveis das localidades. Se a média da Referência de mercado Foozi for menor, a diferença percentual aparece como <strong>oportunidade estimada de economia sobre o preço unitário observado</strong>.</p>\n<p>Se não houver média própria, a oportunidade não é calculada. Se a média da Referência de mercado Foozi for igual ou maior, a tela informa que não foi identificada oportunidade pela referência naquela consulta.</p>\n<p>Não é economia realizada nem garantia: o resultado depende da decisão, quantidade e condições finais. A estimativa mostra onde pode existir redução de custo.</p>"}, {"id": "como-a-ia-agrega-valor", "level": 2, "title": "Como a IA agrega valor", "words": 92, "screens": [], "html": "<p>Para cada fornecedor próprio exibido, a IA analisa cada observação de preço e as condições registradas: marca, quantidade solicitada, unidade, embalagem, data e condições comerciais disponíveis.</p>\n<p>Há um insight por fornecedor e um panorama geral. A IA pode relacionar preço menor a outra marca, maior volume ou embalagem diferente como associação a verificar, nunca causa comprovada.</p>\n<p>A IA pode explicar oportunidades já calculadas, mas não altera métricas ou posições, não escolhe fornecedor e não recomenda compra. Se estiver indisponível ou produzir resposta inválida, os números continuam na tela com uma explicação objetiva.</p>"}, {"id": "confianca-e-privacidade", "level": 2, "title": "Confiança e privacidade", "words": 140, "screens": [], "html": "<p>A cidade/UF da filial destinatária fica registrada na cotação e não é reescrita por mudanças posteriores de endereço. As opções selecionáveis continuam limitadas às localidades das filiais atualmente autorizadas.</p>\n<p>O comprador identifica seus fornecedores, mas a Referência de mercado Foozi não expõe organização, fornecedor externo, cotação ou item de origem. Ela apresenta valores agregados e quantidade de observações.</p>\n<p>Com uma observação de mercado, média, mínimo e máximo coincidem e revelam o preço, embora sua origem permaneça omitida. Esse trade-off aprovado prioriza mostrar a referência disponível com uma limitação clara, sem impor amostra mínima. A autorização comercial para esse uso já foi validada.</p>\n<p>A experiência pode falar em <strong>oportunidade de economia</strong>, <strong>potencial de redução de custo</strong>, <strong>preço abaixo do histórico</strong>, <strong>preço abaixo da referência</strong> e <strong>diferença de preços</strong>. Não deve falar em “melhor fornecedor”, recomendação automática ou economia garantida.</p>"}, {"id": "o-que-este-mvp-nao-faz", "level": 2, "title": "O que este MVP não faz", "words": 33, "screens": [], "html": "<p>O Comparativo não compra, aprova cotações ou negocia automaticamente. O ranking não considera qualidade, confiabilidade, disponibilidade ou prazo de entrega. A decisão final e a concretização de qualquer economia permanecem com o comprador.</p>"}, {"id": "criterios-para-aprovacao", "level": 2, "title": "Critérios para aprovação", "words": 75, "screens": [], "html": "<p>Consideraremos o produto aprovado quando:</p>\n<ul>\n<li>compradores compreenderem a seleção de localidades e as duas perspectivas;</li>\n<li>os números e a oportunidade estimada forem corretos e consistentes;</li>\n<li>a experiência ajudar a identificar uma condição potencialmente mais vantajosa;</li>\n<li>bases pequenas mostrarem quantidade, recência e limitações sem ocultar dados válidos;</li>\n<li>resultados indisponíveis explicarem exatamente o dado faltante;</li>\n<li>nenhuma informação de origem externa for exposta; e</li>\n<li>uma falha da IA não impedir o acesso aos números e às diferenças objetivas.</li>\n</ul>"}, {"id": "referencia-visual", "level": 2, "title": "Referência visual", "words": 25, "screens": [], "html": "<p><a href=\"assets/price-comparison-full-preview.pdf\">Ver o comparativo com dados completos</a></p>\n<p>Este PDF representa o mock com dados completos usado para aprovação da experiência.</p>"}]}, {"id": "documentacao-funcional", "path": "00-produto/documentacao-funcional.md", "title": "Documentação Funcional", "group": "00 · Produto", "words": 5245, "sections": [{"id": "_intro", "level": 1, "title": "Documentação Funcional", "words": 630, "screens": ["api", "configuracoes", "conta", "cotacao", "estoque", "fornecedores", "historico", "listacompra", "nova", "ordem", "produtos", "reqauto", "requisicoes", "suporte"], "html": "<blockquote>\n<p>Convertido de <code>Documentação Funcional - Sistema Foozi.pdf</code>. O PDF original está em <code>_fontes/</code> (fora do git).</p>\n</blockquote>\n<p>Versão 1.0 — Elaborado a partir de inspeção direta do ambiente app.foozi.com.br\n(organização “Foozi”, filial “Principal”). Itens não confirmados por observação estão\nmarcados como [Necessita validação].</p>\n<p>1.Visão geral, objetivos e públicos\nFoozi é uma plataforma web SaaS de gestão de compras para restaurantes (“Simplificamos\na gestão de compras do seu restaurante”). O núcleo funcional é o ciclo de cotação: o\nrestaurante cria uma requisição de compra, envia a fornecedores, compara as respostas em\num “mapa de cotação” e gera uma ordem de compra, com foco explícito em economia (o\nDashboard destaca “Economia gerada” e “% de economia”). Ao redor desse núcleo existem\nmódulos de cadastro (fornecedores e produtos), listas de compra reutilizáveis, requisições\nautomáticas agendadas, controle de estoque com apuração de CMV (Custo da Mercadoria\nVendida) e uma camada de integração (chaves de API, webhooks e integrações com\nERPs).</p>\n<p>Objetivos inferidos da estrutura: reduzir o custo de compras por meio da comparação de\nfornecedores; centralizar o cadastro de fornecedores e produtos; padronizar recompras via\nlistas e agendamentos; controlar estoque e apurar o CMV; permitir operação multifilial e\nmultiusuário; e integrar com sistemas externos.</p>\n<p>Públicos observáveis: gestores e compradores do restaurante (operação principal),\nadministradores da organização (configuração, membros, cobrança e filiais) e equipes\ntécnicas (API e integrações). Os fornecedores são atores externos que respondem às\ncotações, porém a interface de resposta do fornecedor não foi acessada neste ambiente\n[Necessita validação].</p>\n<p>2.Arquitetura da informação e hierarquia\nO layout é um shell fixo: barra superior (seletor de organização, seletor de filial e sino de\nnotificações), menu lateral esquerdo com blocos colapsáveis e área de conteúdo. Alguns\nitens do menu são apenas “pais” expansíveis, sem página própria (por exemplo,\n/requisicoes retorna 404); as páginas reais ficam nos subitens.</p>\n<p>Sitemap (mapa de páginas):\n/ — Dashboard\nRequisições (menu): /requisicoes/minhas (Minhas Requisições); /requisicoes/nova (Nova\nRequisição, wizard de 4 etapas); /requisicoes/completar/{id} (Completar Requisição:\nRequisição, Cotação, Mapa de cotação, Ordem de Compra); /requisicoes/historico\n(Pedidos); /requisicoes/pedido-manual/novo (Criar Pedido Manual).\nRequisições Automáticas (menu): /requisicoes-automaticas/lista;\n/requisicoes-automaticas/criar.\nFornecedores (menu): /fornecedores/ (Lista); /fornecedores/novo (Cadastrar).\nProdutos (menu): /organizacao/produtos/ (Lista); /organizacao/produtos/novo (Cadastrar).</p>\n<p>Lista de compra (menu): /lista-de-compra; /lista-de-compra/nova.\nEstoque (menu): /estoque; /estoque/novo; /estoque/cmv; /estoque/historico;\n/estoque/movimentacoes; /estoque/contagem.\nConfigurações: /configuracoes (abas Organização, Filiais, Cobrança, Membros);\n/configuracoes/filiais/nova.\nSuporte: /suporte/manuais. Minha conta: /usuario/configuracoes (abas Perfil, Notificações).\nAPI (menu): /api/chaves-de-acesso; /api/webhooks; /api/integracoes. Sair.</p>\n<p>3.Perfis, níveis de acesso e permissões\nCargos observados no cadastro de membros e no fluxo de convite: Administrador, Gerente\ne Operador. Os membros têm o cargo alterável inline e a opção “Remover do time”. Os\nconvites definem E-mail, Cargo e Filiais. O sistema é multifilial: o acesso de um membro\npode ser restrito a filiais específicas, e os representantes de fornecedores também são\nvinculados a filiais.</p>\n<p>As permissões efetivas de cada cargo não são descritas na interface (apenas o nome dos\ncargos é visível). A matriz a seguir é uma hipótese estruturada que precisa ser validada com\no time de produto ou com o backend.</p>\n<p>Matriz de perfis e permissões (hipótese — Necessita validação): Configurações da\norganização, gerenciar filiais, cobrança e membros são provavelmente exclusivos do\nAdministrador. Fornecedores, produtos, requisições e cotações, estoque, contagem e CMV\nsão acessíveis ao Administrador; o alcance de Gerente e Operador precisa ser validado.\nAprovar pedido: responsável não identificado. API (chaves, webhooks, integrações):\nprovavelmente Administrador.</p>\n<p>Perguntas a esclarecer: quais telas e ações cada cargo pode ver e executar? Existe estado\nvisual de “sem permissão”? Quem pode aprovar pedidos? O acesso por filial oculta dados\nde outras filiais em todas as telas?</p>\n<p>4.Documentação por módulo e por tela</p>"}, {"id": "4-1-dashboard", "level": 3, "title": "4.1 Dashboard", "words": 131, "screens": ["dashboard"], "html": "<p>Objetivo: visão consolidada do desempenho de compras por período e filial.\nCaminho: / (menu Dashboard). Elementos: filtro de período, seletor de filial e menu de três\npontos com ação Exportar. Cartões de indicadores: Total de pedidos, Total em compras,\nEconomia gerada, Porcentagem de economia, Valor total previsto e Produtos, além de duas\ncalculadoras (Custo de Compra e Custo da Mercadoria Vendida) que recebem o\nfaturamento do período. Gráficos: “Economia do Período” e “Distribuição de Gastos”. Busca\n“Análise individual do produto”. Tabela “Detalhamento do período” (Produto, Unidade,\nMarca, Pedidos, Quantidade Total, Preço Médio Pago, Preço Médio Mercado, Valor total,\nEconomia Unitária e Total Economizado) com paginação. Ações: alterar período ou filial\nrecarrega indicadores; Calcular exibe percentual de custo; Exportar gera exportação\n[formato a validar]. Estados vazio, carregando e erro não observados [Necessita validação].</p>"}, {"id": "4-2-1-minhas-requisicoes-requisicoes-minhas", "level": 3, "title": "4.2.1 Minhas Requisições (/requisicoes/minhas)", "words": 72, "screens": ["requisicoes"], "html": "<p>Objetivo: acompanhar e gerenciar\ncotações. Área “Requisições em aberto” (cartões com código, data, status Em andamento,\nfilial, percentual de respostas, cronômetro, Atualizar data limite e abrir). Área “Requisições”\n(lista mantida por 30 dias) com ordenação, status, filial, busca por responsável e Download.\nCada cartão traz código, data, status (Rascunho, Ativo, Finalizando, Concluído), filial,\nquantidade de produtos, quantidade de fornecedores e ações: Continuar requisição ou\nDuplicar cotação, Ver lista de produtos e Excluir.</p>"}, {"id": "4-2-2-nova-requisicao-wizard-requisicoes-nova", "level": 3, "title": "4.2.2 Nova Requisição, wizard (/requisicoes/nova)", "words": 46, "screens": ["nova"], "html": "<p>Quatro etapas: Filial (com opção Criar\nfilial); Dados (Responsável; data e horário limite para resposta; melhor dia e turno\nManhã/Tarde/Noite e faixa de horário para recebimento); Lista de compra; Produtos. Botão\nSalvar como rascunho. O avanço exige preencher os campos obrigatórios da etapa atual.</p>"}, {"id": "4-2-3-completar-requisicao-requisicoes-completar-id", "level": 3, "title": "4.2.3 Completar Requisição (/requisicoes/completar/{id})", "words": 144, "screens": ["cotacao"], "html": "<p>Stepper de quatro estágios:\nRequisição, Cotação, Mapa de cotação e Ordem de Compra. Mapa de cotação: título com\ncódigo, entrega prevista, data, filial, percentual respondido, Visualizar Prévia, Ações do\nPedido (opção Enviar para aprovação) e Mais ações. Modo Lista: painel Fornecedores\n(pedido mínimo, prazo de pagamento, entrega); por produto exibe Quantidade Solicitada e\ntabela com número, Marcas, Fornecedor, Marca Cotada, Prazo de Pagamento, Quantidade,\nÚltima Compra, Valor unitário (editável), IBS (Período de Teste), CBS (Período de Teste) e\ncheckbox Selecionar. Modo Mapa: matriz produto por fornecedor com selo MELHOR\nPREÇO, Fornecedores indicados, zoom (60%, Redefinir, Expandir) e filtros Por produto, Por\nFornecedor e Somente fornecedores com cotação; cada célula mostra Menor preço, Preço\nmédio, Total, Pedido mínimo, Economia, Marca, IBS, CBS, Desconto, Desabilitar, Selecionar\nitem e Melhor preço. Exceção observada: “Esta requisição expirou, você não pode mais\ncompletá-la.” com ação Atualizar data limite.</p>"}, {"id": "4-2-4-historico-pedidos-requisicoes-historico", "level": 3, "title": "4.2.4 Histórico / Pedidos (/requisicoes/historico)", "words": 31, "screens": ["historico"], "html": "<p>Tabela com Código, Empresa, Filial, Data\nda cotação, Valor Total, Economia Gerada, Status, Qtd. Produtos, Qtd. Fornecedores e\nPercentual Respondido. Filtros de período, ordenação, status e filial. Ação Criar Pedido\nManual.</p>"}, {"id": "4-2-5-criar-pedido-manual-requisicoes-pedido-manual-novo", "level": 3, "title": "4.2.5 Criar Pedido Manual (/requisicoes/pedido-manual/novo)", "words": 32, "screens": ["ordem"], "html": "<p>Objetivo: registrar compra\nfeita fora da Foozi. Campos: Filial; data e horário de recebimento; tabela de produtos\n(Adicionar Produto) com Produto, Quantidade, Preço, Gramatura, Marcas, Fornecedores e\nAções. Ações: Voltar e Salvar.</p>"}, {"id": "4-3-requisicoes-automaticas", "level": 3, "title": "4.3 Requisições Automáticas", "words": 53, "screens": ["reqauto"], "html": "<p>Lista (/requisicoes-automaticas/lista): requisições em aberto e\nagendadas, ordenação e filtro por filial, atalhos Nova cotação automática e Minhas cotações\nagendadas; estado vazio “Você chegou ao fim da lista de agendamentos.” Criar\n(/requisicoes-automaticas/criar): Filiais; Dias até finalizar; Horário máximo; Dia da semana;\nLista de Compras. Ações: Cancelar e Criar agendamento.</p>"}, {"id": "4-4-fornecedores", "level": 3, "title": "4.4 Fornecedores", "words": 200, "screens": ["fornecedores"], "html": "<p>Lista (/fornecedores/): cartões com status (Ativo/Inativo), nome, CNPJ,\nDados comerciais, Dados de pagamento e entrega (Prazo de entrega, Prazo de pagamento\nincluindo À vista, Pedido mínimo) e botões Vincular representante(s) e Editar. Busca e três\nfiltros. Topo: Importar fornecedores, Cadastrar Fornecedor e Mais ações (Ações e Importar\ndo Everest). Alerta por cartão: “Não há agentes cadastrados para este fornecedor.”\nCadastrar/Editar Fornecedor (/fornecedores/novo), três seções. Dados do fornecedor:\nImagem (opcional, JPG/PNG/WEBP); Nome (obrigatório, mínimo 3 caracteres); Razão</p>\n<p>social; Categorias (multisseleção: HIG/LIMP/DESC, PESCADOS, HORTIFRUTI, BEBIDAS,\nMERCEARIA, GRÃOS E TEMPEROS, CARNES e outras); CNPJ (opcional); Organizações;\ncheckbox Fornecedor público. Pagamento: Pedido mínimo (obrigatório, maior que 0); Prazo\nde pagamento (obrigatório, ao menos 1 dia); Prazo de entrega (obrigatório, maior que 0);\nDias de entrega. Comercial: Criar representante (repetível) ou Não quero criar; campos do\nrepresentante: Nome (obrigatório), E-mail (opcional), Telefone WhatsApp com máscara (27)</p>\n<p>9 9999-9999, Gênero (Masculino, Feminino, Outro, Prefiro não informar), Status</p>\n<p>(Ativo/Inativo) e Filiais. Mensagens de erro: “O nome deve ter no mínimo 3 caracteres”; “O\nvalor mínimo deve ser maior que 0”; “Digite ao menos um dia de prazo”; “O prazo de\nentrega deve ser maior que 0”.</p>"}, {"id": "4-5-produtos", "level": 3, "title": "4.5 Produtos", "words": 85, "screens": ["produtos"], "html": "<p>Lista (/organizacao/produtos/): contador total (1.483 no ambiente); cada item\ncom imagem, nome com unidade entre colchetes (Unidade, Quilograma, Rolo, Saco), Lista\nde fornecedores (n), Lista de marcas (n), Editar produto e Deletar produto; busca,\nordenação e filtro por categoria; topo com Importar produtos, Criar Produto e Mais ações.\nCadastrar Produto (/organizacao/produtos/novo): seções Dados do produto e Vincular\nfornecedor; parte de um catálogo de Produto Global; opção Não quero criar. [Necessita\nvalidação: campos completos do produto não expostos sem selecionar produto global.]</p>"}, {"id": "4-6-lista-de-compra", "level": 3, "title": "4.6 Lista de compra", "words": 66, "screens": ["listacompra"], "html": "<p>Lista (/lista-de-compra): cartões com status (Ativa), nome, filial, Criada\nem e Editada em, Ver lista de produtos (n), Editar lista e excluir; busca, ordenação e filtro\npor status; ação Criar Lista de Compra. Criar Lista (/lista-de-compra/nova): Nome,\nDescrição, Adicionar Produto, ordenação (Padrão, Nome A a Z, Nome Z a A) e tabela\n(Produto, Quantidade, Gramatura, Marcas, Fornecedores, Observações, Ações); Salvar\nLista.</p>"}, {"id": "4-7-estoque", "level": 3, "title": "4.7 Estoque", "words": 167, "screens": ["estoque"], "html": "<p>Estoque, níveis (/estoque): cartões Valor em Estoque (mês) e Total de\nprodutos; tabela com Produto, Gramatura, Filial, Nível de Estoque (selos Excesso e\nAtenção), Estoque Mínimo, Estoque Ideal, Estoque Atual, Contagem, Necessidade de\nCompra, Valor unitário, Valor Total, Última Atualização (usuário, Sistema Foozi ou N/A) e\nAções; ação Configurar Estoque de Produto. Configurar Estoque (/estoque/novo): Filial,\nbusca de produto, filtro por categoria e tabela (Nome, Unidade de medida, Estoque Mínimo,\nEstoque Ideal, Quantidade Atual, CMV); Salvar. CMV (/estoque/cmv): por período, Estoque\nInicial, Total em compras, Estoque Final e cálculo do CMV a partir do Faturamento\n(Calcular); feed Movimentações por data e filial. Histórico de Contagens (/estoque/historico):\nlista de datas, Criar histórico e painel Selecione uma data (vazio: “Selecione uma data para\nver o histórico.”). Movimentações (/estoque/movimentacoes): lista de datas e painel de\ndetalhe. Contagem (/estoque/contagem): Tipo de contagem (ex.: Contagem regular), Filial,\nCategoria, Ordenação, lista de produtos com Unidade de Medida e campo Digite a\nquantidade; ações Salvar e Baixar PDF.</p>"}, {"id": "4-8-configuracoes-organizacao-configuracoes-quatro-abas", "level": 3, "title": "4.8 Configurações (organização) — /configuracoes, quatro abas", "words": 154, "screens": ["configuracoes"], "html": "<p>Organização: Nome,\nNome Social, CNPJ, Telefone WhatsApp e Logo (até 500 KB); bloco Opcionais (toggles):\nvinculação automática de fornecedores, sempre vincular fornecedores da Foozi, seleção\nautomática de produtos com melhor preço no mapa e receber e-mail mensal de relatório de\nperformance; ações críticas Sair da organização e Deletar organização (irreversível). Filiais:\ncartões com endereço, botão Membros, Mais opções (Editar, Copiar filial, Deletar) e Nova\nFilial. Cobrança: E-mail de cobrança (máximo 254 caracteres) e Endereço de Cobrança</p>\n<p>(CEP, Rua, Número, Complemento, Bairro, Cidade, Estado). Membros: convite (E-mail,\nCargo, Filiais, Adicionar convite, Enviar convites); abas Membros e Convites pendentes;\ncada membro com cargo editável inline e Opções com Remover do time. Nova Filial\n(/configuracoes/filiais/nova): Nome, CNPJ, Telefone, E-mail de cobrança, endereço\ncompleto, melhor dia e turno para receber mercadorias, horários de funcionamento por dia\nda semana (abertura e fechamento com toggle Aberto), Logo (opcional) e checkbox Usar\nfornecedores de Foozi.</p>"}, {"id": "4-9-minha-conta-usuario-configuracoes", "level": 3, "title": "4.9 Minha conta — /usuario/configuracoes", "words": 22, "screens": ["configuracoes", "conta"], "html": "<p>Abas Perfil (Nome público, Telefone, Avatar até\n500 KB) e Notificações [conteúdo a validar]. Bloco Atualizar senha (Senha atual, Nova\nsenha, Confirmação).</p>"}, {"id": "4-10-api-chaves-de-acesso-api-chaves-de-acesso", "level": 3, "title": "4.10 API. Chaves de Acesso (/api/chaves-de-acesso)", "words": 91, "screens": ["api"], "html": "<p>lista com status (Ativa), expiração\n(Sem expiração), Editar e Remover; Criar: Nome, Filial, Validade até e toggle Chave de\nacesso Ativa. Webhooks (/api/webhooks): lista (Nome, Status, Ações), Criar Webhook e\nComo integrar; Criar: toggle ativo, Nome, URL, E-mail de notificação e catálogo de eventos\npor entidade (ver seção 8). Integrações (/api/integracoes): lista (ex.: Integração Foozi com\ncron; Foozi e Everest; Teste Integração; Saipos), Criar integração para listagem de notas\nfiscais e planos Avançado e Premium; indisponibilidade observada: “O sistema de\nmovimentações de estoque da Saipos está temporariamente indisponível.”</p>"}, {"id": "4-11-suporte-manuais-suporte-manuais-manuais-em-word-varios-", "level": 3, "title": "4.11 Suporte / Manuais — /suporte/manuais. Manuais em Word (vários com vídeo)", "words": 1322, "screens": ["suporte"], "html": "<p>Primeiros Passos e Configurações Iniciais, Fornecedores, Produtos, Requisições,\nVinculação de Fornecedor em Massa, Lista de Compras, Requisição por Planilha e\nEstoque.</p>\n<p>5.Jornadas completas\nJornada A — Comprar via cotação (principal): Dashboard, Nova Requisição (Filial, Dados,\nLista de compra, Produtos), salvar, Minhas Requisições (Ativo), Completar Requisição\n(Requisição, Cotação, Mapa de cotação com seleção de itens e fornecedores), Ações do\nPedido: Enviar para aprovação, Ordem de Compra e conclusão em Histórico. Alternativo:\nDuplicar cotação. Exceção: requisição expirada (Atualizar data limite ou não completável).\nJornada B — Recompra automática: criar Lista de compra, Requisições Automáticas, Criar\n(filial, dias, horário, dia da semana, lista), gerando requisições recorrentes.\nJornada C — Registrar compra externa: Histórico, Criar Pedido Manual (filial, data e horário,\nprodutos), Salvar.\nJornada D — Controle de estoque: Configurar Estoque (mínimo e ideal), Contagem\nperiódica (Salvar e PDF), Estoque exibe nível e Necessidade de Compra, CMV apura custo,\nHistórico e Movimentações auditam.\nJornada E — Onboarding e administração: Configurações (Organização, Filiais, Membros,\nCobrança).\nJornada F — Integração técnica: API (Chaves de Acesso, Webhooks, Integrações).</p>\n<p>6.Regras de negócio, validações e\n      dependências\nR1 Requisições disponíveis por 30 dias. R2 Requisição expirada não pode ser completada\n(recuperação: Atualizar data limite). R3 Nome do fornecedor mínimo 3 caracteres. R4\nPedido mínimo maior que 0. R5 Prazo de pagamento ao menos 1 dia. R6 Prazo de entrega\nmaior que 0. R7 E-mail de cobrança máximo 254 caracteres. R8 Upload de imagem até 500\nKB (JPG, PNG, WEBP). R9 Melhor preço destacado no mapa serve de base para o valor.\nR10 Nível de estoque derivado de mínimo, ideal e atual (fórmula a validar). R11 Membro\npode ser restrito a filiais (escopo a validar). R12 Chave de API com validade ou Sem\nexpiração. R13 Opcionais automatizam vínculo de fornecedor e seleção do melhor preço.\nR14 Fornecedores da Foozi podem não existir por região. R15 IBS e CBS exibidos como\nPeríodo de Teste (cálculo a validar).\nDependências: requisição depende de filial, lista ou produtos e fornecedores; mapa\ndepende das respostas dos fornecedores; CMV depende de estoque inicial e final e\ncompras; requisição automática depende de lista de compra; integrações dependem do\nplano (Avançado ou Premium).</p>\n<p>7.Estados de tela e feedback\nObservados: carregado com dados; vazio (“Você chegou ao fim da lista de agendamentos.”,\n“Selecione uma data para ver o histórico.”, “Você não possui notificações pendentes no\nmomento.”, “Você chegou ao fim da lista.”); erro e validação (formulário de fornecedor);\nexceção (requisição expirada); indisponibilidade (integração Saipos); alerta em cartão (“Não\nhá agentes cadastrados para este fornecedor.”). Estados de carregando e de ausência de\npermissão não observáveis com o perfil atual [Necessita validação].</p>\n<p>8.Notificações, alertas, e-mails e comunicações\nIn-app: sino de notificações (vazio), alertas em cartões, mensagens de validação e toasts de\nsucesso [a validar]. E-mail: relatório mensal de performance (opcional) e faturas ao e-mail\nde cobrança ou ao criador da organização. Webhooks (catálogo de eventos): Organização\n(atualizar); Filial (criar, atualizar, deletar); Requisição de cotação (criar, atualizar, deletar,\ncompletar, cancelar); Cotação (criar, atualizar, deletar); Pedido (criar, atualizar, deletar);\nProduto (criar, atualizar, deletar); Estoque (criar, atualizar, deletar). Esse catálogo evidencia\no modelo de domínio do sistema.</p>\n<p>9.Integrações, entradas e saídas de dados\nEntradas: importação de fornecedores (inclui Importar do Everest); importação de produtos;\nrequisição por planilha; cadastro manual; pedido manual; integração de listagem de notas\nfiscais. Saídas: exportação do Dashboard; Download em Minhas Requisições; PDF na</p>\n<p>Contagem; webhooks; chaves de API. Integrações citadas: Everest, Saipos e Integração\nFoozi (com cron). Detalhes de payload, autenticação e endpoints não expostos [Necessita\nvalidação].</p>\n<ol start=\"10\">\n<li>\n<p>Responsividade\nDesktop: menu lateral fixo e conteúdo em múltiplas colunas. Mobile (aprox. 390 px): menu\ncolapsa em botão hambúrguer e abre como drawer sobreposto com os seletores de\norganização e filial no topo; cartões empilham em coluna única; sino de notificações\npermanece. Tablet: comportamento intermediário [breakpoints a validar]. Atenção às tabelas\nlargas (mapa de cotação e estoque) em telas pequenas.</p>\n</li>\n<li>\n<p>Acessibilidade, segurança, privacidade e\n     auditoria\nAcessibilidade: botão do sino de notificações sem nome acessível (lacuna de rótulos ARIA\nem ícones); recomenda-se auditoria de rótulos, contraste, teclado e foco. Segurança e\nprivacidade: autenticação por conta; chaves de API com validade e ativação; webhooks com\nURL e e-mail; o cadastro de representante coleta gênero (dado sensível); membro com\nrestrição por filial. Políticas de senha, 2FA, sessão e LGPD não observadas [Necessita\nvalidação]. Auditoria: rastros por data em Movimentações e Histórico de Contagens; campo\nÚltima Atualização indica autor. Log de auditoria central não identificado [Necessita\nvalidação].</p>\n</li>\n<li>\n<p>Indicadores, relatórios, dashboards e\n     exportação\nDashboard com indicadores de pedidos, compras, economia, previsão e produtos,\ncalculadoras de Custo de Compra e CMV, gráficos de economia e distribuição de gastos e\ndetalhamento por produto. Relatório mensal de performance por e-mail. CMV como relatório\nde estoque. Exportações: Dashboard (Exportar), Requisições (Download) e Contagem\n(PDF). Formatos exatos a validar.</p>\n</li>\n<li>\n<p>Inconsistências, lacunas e riscos (backlog)\nB1 Permissões por cargo não documentadas na interface — mapear a matriz real (risco\nalto). B2 IBS e CBS em Período de Teste — confirmar cálculo e vigência (risco médio-alto).\nB3 Botão de notificações sem nome acessível (risco médio). B4 Estados de carregando,\nerro e sem permissão não observados (risco médio). B5 Fluxo de resposta do fornecedor\nnão acessível — documentar canal do fornecedor (risco alto). B6 Cadastro de produto</p>\n</li>\n</ol>\n<p>depende de catálogo global; campos completos não expostos (risco médio). B7 Fórmula do\nnível de estoque e da Necessidade de Compra a confirmar (risco médio). B8 Item de menu\nOfertas Exclusivas aponta para rota 404 (risco baixo). B9 Detalhes técnicos das integrações\nnão expostos (risco médio). B10 Ações destrutivas (Deletar organização, Deletar filial,\nRemover membro, Excluir requisição) — validar confirmações e reversibilidade (risco alto).\nB11 Aba Notificações da conta não detalhada (risco baixo).</p>\n<ol start=\"14\">\n<li>\n<p>Glossário\nRequisição de cotação: pedido de preços a fornecedores. Cotação: conjunto de respostas\nde preço. Mapa de cotação: tela de comparação por produto e fornecedor. Ordem de\nCompra: etapa final que consolida a compra. Pedido: registro de compra (de cotação ou\nmanual). Pedido Manual: compra feita fora da Foozi. Lista de compra: conjunto reutilizável\nde produtos. Requisição automática: agendamento recorrente de cotações. Filial: unidade\nda organização. Representante: contato comercial do fornecedor. CMV: Custo da\nMercadoria Vendida. Contagem: inventário em uma data. Movimentações: histórico de\nentradas e saídas de estoque. Nível de estoque: classificação (Excesso, Atenção). IBS e\nCBS: novos tributos brasileiros em teste. Fornecedor público: fornecedor visível além da\norganização. Chave de acesso: credencial de API. Webhook: notificação HTTP de eventos.</p>\n</li>\n<li>\n<p>Resumo executivo\nO Foozi é uma solução de gestão de compras para restaurantes organizada em torno do\nciclo de cotação (requisição, cotação, mapa de cotação e ordem de compra),\ncomplementado por cadastros de fornecedores e produtos, listas de compra, requisições\nautomáticas, controle de estoque com CMV e uma camada de API e integrações. Módulos\nprincipais: Dashboard, Requisições, Requisições Automáticas, Fornecedores, Produtos,\n Lista de compra, Estoque, Configurações e API. Jornadas centrais: compra por cotação,\nrecompra automática, pedido manual e controle de estoque. Principais riscos: ausência de\ndocumentação de permissões por cargo, fluxo de resposta do fornecedor não acessível,\nregras fiscais de IBS/CBS em teste, ações destrutivas a validar e lacunas de acessibilidade\ne de estados de tela. Próximos passos: (1) validar a matriz de permissões por cargo; (2)\nmapear o canal e a jornada de resposta do fornecedor; (3) confirmar regras de cálculo de\nCMV, nível de estoque, economia e IBS/CBS; (4) documentar estados de carregando, erro e\nsem permissão; (5) detalhar tecnicamente as integrações; (6) corrigir lacunas de\nacessibilidade; (7) revisar confirmações das ações destrutivas.</p>\n</li>\n</ol>\n<p>Fim do documento.</p>\n<p>Seção 16 - Estoque: comportamento confirmado e</p>\n<p>feedback de stakeholders\nEsta seção foi acrescentada a partir de duas reuniões gravadas (23/06/2026 e 25/06/2026)\nentre a equipe de produto da Foozi (Danilo Ribeiro, Felipe Araujo, Franco Passos e Kelvin\nMonteiro). O conteúdo separa o que foi confirmado por inspeção da tela ao vivo do que é\nfeedback, dor relatada ou proposta de melhoria ainda não implementada. Itens de melhoria\nnão devem ser lidos como funcionalidades existentes.</p>"}, {"id": "16-1-comportamento-confirmado-por-inspecao-producao", "level": 3, "title": "16.1 Comportamento confirmado por inspeção (produção)", "words": 434, "screens": ["estoque"], "html": "<p>Tela Estoque &gt; Lista (/estoque): exibe cartões “Valor em Estoque (mês)” e “Total de\nprodutos”, busca por nome, “Limpar filtros”, “Ordenar por” (Nome A-Z) e filtro por categorias.\nA tabela tem colunas Produto, Gramatura, Filial, Nível de Estoque (tags Excesso e\nAtenção), Estoque Mínimo, Estoque Ideal, Estoque Atual, Contagem, Necessidade de\nCompra e Valor. As colunas de mínimo/ideal/atual são editáveis diretamente na linha. Botão\n“Configurar Estoque de Produto” e menu de três pontos. Menu de três pontos (Estoque &gt;\nLista) confirmado com dois grupos: Páginas (Histórico, Movimentações) e Ações (Importar\nestoque, Sincronizar Estoque (Saipos), Importar estoque do Everest, Sincronizar Estoque\n(Everest), Resetar Estoque).\nTela Estoque &gt; Contagem (/estoque/contagem): campo “Tipo de contagem” com duas\nopções confirmadas — “Contagem regular” e “Contagem em etapas”. Filtros Filial, Categoria\ne “Ordenar por” (apenas Nome A-Z e Nome Z-A na tela atual). Tabela com colunas Produto\n(numerado), Unidade de Medida e Contagem (editável). Ações: “Baixar PDF”, menu de três\npontos, “Salvar” e “Voltar”. Regra confirmada: só aparecem na contagem os produtos que\ntêm Estoque Ideal definido; sem mínimo/ideal o produto não entra na lista e o sistema não\ncalcula nível nem necessidade de compra.\nNíveis de estoque (tags): abaixo do mínimo gera tag “Crítico” (vermelha); acima do ideal\ngera “Excesso”; há ainda “Atenção”. Importante: os níveis NÃO são em tempo real —\nderivam da contagem, não das vendas. Não há alerta ativo (push/e-mail) de estoque baixo;\napenas as tags visuais.\nContagem externa (estoquista): a plataforma gera um link externo e uma senha, com\nmensagem pronta para envio por WhatsApp. O link expira em 24 horas. Serve para lojistas\nque não querem dar acesso completo ao estoquista. Confirmado que hoje NÃO há registro\nde quem fez a contagem nem de quando (apenas a senha de acesso).\nGeração de lista/requisição a partir da contagem: após a contagem, o sistema calcula\nautomaticamente a necessidade de compra por item (quanto falta para o ideal), com coluna\nà direita e caixas de seleção. Marcando os itens com necessidade aparece o botão “Criar\nlista”, que gera uma lista nomeada; essa lista fica disponível para iniciar uma nova\nrequisição (selecionável na etapa de Lista de compra do fluxo de requisição). Também\nconfirmado: valores unitários de cada insumo vêm da última compra.\nImportar estoque e Resetar Estoque: a importação usa um modelo de planilha (download)\nbaseado em código do produto e serve para redefinir mínimo/ideal/quantidade atual — não\npara cadastrar produto novo. “Resetar Estoque” zera a quantidade atual (contagem) de\ntodos os itens, exigindo unidade e motivo. Perfis com estoque grande usam a contagem\npara registrar a quantidade atual inicial.</p>"}, {"id": "16-2-dores-relatadas-e-feedback-dos-stakeholders", "level": 3, "title": "16.2 Dores relatadas e feedback dos stakeholders", "words": 491, "screens": [], "html": "<p>validação de produto)\nIdentificação do estoquista: hoje o acesso externo usa apenas senha, sem identificar quem\ncontou. Sugestão: pedir nome ou login social para registrar autoria da contagem.\nDuas listas em Configurar Estoque: produtos com mínimo/ideal definido ficam numa lista e\nos sem configuração ficam atrás de um botão. Feedback: substituir o botão por\nabas/estados (ex.: “pendentes de configuração” vs “configurados”) ou um contador de\npendências, evitando navegação extra. Necessita validação de design.\nEdição em massa de mínimo/ideal: hoje é preciso abrir os três pontos produto a produto\n(penoso para quem tem 100+ itens). Sugestão: planilha editável inline com resumo de\nrevisão e confirmação. Observação: a lista já possui campos editáveis inline; validar se\natende.\nContagem em etapas: a implementação atual adiciona uma coluna genérica (“Adicionar\ncoluna”) aplicada a todos os produtos e não fica salva, além de não permitir nomear o local.\nDor: mesmo produto em locais diferentes (ex.: tomate em duas salas; refrigerante no seco e\nna geladeira). Sugestão do designer: permitir contar por local nomeado, reordenar itens por\narrastar e salvar a organização do estoquista. Necessita validação.\nGerar lista de compra com um clique: hoje o fluxo exige filtrar, selecionar item a item e\nnomear a lista. Sugestão: botão único “Gerar lista de compra” ao finalizar a contagem, já\nincluindo todos os itens com necessidade de compra, com opção de editar (unidade,\nquantidade) antes de confirmar. Distinção importante de perfil: cliente plataforma cria a\nprópria requisição; cliente “bipou” apenas gera a lista e o comprador dedicado assume a\nrequisição.\nTerminologia de divergência: substituir “divergência/diferença” por “entrada” (positiva) e\n“saída” (negativa), pois donos de restaurante associam “diferença” a erro. Divergência\nnegativa deveria ser lida como saída normal de estoque. Ajustar também os status para não\nserem excludentes: manter “contado”/“pendente” como status e indicar entrada/saída à\nparte.\nReordenação durante a contagem (bug relatado no MVP): ao usar filtros como “pendentes”\nou “divergência primeiro”, ao digitar/clicar em um item a lista se reordena e “pula” na tela,\natrapalhando a contagem. Recomendação: não reordenar em tempo real durante a\ndigitação. Observação: esses filtros avançados existem no protótipo/MVP; a tela de\nContagem em produção hoje só oferece Nome A-Z e Z-A.\nTransferência de estoque entre filiais: não existe hoje; clientes com mais de uma filial fazem\n“gambiarra” (ajustam contagem nas duas lojas). Pedido: transferir estoque registrando saída\nna filial de origem e entrada na de destino, com relatório de transferência. Necessita\nvalidação de prioridade.\nValor inicial de estoque e consumo: cliente novo não consegue informar o valor do estoque\natual (só há valor unitário por insumo, calculado a partir de compras). Pedidos: permitir\ninserir o valor de estoque inicial e calcular consumo/saída por período (semana/mês).\nNecessita validação.\nDisparo automático do link de contagem: clientes pedem envio automático (ex.: toda\nsegunda-feira, horário e número do estoquista configuráveis) em vez de gerar o link\nmanualmente. Prioridade baixa (funcionalidade nova, não é regressão).</p>"}, {"id": "16-3-priorizacao-e-proximos-passos-segundo-as-reunioes", "level": 3, "title": "16.3 Priorização e próximos passos (segundo as reuniões)", "words": 150, "screens": [], "html": "<p>Prioridade alta: redesenhar Contagem e Configurar Estoque (o mais crítico); tornar a\ncontagem 100% responsíva para mobile e tablet (estoquista raramente usa desktop); gerar\nlista/requisição em um clique após a contagem; corrigir a terminologia entrada/saída e o bug\nde reordenação. Prioridade média/baixa: transferência entre filiais, valor de estoque inicial e\ncálculo de consumo, disparo automático do link e identificação do estoquista. Estratégia\nacordada: começar simples e funcional, validar com uma POC junto a clientes reais (um\nperfil plataforma e um perfil bipou) antes do lançamento geral, transformando dores em\ntarefas priorizadas com o time técnico.\nVisão de negócio registrada: o estoque é hoje um módulo de inventário simples e a meta é\ntorná-lo o melhor módulo de inventário do mercado, gerando valor também para o dono do\nestabelecimento (dashboard/indicadores de estoque e integrações com o sistema da loja),\nservindo inclusive como argumento comercial de conversão.</p>"}, {"id": "16-4-reconciliacao-com-o-documento-oficial-anotacoes", "level": 3, "title": "16.4 Reconciliação com o documento oficial “Anotações", "words": 789, "screens": [], "html": "<p>Feedback — Reconstrução do Módulo de Estoque” (v1.0,\n02/07/2026)\nO time de Produto consolidou o feedback num documento próprio (elaborado pela Foozi,\nárea Produto — Estoque). Os pontos abaixo já foram validados e alinhados em call. A\nclassificação (tipo e prioridade) segue esse documento e prevalece sobre as anotações\nanteriores desta seção em caso de conflito.\nItem 03 — Terminologia “Divergência” vira “Entrada”/“Saída” (Tipo: Ajuste de UX; Prioridade:\nAlta). Onde aparece: coluna “Divergências” na tela Histórico de Contagens e como tag de\nstatus durante a contagem por item. Como donos de restaurante associam\n“divergência/diferença” a erro de caixa, substituir por: divergência negativa (contagem\nmenor que o sistema) exibida como “Saída”; divergência positiva (contagem maior) exibida\ncomo “Entrada”. Vale para textos das telas, nomes de coluna e tags de status.\nItem 04 — Status “Contado” e “Divergente” não podem ser excludentes (Tipo: Bug;\nPrioridade: Alta). Hoje um produto contado, ao ficar divergente, tem o status trocado de\n“Contado” para “Divergente”, como se fossem estados alternativos. Na prática, divergente\nou não, o produto foi contado — essa informação deve ser permanente. Solução alinhada:\napós digitar a contagem, um botão “confirmar como contado” aplica a tag “Contado”, que\nnão some mais; a informação de entrada/saída aparece como tag adicional (não substituta),\ncom o valor correspondente. Item 05 — Ordenação/filtros na Contagem reordenam durante\na digitação (Tipo: Bug; Prioridade: Alta). Ao ordenar por “Divergências primeiro” ou\n“Pendentes primeiro”, o item em que o operador clica/digita some da tela e troca de posição\nem tempo real, obrigando a reprocurar o produto (pior em quantidades de 2 dígitos).\nSolução: o produto deve ficar fixo na posição enquanto está sendo editado; a reordenação\nsó ocorre após a confirmação do item. Observação: as opções\n“Pendentes/Divergências/Contados primeiro” aparecem no protótipo; a tela em produção\nhoje só oferece Nome A-Z/Z-A.\nItem 06 — Produtos sem Mínimo/Ideal configurado (Tipo: Alinhado; Prioridade: Média). Hoje\nprodutos sem “Mínimo” e “Ideal” aparecem na lista de contagem como “Não configurado”,\ncom opção “Incluir na contagem”. Decisão alinhada em call: produtos sem Mínimo/Ideal\nNÃO podem ser incluídos na contagem, pois sem essas referências o sistema não calcula</p>\n<p>divergência, status (saudável/crítico) nem sugestão de compra. Ação: remover a opção\n“Incluir na contagem” para “Não configurado” ou bloquear até que Mínimo e Ideal sejam\npreenchidos no cadastro do insumo.\nItem 07 — Lista de compras com 1 clique + edição (Tipo: Alinhado; Prioridade: Alta).\nAlinhado em call: após finalizar a contagem, um único botão gera a lista de compras com\ntodos os insumos com necessidade de reposição, sem exigir seleção manual item a item.\nSugestão complementar: permitir editar a lista gerada (alterar unidade de medida, alterar\nquantidade e adicionar observação que segue junto na cotação). Item 08 — Valor em\nEstoque (R$) (Tipo: Melhoria/Gap + Nova funcionalidade; Prioridade: Alta). O dashboard\nnão exibe quanto (em R$) o restaurante tem parado em estoque. Sugestão: indicador de\nvalor total em estoque, calculado por custo unitário x quantidade. Para clientes novos (que\nconfiguram estoque antes da 1ª compra pela Foozi), permitir informar o valor unitário de\ncada insumo na configuração inicial. Regra de transição: a partir das primeiras compras\nfeitas pela Foozi, o sistema passa a calcular o R$ em estoque pelo valor efetivamente gasto\nnas compras, substituindo o valor informado manualmente.\nItem 09 — Transferência de estoque entre filiais (Tipo: Nova funcionalidade; Prioridade:\nMédia). Para clientes com mais de uma filial, criar transferência de estoque entre unidades.\nA transferência deve gerar automaticamente, no relatório: na loja de origem, uma “Saída”\n(quantidade do insumo transferido + valor R$ correspondente); na loja de destino, uma\n“Entrada” (quantidade recebida + valor R$ correspondente).\nItem 10 — Estoque ideal sugerido por consumo (Tipo: Nova funcionalidade; Prioridade:\nMédia). Hoje o “Ideal” de cada insumo é definido manualmente. Sugestão: calcular o\nconsumo de cada insumo com base nas saídas do período para sugerir automaticamente o\nestoque ideal. Fluxo proposto: cliente seleciona um período em um calendário; sistema\ncalcula toda a saída de cada insumo naquele período; sistema sugere o estoque ideal com\nbase nesse consumo. Item 11 — Saída de insumo sem abrir contagem (Tipo: Nova\nfuncionalidade; Prioridade: Alta). Criar a opção de dar saída em um insumo sem precisar\nabrir uma contagem completa, para casos pontuais (perda, quebra, uso emergencial). Sem\nesse registro pontual, saídas do dia a dia ficam fora do controle até a próxima contagem\ncompleta, distorcendo o cálculo de divergência, de valor em estoque (item 08) e de estoque\nideal por consumo (item 10).\nItem 12 — Disparo automático do link de estoque (Tipo: Nova funcionalidade; Prioridade:\nBaixa). Criar disparo automático do link de contagem para o número de telefone do\nestoquista, com dia da semana e horário programáveis, eliminando a necessidade de o\ngestor enviar o link manualmente toda vez.</p>"}, {"id": "16-5-resumo-executivo-do-backlog-de-estoque", "level": 3, "title": "16.5 Resumo executivo do backlog de Estoque", "words": 135, "screens": [], "html": "<p>Prioridade)</p>\n<p>Item                          Tipo                           Prioridade</p>\n<p>03 - Divergência vira         Ajuste de UX                   Alta\n “Entrada”/“Saída” na\n linguagem do cliente</p>\n<p>04 - Status “Contado” e       Bug                            Alta</p>\n<p>“Divergente” não podem ser</p>\n<p>excludentes</p>\n<p>05 - Ordenação                 Bug                   Alta</p>\n<p>“Divergências/Pendentes\nprimeiro” reordena a lista\ndurante a digitação</p>\n<p>06 - Produtos sem              Alinhado              Média</p>\n<p>Mínimo/Ideal configurado\nnão entram na contagem</p>\n<p>07 - Botão único para gerar    Alinhado              Alta</p>\n<p>lista de compras sem\nseleção item a item</p>\n<p>08 - Dashboard não mostra      Melhoria              Alta</p>\n<p>valor (R$) do estoque; falta\nsetup inicial de custo</p>\n<p>09 - Transferência de          Nova funcionalidade   Média</p>\n<p>estoque entre filiais do\nmesmo cliente</p>\n<p>10 - Estoque ideal sugerido    Nova funcionalidade   Média</p>\n<p>com base no consumo\nhistórico</p>\n<p>11 - Dar saída em um           Nova funcionalidade   Alta</p>\n<p>insumo sem precisar abrir\numa contagem</p>\n<p>12 - Disparo automático do     Nova funcionalidade   Baixa</p>\n<p>link de estoque agendado\npor dia/horário</p>"}]}, {"id": "validacao-documentacao", "path": "00-produto/validacao-documentacao.md", "title": "Validação da Funcional", "group": "00 · Produto", "words": 1736, "sections": [{"id": "_intro", "level": 1, "title": "Validação da Funcional", "words": 23, "screens": [], "html": "<blockquote>\n<p>Convertido de <code>validacao-documentacao-funcional-foozi.pdf</code>. O PDF original está em <code>_fontes/</code> (fora do git).</p>\n</blockquote>\n<p>DO CUMENT AÇÃO FUNCIO NAL · V1.0</p>"}, {"id": "validacao-e-complemento", "level": 2, "title": "Validação e complemento", "words": 40, "screens": [], "html": "<p>Verificação em produção do documento de Documentação\nFuncional do Sistema Foozi, com correções factuais, achados\nnovos e pendências endereçadas.</p>\n<p>R ES P ON S ÁV EL     ÁR EA                  D A TA</p>\n<p>Franco Passos         CS · Onboarding        31 de julho de 2026</p>"}, {"id": "como-ler-este-documento", "level": 2, "title": "Como ler este documento", "words": 249, "screens": [], "html": "<p>Método, escopo e limites da validação</p>\n<pre><code>Método. Inspeção direta no ambiente de produção com usuário Administrador, comparando item a\nitem com o documento recebido. Nada aqui foi inferido: cada correção da Parte 1 foi observada na tela.\n\nEstrutura. A Parte 1 traz erros factuais que precisam de correção no texto. A Parte 2 traz achados que\nnão constam no documento. A Parte 3 lista o que não foi possível validar e a quem cabe responder.\n\nLimite declarado. A matriz de permissões por cargo e as ações destrutivas não foram validadas. O\nmotivo está detalhado nos itens 2.7, 2.8 e 3.6.\n</code></pre>\n<p>C AT EG O R I A                                                                                          I T EN S</p>\n<p>Correções factuais confirmadas em produção                                                                    8</p>\n<p>Achados novos, ausentes do documento                                                                          9</p>\n<p>Pendências com destinatário definido                                                                          9</p>\n<p>Destaques para atenção imediata</p>\n<ol>\n<li>\n<p>O ite m 06 do backlog de Estoque parte de premissa incorreta e provavelmente pode ser\n    fechado: o comportamento desejado já existe em produção.</p>\n</li>\n<li>\n<p>O ite m 05 não impacta cliente algum hoje. É requisito de qualidade do que será construído, não\n    regressão.</p>\n</li>\n<li>\n<p>O B1 deixa de ser lacuna de documentação e passa a ser falha de produto: o Administrador\n    concede cargos sem saber o que está concedendo.</p>\n</li>\n<li>\n<p>A ausência de ambie nte de homologação bloqueia a validação do B10 e de qualquer fluxo de\n    risco pelo time de CS.</p>\n</li>\n<li>\n<p>Três dores registradas na seção 16.2 não che garam ao backlog of icial e precisam de decisão\n    explícita.</p>\n</li>\n</ol>"}, {"id": "parte-1-correcoes-factuais", "level": 2, "title": "Parte 1 · Correções factuais", "words": 543, "screens": [], "html": "<p>Divergências entre o documento e o comportamento observado em produção</p>\n<p>1.1 B8 está mal descrito          CO R R I G I R</p>\n<p>O documento afirma que “Ofertas Exclusivas” aponta para rota 404. O item existe no menu lateral,\naparece esmaecido e não é clicável. Não é rota quebrada, é item desabilitado.</p>\n<p>Ação: reescrever o B8. Ver também a pergunta 3.4.</p>\n<p>1.2 Sitemap correto, com uma omissão                         CO R R I G I R</p>\n<p>Os 12 itens do menu conferem com o mapeado na seção 2. A única ausência é “Ofertas Exclusivas”, que\nexiste na interface mas não aparece no sitemap.</p>\n<p>Ação: incluir o item, sinalizando o estado desabilitado.</p>\n<p>1.3 T ag “Crítico” ausente em duas seções                         CO R R I G I R</p>\n<p>Produção exibe três tags de nível de estoque: Crítico, Atenção e Excesso. A seção 4.7 cita apenas Excesso\ne Atenção, e o glossário da seção 14 repete a mesma falha. A seção 16.1 já traz a informação correta, mas\na correção não foi propagada para as seções anteriores.</p>\n<p>Ação: atualizar as seções 4.7 e 14.</p>\n<p>1.4 Formato de exportação do Dashboard                           CO R R I G I R</p>\n<p>A exportação sai em XLSX. As seções 4.1 e 12 marcam como “formato a validar”.</p>\n<p>Ação: substituir a marcação pelo formato confirmado.</p>\n<p>1.5 Item 06 parte de premissa incorreta                      R E VI S AR</p>\n<p>O item 06 afirma que produtos sem Mínimo e Ideal aparecem na contagem como “Não configurado”,\ncom opção “Incluir na contagem”, e propõe remover essa opção.</p>\n<p>Em produção esses produtos não aparecem na lista de contagem. O comportamento desejado já existe.</p>\n<p>Há ainda contradição interna no documento: a seção 16.1 afirma o oposto da seção 16.4 sobre esse\nmesmo ponto. Produção confirma que a 16.1 está correta.</p>\n<p>Ação sugerida: fechar ou remover o item 06. Provável descrição do protótipo, não do sistema em produção.</p>\n<p>1.6 Item 05 não é bug de produção                  R E VI S AR</p>\n<p>O bug de reordenação depende dos filtros “Pendentes primeiro” e “Divergências primeiro”. A tela de\nContagem em produção oferece apenas Nome A-Z e Nome Z-A. O bug existe somente no protótipo.</p>\n<p>O item segue válido como requisito de qualidade do que será construído, mas não há cliente impactado\nhoje. Isso não invalida a prioridade Alta, mas muda a justificativa: não é regressão nem dor ativa.</p>\n<p>Ação: ajustar a descrição do item para deixar o escopo claro.</p>\n<p>1.7 Aba Notificações não é tela de preferências                          CO R R I G I R</p>\n<p>A seção 4.9 trata a aba Notificações da conta como configuração de preferências, marcada como\n“conteúdo a validar”. Não é. É uma caixa de entrada, que lista convites de organização recebidos,\nincluindo os já expirados.</p>\n<p>Ação: reescrever a seção 4.9. Ver os achados 2.4, 2.5 e 2.6.</p>\n<p>1.8 B6: cadastro de produto confirmado                  CO R R I G I R</p>\n<p>Os campos do produto só aparecem após a seleção de um produto do catálogo global. Uma vez\nselecionado, o campo nome fica editável, permitindo ao cliente criar sua própria versão a partir do\nproduto global.</p>\n<p>Ação: substituir a pendência pelo comportamento confirmado. Ver a pergunta 3.5.</p>"}, {"id": "parte-2-achados-novos", "level": 2, "title": "Parte 2 · Achados novos", "words": 535, "screens": [], "html": "<p>Pontos observados em produção que não constam no documento</p>\n<p>2.1 Dashboard sem valor de estoque em R$                 CO N F I R M A I T E M 0 8</p>\n<p>Confirmado que o Dashboard principal não traz nenhum indicador de valor em estoque. O cartão “Valor\nem Estoque (mês)” existe apenas dentro da tela de Estoque.</p>\n<p>O texto do item 08 é ambíguo quanto a isso. Vale registrar a distinção: o dado existe no módulo, mas\nnão sobe para a visão consolidada do gestor.</p>\n<p>2.2 Dashboard sem estado vazio                N O VO</p>\n<p>Ao selecionar um período sem dados, todos os indicadores ficam zerados, sem qualquer mensagem. O\nusuário não distingue “não houve movimento no período” de “algo falhou”.</p>\n<p>Sugest ão: mensagem explícita de período sem dados. Alimenta o B4.</p>\n<p>2.3 Coluna de “Contagem em etapas” não persiste                          N O VO</p>\n<p>Confirmado em produção: ao adicionar uma coluna, sair da tela e retornar, a coluna desaparece.\nTambém não é possível nomear a coluna ou o local.</p>\n<p>Esta dor consta na seção 16.2 mas não virou item numerado no backlog oficial.</p>\n<p>Sugest ão: avaliar se a exclusão foi decisão de call ou omissão na consolidação.</p>\n<p>2.4 Convites expirados sem forma de dispensar                      N O VO</p>\n<p>A aba Notificações acumula convites já expirados, com registros observados de 22/04 e 05/06, sem\nqualquer ação de arquivar, dispensar ou ocultar. A tendência é acúmulo indefinido.</p>\n<p>2.5 T exto duplicado no card de notificação              N O VO</p>\n<p>Cada card repete a mesma informação em duas frases seguidas: o convite para a organização, quem\nconvidou e com qual cargo. Aparenta ser falha de template.</p>\n<p>2.6 Sem preferência de notificação para o usuário                     N O VO</p>\n<p>Se a aba Notificações é caixa de entrada, então não existe nenhum controle de preferências de\nnotificação na conta do usuário. O único controle citado no documento, o e-mail mensal de\nperformance, fica em Configurações da organização.</p>\n<p>Há ainda sobreposição funcional aparente entre essa aba e o sino da barra superior.</p>\n<p>2.7 B1 deixa de ser hipótese         R I S CO ALT O</p>\n<p>Confirmado que o sistema não exibe em lugar nenhum o que cada cargo permite. Em Configurações &gt;\nMembros aparece apenas o nome do cargo, sem descrição, tooltip ou link.</p>\n<p>Isso é mais grave do que “faltou documentar”: o Administrador concede e altera cargos sem saber o que\nestá concedendo.</p>\n<p>2.8 Ausência de ambiente de homologação                     B LO Q U E I O</p>\n<p>Não há conhecimento, do lado de CS, de um ambiente de teste separado da produção. Isso bloqueia a\nvalidação do B10, que não pode ser testado em base de cliente real.</p>\n<p>2.9 Dores da 16.2 fora do backlog oficial         D E CI S ÃO P E N D E N T E</p>\n<p>Três pontos relatados nas reuniões não aparecem entre os itens 03 a 12:</p>\n<p>Identificação de quem realizou a contagem, já que o acesso externo usa apenas senha, sem autoria\n  registrada\n  Redesenho das duas listas em Configurar Estoque, separando configurados de pendentes de\n  configuração\n  Contagem por local nomeado, para o mesmo insumo armazenado em locais diferentes</p>\n<p>Sugest ão: confirmar se foram descartados em call ou perdidos na consolidação.</p>"}, {"id": "parte-3-pendencias-e-destinatarios", "level": 2, "title": "Parte 3 · Pendências e destinatários", "words": 346, "screens": [], "html": "<p>O que não foi possível validar pelo time de CS e a quem cabe responder</p>\n<p>3.1 Critério da tag “Atenção”                  PRO D U T O</p>\n<p>A seção 16.1 esclarece Crítico, abaixo do mínimo, e Excesso, acima do ideal, mas não o que dispara\n“Atenção”. Não é dedutível pela interface. O R10 segue em aberto.</p>\n<p>3.2 IBS e CBS     P R O D U T O / F I S CAL</p>\n<p>Exibidos como “Período de Teste” no mapa de cotação. Cálculo, base e vigência não confirmados.\nCorresponde ao B2.</p>\n<p>3.3 Jornada de resposta do fornecedor                             PRO D U T O</p>\n<p>Maior lacuna do documento. O fornecedor é ator central do fluxo de cotação e sua jornada não está\ndocumentada em nenhum ponto. Corresponde ao B5.</p>\n<p>3.4 “Ofertas Exclusivas” desabilitado                          PRO D U T O</p>\n<p>É intencional exibir no menu um item permanentemente inativo? Se for feature futura ou trava por\nplano, cabe indicação visual do motivo.</p>\n<p>3.5 Produto fora do catálogo global                        PRO D U T O</p>\n<p>Confirmado que é possível criar a partir de um produto global, editando o nome. Não ficou claro se é\npossível cadastrar um produto do zero, sem vínculo com o catálogo global.</p>\n<p>3.6 Matriz de permissões                  B ACKE N D / P R O D U T O</p>\n<p>Deixado em aberto deliberadamente. A validação exigiria criar usuários de teste para cada cargo e\nmapear as telas acessíveis. Cabe ao time de produto ou backend informar a matriz real, que hoje não é\nobservável pela interface. Corresponde ao B1.</p>\n<p>3.7 Ambiente de homologação                         T É CN I CO</p>\n<p>Existe ambiente separado da produção? Sem ele, CS não consegue validar ações destrutivas nem fluxos\nde risco.</p>\n<p>3.8 Detalhes técnicos das integrações                             T É CN I CO</p>\n<p>Payload, autenticação e endpoints não expostos na interface. Corresponde ao B9.</p>\n<p>3.9 Ações destrutivas               N ÃO VALI D ÁVE L</p>\n<p>Deletar organização, deletar filial, remover membro e excluir requisição não foram testados por risco de\nperda irreversível em base de produção. Depende do item 3.7. Corresponde ao B10.</p>"}]}, {"id": "inventario-telas", "path": "01-modulos/inventario-telas.md", "title": "Inventário de telas", "group": "01 · Módulos", "words": 430, "sections": [{"id": "_intro", "level": 1, "title": "Inventário de telas", "words": 12, "screens": ["contagem"], "html": "<p>19 telas e 21 modais. Referência navegável em <code>referencia/foozi-prototipo.html</code>.</p>\n<hr />"}, {"id": "fluxo-principal-de-compra", "level": 2, "title": "Fluxo principal de compra", "words": 100, "screens": [], "html": "<p>O produto gira em torno de um ciclo de quatro etapas, sinalizado por um stepper persistente:</p>\n<pre><code>Requisição  →  Cotação  →  Mapa de Cotação  →  Ordem de Compra\n</code></pre>\n<table>\n<thead>\n<tr>\n<th>Tela</th>\n<th>Papel</th>\n<th>Densidade</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td><strong>Requisições</strong></td>\n<td>Hero escuro com cotações em aberto e cronômetro + grid de cards</td>\n<td>Média</td>\n</tr>\n<tr>\n<td><strong>Nova Requisição</strong></td>\n<td>Wizard de 4 etapas: Filial → Dados → Lista de compra → Produtos</td>\n<td>Alta na etapa 4</td>\n</tr>\n<tr>\n<td><strong>Lista de itens</strong></td>\n<td>Conferência final antes de disparar a cotação</td>\n<td>Alta</td>\n</tr>\n<tr>\n<td><strong>Cotação em aberto</strong></td>\n<td>Acompanhamento das respostas, com painel de Insights da IA</td>\n<td>Alta</td>\n</tr>\n<tr>\n<td><strong>Mapa de Cotação</strong></td>\n<td>Matriz produto × fornecedor. <strong>Tela onde a compra é decidida</strong></td>\n<td>Máxima</td>\n</tr>\n<tr>\n<td><strong>Ordem de Compra</strong></td>\n<td>Detalhe e aprovação</td>\n<td>Média</td>\n</tr>\n</tbody>\n</table>\n<hr />"}, {"id": "gestao-e-cadastros", "level": 2, "title": "Gestão e cadastros", "words": 78, "screens": [], "html": "<table>\n<thead>\n<tr>\n<th>Tela</th>\n<th>Conteúdo</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td><strong>Dashboard</strong></td>\n<td>KPIs do período, economia, distribuição de gastos e detalhamento</td>\n</tr>\n<tr>\n<td><strong>Histórico de requisições</strong></td>\n<td>Tabela de pedidos concluídos</td>\n</tr>\n<tr>\n<td><strong>Fornecedores</strong></td>\n<td>Cadastro com CNPJ, prazo de entrega e pedido mínimo</td>\n</tr>\n<tr>\n<td><strong>Produtos</strong></td>\n<td>Catálogo com categoria, unidade e marcas aceitas</td>\n</tr>\n<tr>\n<td><strong>Lista de compra</strong></td>\n<td>Listas prontas para requisições recorrentes</td>\n</tr>\n<tr>\n<td><strong>Estoque</strong></td>\n<td>Posição por filial, com alerta de item abaixo do mínimo</td>\n</tr>\n<tr>\n<td><strong>Contagens</strong></td>\n<td>Histórico de contagens feitas por link temporário</td>\n</tr>\n<tr>\n<td><strong>Requisições Automáticas</strong></td>\n<td>Regras que criam requisições por gatilho</td>\n</tr>\n<tr>\n<td><strong>Configurações</strong></td>\n<td>Organização, filiais, usuários e notificações</td>\n</tr>\n</tbody>\n</table>\n<hr />"}, {"id": "portal-do-fornecedor", "level": 2, "title": "Portal do fornecedor", "words": 75, "screens": ["fornecedores"], "html": "<p>Tela única, fora do sistema autenticado. <strong>Acesso por link temporário, sem cadastro, uso único.</strong></p>\n<p>Contém: cabeçalho com prazo e urgência, formulário de dados do fornecedor (CNPJ, pedido mínimo, prazos, dias de entrega) e tabela de itens para cotar com preço, quantidade ofertada, marca e tributos opcionais.</p>\n<blockquote>\n<p>É a única tela do usuário externo. Sem treinamento, sem suporte, frequentemente no celular. Fricção aqui derruba a taxa de resposta, que é o insumo de todo o produto.</p>\n</blockquote>\n<hr />"}, {"id": "contagem-de-estoque", "level": 2, "title": "Contagem de estoque", "words": 26, "screens": ["contagem"], "html": "<p>Também por link temporário, sem cadastro. Otimizada para mobile (414px): identificação do responsável, contagem item a item com botões grandes de + e −, e tela de conclusão.</p>\n<hr />"}, {"id": "modais-principais", "level": 2, "title": "Modais principais", "words": 59, "screens": [], "html": "<p><strong>Confirmação de ação irreversível:</strong> Iniciar cotação · Aprovar OC · Recusar OC · Excluir requisição</p>\n<p><strong>Formulário:</strong> Novo fornecedor · Novo produto · Nova lista · Nova regra automática · Selecionar marcas · Selecionar fornecedores · Gerar link de contagem</p>\n<p><strong>Comunicação:</strong> Mensagem para fornecedor (WhatsApp) · Itens sem retorno com rascunho de mensagem em massa</p>\n<p><strong>Bloqueio:</strong> Ir para o Mapa sem propostas recebidas — botão desabilitado com caminho de saída explícito</p>\n<hr />"}, {"id": "responsividade", "level": 2, "title": "Responsividade", "words": 48, "screens": [], "html": "<p>Desktop é o contexto principal do comprador — o produto é usado sentado, com tabelas largas. Abaixo de 1180px a navegação lateral vira rail de ícones.</p>\n<p>O portal do fornecedor e a contagem de estoque são os únicos fluxos com uso mobile real e devem ser desenhados mobile-first.</p>\n<hr />"}, {"id": "dois-publicos-dois-pesos", "level": 2, "title": "Dois públicos, dois pesos", "words": 32, "screens": [], "html": "<table>\n<thead>\n<tr>\n<th></th>\n<th>Comprador interno</th>\n<th>Fornecedor externo</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Frequência</td>\n<td>Diária</td>\n<td>Uma vez por cotação</td>\n</tr>\n<tr>\n<td>Treinamento</td>\n<td>Tem</td>\n<td>Nenhum</td>\n</tr>\n<tr>\n<td>Dispositivo</td>\n<td>Desktop</td>\n<td>Celular, frequentemente</td>\n</tr>\n<tr>\n<td>Tolerância a densidade</td>\n<td>Alta — é requisito</td>\n<td>Baixa</td>\n</tr>\n<tr>\n<td>Custo do erro</td>\n<td>Compra errada</td>\n<td>Abandono da proposta</td>\n</tr>\n</tbody>\n</table>"}]}, {"id": "estoque", "path": "01-modulos/estoque.md", "title": "Módulo de Estoque", "group": "01 · Módulos", "words": 1963, "sections": [{"id": "_intro", "level": 1, "title": "Módulo de Estoque", "words": 26, "screens": [], "html": "<blockquote>\n<p>Referência técnica para replicar o módulo de estoque do Foozi em outro projeto React.\nStack: <strong>React 18 · TypeScript · Vite · Tailwind CSS · react-router · sonner · @dnd-kit</strong></p>\n</blockquote>\n<hr />"}, {"id": "1-visao-geral-do-modulo", "level": 2, "title": "1. Visão geral do módulo", "words": 130, "screens": ["contagem", "estoque", "listacompra"], "html": "<p>O módulo de estoque é composto por <strong>9 telas</strong> acessadas a partir do menu lateral, sob a entrada \"Estoque\":</p>\n<table>\n<thead>\n<tr>\n<th>Rota</th>\n<th>Página</th>\n<th>Descrição</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td><code>/stock</code></td>\n<td>StockDashboardPage</td>\n<td>Visão geral: alertas, contagem ativa, KPIs, atalhos</td>\n</tr>\n<tr>\n<td><code>/inventory-counts</code></td>\n<td>InventoryCountsListPage</td>\n<td>Lista de contagens, criação, compartilhamento de link</td>\n</tr>\n<tr>\n<td><code>/inventory-count/:id</code></td>\n<td>InventoryCountPage</td>\n<td>Contagem individual — modo admin e modo estoquista</td>\n</tr>\n<tr>\n<td><code>/count/:id</code></td>\n<td>StockerCountPage</td>\n<td>Acesso direto do estoquista via link compartilhado</td>\n</tr>\n<tr>\n<td><code>/stock/purchase-list</code></td>\n<td>PurchaseNeedListPage</td>\n<td>Lista de necessidade de compra gerada após contagem</td>\n</tr>\n<tr>\n<td><code>/stock/config</code></td>\n<td>StockConfigPage</td>\n<td>Configuração de mínimo/ideal/custo + disparo automático</td>\n</tr>\n<tr>\n<td><code>/stock/history</code></td>\n<td>CountHistoryPage</td>\n<td>Histórico de contagens finalizadas</td>\n</tr>\n<tr>\n<td><code>/stock/movements</code></td>\n<td>StockMovementsPage</td>\n<td>Movimentações de entrada e saída</td>\n</tr>\n<tr>\n<td><code>/stock/transfer</code></td>\n<td>StockTransferPage</td>\n<td>Transferência de estoque entre filiais (unitária ou em lote)</td>\n</tr>\n<tr>\n<td><code>/stock/suggest-ideal</code></td>\n<td>StockSuggestIdealPage</td>\n<td>Sugestão de estoque ideal baseada em consumo médio</td>\n</tr>\n<tr>\n<td><code>/movements</code></td>\n<td>CMVPage</td>\n<td>Custo da Mercadoria Vendida (CMV)</td>\n</tr>\n</tbody>\n</table>\n<hr />"}, {"id": "2-dependencias", "level": 2, "title": "2. Dependências", "words": 18, "screens": [], "html": "<pre><code class=\"language-bash\">npm install react-router sonner @dnd-kit/core @dnd-kit/sortable react-dnd react-dnd-html5-backend\n</code></pre>\n<hr />"}, {"id": "3-tipos-typescript-appcontext", "level": 2, "title": "3. Tipos TypeScript (AppContext)", "words": 239, "screens": [], "html": "<pre><code class=\"language-ts\">export interface Product {\n  id: string;\n  name: string;\n  code: string;\n  categoryId: string;\n  unit: string;\n  currentStock: number;\n  minimumStock: number;\n  maximumStock?: number;\n  idealStock?: number;\n  costPrice: number;\n  supplierId?: string;\n  active: boolean;\n  archived: boolean;\n  inCountList: boolean;\n}\n\nexport interface Category {\n  id: string;\n  name: string;\n  color?: string;\n  sortOrder: number;\n  active: boolean;\n}\n\nexport type CountStatus =\n  | 'draft' | 'open' | 'in_progress' | 'paused'\n  | 'finished' | 'reviewing' | 'approved' | 'cancelled';\n\nexport type StockLevel =\n  | 'critical' | 'below_min' | 'attention' | 'ok'\n  | 'excess' | 'not_configured' | 'no_recent_count' | 'pending';\n\nexport type UserRole =\n  | 'admin' | 'owner' | 'manager' | 'buyer' | 'internal' | 'stocker';\n\nexport interface LocationCount {\n  id: string;\n  location: string;\n  quantity: number;\n}\n\nexport interface InventoryCountItem {\n  id: string;\n  inventoryCountId: string;\n  productId: string;\n  productName: string;\n  productCode: string;\n  productUnit: string;\n  categoryId: string;\n  categoryName: string;\n  systemQuantity: number;\n  minimumStock: number;\n  idealStock: number;\n  countedQuantity: number | null;\n  difference: number;\n  status: 'pending' | 'counted' | 'divergence' | 'invalid';\n  stockLevel: StockLevel;\n  locationCounts?: LocationCount[];\n  isFavorite?: boolean;\n}\n\nexport interface InventoryCount {\n  id: string;\n  name: string;\n  companyName: string;\n  responsibleId: string;\n  responsibleName: string;\n  responsibleRole?: UserRole;\n  status: CountStatus;\n  totalItems: number;\n  countedItems: number;\n  pendingItems: number;\n  divergentItems: number;\n  invalidItems: number;\n  criticalItems?: number;\n  excessItems?: number;\n  startedAt: Date;\n  finishedAt?: Date;\n  autoSave: boolean;\n  purchaseListId?: string;\n}\n\nexport interface PurchaseNeedItem {\n  id: string;\n  purchaseListId: string;\n  productId: string;\n  productName: string;\n  productUnit: string;\n  categoryName: string;\n  currentStock: num
